function rGuias(){
  const hrs=[...DB[ARCH.hr].data.hojas].reverse();
  const ocsAct=DB[ARCH.oc].data.ordenes.filter(o=>ocEstado(o)!=='despachada');
  return `
  ${formLeerGuia()}
  ${formPendiente('guias_despacho','.pdf,.xls,.xlsx,.doc,.docx,.jpg,.jpeg,.png')}
  ${listaPend('guias_despacho')}
  ${(()=>{ // Hojas de ruta que quedaron SIN guías (p. ej. tras eliminar todas): no aparecerían
     // en ningún grupo de abajo, así que se avisan aquí para no perderlas de vista.
     const huerfanas=hrs.filter(h=>!(h.guias||[]).length);
     return huerfanas.length?`<div class="card" style="border-color:var(--ambar)"><i class="fa-solid fa-triangle-exclamation" style="color:var(--ambar)"></i> ${huerfanas.map(h=>`Hoja de Ruta N°${esc(String(h.numero))} (envío ${fFecha(h.fecha_envio||h.fecha)}) quedó sin guías.`).join(' ')} Reingresa una guía con esa fecha de envío para reincorporarla.</div>`:'';
   })()}
  <h2>Guías registradas</h2>
  ${DB[ARCH.guias].data.guias.length?barraFichas():''}
  ${(()=>{
    const gs=DB[ARCH.guias].data.guias;
    if(!gs.length)return '<div class="card vacio">Aún no hay guías registradas.</div>';
    /* Agrupadas por HOJA DE RUTA (Jefe, 24-07-2026): una hoja = un viaje, y ese es el orden
       en que se recorre el despacho. Dentro de cada hoja, si el viaje tuvo varios destinos,
       las guías se ordenan por bodega en el orden fijo de recorrido. Las guías que aún no
       están en ninguna hoja van aparte, al inicio, siempre abiertas: son un pendiente por
       resolver, no historial, así que quedan FUERA de la agrupación por mes (Jefe, 30-07-2026).
       El resto se aglomera por MES según la fecha de envío del viaje, con la Hoja de Ruta
       anidada adentro tal como ya funcionaba. */
    const hojas=DB[ARCH.hr].data.hojas;
    const porHoja={};
    gs.forEach(g=>{const k=hrClaveGuia(g);
      (porHoja[k]=porHoja[k]||[]).push(g)});
    const numReal=k=>+String(k).split(':')[1]||0;
    const numsReales=Object.keys(porHoja).filter(k=>k!=='__sin__').sort((a,b)=>numReal(b)-numReal(a));
    const ordBod=g=>{const i=bodegasOrden().indexOf(normBodega(g.destino||''));return i<0?99:i};
    const bloqueHoja=(k,sin)=>{
      const lista=[...porHoja[k]].sort((a,b)=>ordBod(a)-ordBod(b)||String(a.numero).localeCompare(String(b.numero),'es',{numeric:true}));
      const hoja=sin?null:hojas.find(x=>hrClave(x)===k);
      const tp=hoja?hrTipo(hoja):'ruta', num=hoja?String(hoja.numero):String(k).split(':')[1];
      const dests=[...new Set(lista.map(g=>normBodega(g.destino||'Sin destino')))]
        .sort((a,b)=>bodegasOrden().indexOf(a)-bodegasOrden().indexOf(b));
      const btnGen=sin?'':`<button class="btn mini sec" title="${hoja&&hoja.archivo?'Rehacer el documento con las guías que tiene hoy':'Crear el documento Word'}" onclick="event.preventDefault();event.stopPropagation();generarDocumento('${esc(tp)}','${esc(num)}')"><i class="fa-solid fa-file-word"></i> ${hoja&&hoja.archivo?'Regenerar':'Generar'}</button>`;
      const desc=(hoja&&hoja.archivo
        ?`<button class="btn mini" title="Descargar ${esc(hrLbl(tp))} N°${esc(num)}" onclick="event.preventDefault();event.stopPropagation();descargarArchivo('${esc(hoja.archivo)}','${esc(HR_TIPOS[tp].archivo)}_N${esc(num)}_${esc(fFecha(hoja.fecha_envio||hoja.fecha))}.docx')"><i class="fa-solid fa-download"></i> ${esc(hrLbl(tp))}</button>`
        :(sin?'':'<span class="chip ambar" title="El documento aún no se ha generado">sin archivo</span>'))+btnGen;
      const he=hojaEstado(lista);
      const nConf=lista.filter(g=>g.conforme).length;
      const chipEstado=sin?'':`<span class="chip ${ESTADO_COLOR[he]}" title="${he==='parcial'?`${nConf} de ${lista.length} guías confirmadas`:(he==='despachada'?'Todas las guías confirmadas':'Ninguna guía confirmada todavía')}">${HOJA_LBL[he]}</span>`;
      const titulo=sin
        ?'<span class="chip ambar">Sin documento asignado</span>'
        :`<b>${esc(hrLbl(tp))} N°${esc(num)}</b>${tp==='retiro'?'<span class="chip" title="La mercadería la retira el cliente">retiro</span>':''}${chipEstado}${hoja?` <span class="chip">Envío ${fFecha(hoja.fecha_envio||hoja.fecha)}</span>`:''}`;
      const key='hoja:'+k;
      return{lista,fecha:sin?null:(hoja?(hoja.fecha_envio||hoja.fecha):null),
        html:`<details class="acc-fecha ${sin?'':'hr-'+ESTADO_COLOR[he]}" data-k="${esc(key)}"${sin||fichaAbierta(key)?' open':''} ontoggle="recordarFicha(this)"><summary>${titulo}<span class="muted small">${esc(dests.join(' · '))}</span><span class="cnt">${lista.length} guía(s)</span>${desc}</summary><div class="cuerpo">
        ${lista.map(tarjetaGuia).join('')}
      </div></details>`};
    };
    let out=porHoja.__sin__?bloqueHoja('__sin__',true).html:'';
    const bloques=numsReales.map(k=>bloqueHoja(k,false));
    out+=renderMeses('guias',agruparPorMes(bloques,b=>b.fecha),([mk,items])=>{
      const todasGuias=items.flatMap(b=>b.lista);
      const c=contarEstados(todasGuias,guiaEstado,{ok:'conforme',pend:'pendiente',parcial:'parcial'});
      return accMes('guias:'+mk,mesLbl(mk),`${todasGuias.length} documento${todasGuias.length===1?'':'s'} (${cntEstados(c)})`,
        items.map(b=>b.html).join(''));
    });
    return out;
  })()}`;
}
/* Tarjeta de una guía. Las diferencias de NOMBRE ya se ven en la tabla (columna en ámbar).
   Las diferencias de COMPRA (se despachó más de lo comprado) se muestran como icono rojo
   junto a la cantidad; al pasar el mouse explica el problema y ofrece ingresar la compra. */
function tarjetaGuia(g){
  const oc=DB[ARCH.oc].data.ordenes.find(o=>String(o.folio)===String(g.oc||g.folio_oc));
  const nomOC=cod=>{const i=oc&&oc.items.find(x=>x.codigo===cod);return i?i.producto:null};
  const faltaCompra=it=>{ // devuelve cuánto falta comprar para cubrir lo despachado
    if(!oc)return 0;
    const i=oc.items.find(x=>x.codigo===it.codigo)||oc.items.find(x=>x.producto.trim().toUpperCase()===it.producto.trim().toUpperCase());
    if(!i)return 0;
    return Math.max((+i.cantidad_despachada||0)-(+i.cantidad_comprada||0),0);
  };
  const hayFalta=g.items.some(i=>faltaCompra(i)>0);
  const ge=guiaEstado(g);
  return `<div class="tag"><div class="bar ${GUIA_ESTADO_COLOR[ge]}"></div><div class="body">

        if(oc)return '';

                  :`<span class="chip rojo" title="Ni la OC ni el reporte del cliente respaldan esta guía">Sin OC ni respaldo</span>`;

      ${g.hoja_ruta?'':'<span class="chip ambar">Sin documento asignado</span>'}
      <button class="btn mini peligro" style="margin-left:auto" onclick="borrarGuia('${esc(g.numero)}')">Eliminar</button>
    </div>
    <table class="tprod" style="margin-top:12px;min-width:380px"><colgroup><col><col style="width:11ch"></colgroup>
      <tr><th>Producto</th><th class="num">Cantidad</th></tr>
    ${g.items.map(i=>{const no=nomOC(i.codigo);
      // El nombre que manda es el de la OC. Si la guía usó otro, se anota al costado; si es el

      const otro=i.nombre_guia||i.producto;

      const falta=faltaCompra(i);
      return `<tr>

        <td class="num">${num(i.cantidad)} ${esc(i.unidad||'')}${falta>0?` <i class="fa-solid fa-circle-exclamation alerta-cifra" title="Se despacharon ${num(i.cantidad)} pero faltan ${num(falta)} por registrar como comprados. Ingresa la compra para cuadrar el inventario."></i>`:''}</td></tr>`}).join('')}</table>
    ${hayFalta?`<div style="margin-top:10px"><button class="btn mini" style="background:none;border:1.5px solid var(--rojo);color:var(--rojo)" onclick="compraFaltante('${esc(g.numero)}',this)"><i class="fa-solid fa-cart-plus"></i> Ingresar compra faltante</button>

      ${g.rectificaciones.map((r,ri)=>`<div><b>Rectificada ${fFecha(r.fecha)}</b> — ${r.items.map(x=>`${esc(x.producto)} <span class="mono">−${num(x.cantidad)}</span> (${x.motivo==='merma'?'perdido o roto':'quedó en bodega'})`).join(' · ')}${r.nota?` · ${esc(r.nota)}`:''}
        <button class="btn mini sec" style="margin-left:6px" onclick="anularRectificacion('${esc(g.numero)}',${ri})" title="Deshacer esta rectificación y dejar la guía como estaba"><i class="fa-solid fa-arrow-rotate-left"></i> Anular</button></div>`).join('')}
    </div>`:''}
    <div class="acciones" style="margin-top:10px">

      <button class="btn mini sec" onclick="rectificarGuia('${esc(g.numero)}')" title="Hubo productos que no se pudieron despachar"><i class="fa-solid fa-rotate-left"></i> Rectificar${g.conforme?'':' guía'}</button>
      <button class="btn mini sec" onclick="moverGuia('${esc(g.numero)}')" title="Cambiar esta guía de viaje (hoja de ruta)"><i class="fa-solid fa-arrows-turn-to-dots"></i> Mover de hoja</button>
      ${/* Descargar el PDF original de Facto, igual que en las OC (Jefe, 20-08-2026).
           Se baja con el nombre Guia_N.pdf, no con el nombre largo del DTE. */''}
      ${g.archivo?`<button class="btn mini sec" onclick="descargarArchivo('${esc(g.archivo)}','Guia_${esc(g.numero)}.pdf')" title="Descargar el PDF de la guía N°${esc(g.numero)}"><i class="fa-solid fa-download"></i> Descargar guía</button>`:''}
    </div>
    <div id="mv-${esc(g.numero)}"></div>
    <div id="rg-${esc(g.numero)}"></div>
  </div></div>`;
}
/* ===== Guías modulares: mover una guía a otra hoja de ruta =====
   Los viajes cambian (dos rutas se juntan, un viaje se parte). Al mover (Jefe, 29-07-2026):
   la guía adopta la fecha de envío del viaje de destino; ambas hojas quedan "sin archivo"
   porque el .docx impreso ya no refleja el viaje y debe regenerarse; si la hoja de origen
   queda vacía se ELIMINA y, si era la de número más alto, el correlativo retrocede: ese
   número se puede reutilizar porque ese viaje nunca existió. */
function moverGuia(numero){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  if(!g)return;
  const box=document.getElementById('mv-'+numero);
  if(box.innerHTML){box.innerHTML='';return}
  const hojas=DB[ARCH.hr].data.hojas.filter(h=>hrClave(h)!==hrClaveGuia(g));
  /* Primero las Hojas de Ruta y despues los Resumenes de Retiro, y dentro de cada grupo la
     mas reciente arriba (Jefe, 17-08-2026). Antes se ordenaba por el nombre del tipo, y como
     'retiro' va antes que 'ruta' en el alfabeto, los retiros quedaban primero sin que nadie
     lo hubiera decidido. El orden se fija con un peso explicito, no con el alfabeto. */
  const pesoTipo=h=>hrTipo(h)==='ruta'?0:1;
  const abiertas=hojas.filter(h=>(h.estado||'borrador')==='borrador')
    .sort((a,b)=>pesoTipo(a)-pesoTipo(b)||(+b.numero)-(+a.numero));

  box.innerHTML=`<div style="border-top:1.5px dashed var(--line);margin-top:12px;padding-top:10px">
    <b>Mover la guía N°${esc(numero)} a otro documento</b>
    <p class="small muted">Puede ir a una Hoja de Ruta (la entregamos nosotros) o a un Resumen de Retiros (la retira el cliente). La guía tomará la fecha del documento de destino, y los documentos afectados quedarán "sin archivo" hasta regenerarlos.</p>
    <label>Documento de destino</label>
    <select id="mv-dest-${esc(numero)}" onchange="document.getElementById('mv-nueva-${esc(numero)}').style.display=this.value.startsWith('__nueva__')?'block':'none'">
      ${abiertas.map(h=>`<option value="${esc(hrClave(h))}">${esc(hrLbl(hrTipo(h)))} N°${esc(String(h.numero))} · ${fFecha(h.fecha_envio||h.fecha)} · ${(h.guias||[]).length} guía(s)</option>`).join('')}
      <option value="__nueva__:ruta">Nueva Hoja de Ruta…</option>
      <option value="__nueva__:retiro">Nuevo Resumen de Retiros…</option>
    </select>
    <div id="mv-nueva-${esc(numero)}" style="display:none">
      <label>Fecha del documento nuevo</label>
      <input type="date" id="mv-fecha-${esc(numero)}" value="${hoyISO()}">
      <p class="small muted">Hoja de Ruta N°${esc(String(DB[ARCH.conf].data.proxima_hoja_ruta||1))} · Resumen de Retiros N°${esc(String(DB[ARCH.conf].data.proximo_resumen_retiro||1))}, según lo que elijas arriba.</p>
    </div>
    <div class="acciones"><button class="btn mini" onclick="guardarMoverGuia('${esc(numero)}')">Mover</button><button class="btn mini sec" onclick="moverGuia('${esc(numero)}')">Cancelar</button></div>
  </div>`;
}
async function guardarMoverGuia(numero){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  if(!g)return;
  const sel=document.getElementById('mv-dest-'+numero).value;
  const hojas=DB[ARCH.hr].data.hojas;
  let hNueva, creada=false;
  // El selector manda "__nueva__:ruta" o "__nueva__:retiro" al crear, y "tipo:numero"
  // al elegir uno existente. Comparar contra "__nueva__" pelado no calzaba nunca.
  if(sel.startsWith('__nueva__')){
    const tp=HR_TIPOS[sel.split(':')[1]]?sel.split(':')[1]:'ruta';
    const f=(document.getElementById('mv-fecha-'+numero).value||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){toast('Indica la fecha del documento nuevo.');return}
    // Un documento por fecha Y POR TIPO: el mismo día puede haber una Hoja de Ruta y un
    // Resumen de Retiros, pero no dos del mismo tipo, o se pisarían al generar el .docx.
    const yaHay=hojas.find(h=>String(h.fecha_envio||h.fecha)===f&&hrTipo(h)===tp);
    if(yaHay){toast(`El ${fFecha(f)} ya tiene ${hrLbl(tp)} N°${yaHay.numero}: elígelo en la lista.`);return}
    const conf=DB[ARCH.conf].data, clave=HR_TIPOS[tp].conf;
    const num=+conf[clave]||(hojas.filter(h=>hrTipo(h)===tp).reduce((m,h)=>Math.max(m,+h.numero||0),0)+1);
    hNueva={numero:num,tipo:tp,fecha_envio:f,fecha:null,guias:[],destinos:[],estado:'borrador',archivo:null};
    hojas.push(hNueva);
    conf[clave]=num+1;
    creada=true;
  }else{
    hNueva=hojas.find(h=>hrClave(h)===sel);
    if(!hNueva){toast('No se encontró el documento de destino.');return}
    if((hNueva.estado||'borrador')!=='borrador'){toast(`${hrLbl(hrTipo(hNueva))} N°${hNueva.numero} está cerrado.`);return}
  }
  const destNum=hNueva.numero, destTipo=hrTipo(hNueva), destLbl=hrLbl(destTipo);
  const hVieja=hojaDeGuia(g);
  velo(true,'Moviendo guía…');
  try{
    let aviso='';
    if(hVieja){
      hVieja.guias=(hVieja.guias||[]).filter(n=>String(n)!==String(numero));
      hVieja.archivo=null;
    }
    hNueva.guias=[...new Set([...(hNueva.guias||[]),String(numero)])].sort((a,b)=>(+a)-(+b));
    hNueva.archivo=null;
    g.hoja_ruta=+hNueva.numero;g.hoja_tipo=destTipo;
    g.fecha_envio=hNueva.fecha_envio||hNueva.fecha||g.fecha_envio;
    const gs=DB[ARCH.guias].data.guias;
    const dests=h=>[...new Set((h.guias||[]).map(n=>{const x=gs.find(y=>String(y.numero)===String(n));return x?normBodega(x.destino||''):null}).filter(Boolean))]
      .sort((a,b)=>bodegasOrden().indexOf(a)-bodegasOrden().indexOf(b));
    hNueva.destinos=dests(hNueva);
    if(hVieja)hVieja.destinos=dests(hVieja);
    if(hVieja&&!hVieja.guias.length){
      const tpV=hrTipo(hVieja), claveV=HR_TIPOS[tpV].conf;
      hojas.splice(hojas.indexOf(hVieja),1);
      const conf=DB[ARCH.conf].data;
      const maxN=hojas.filter(h=>hrTipo(h)===tpV).reduce((m,h)=>Math.max(m,+h.numero||0),0);
      conf[claveV]=maxN+1;
      await guardarArchivo(ARCH.conf,`${hrLbl(tpV)} N°${hVieja.numero} eliminado por quedar vacío`);
      aviso=` · ${hrLbl(tpV)} N°${hVieja.numero} quedó vacío y se eliminó (próximo: ${conf[claveV]})`;
    }
    if(creada)await guardarArchivo(ARCH.conf,`${destLbl} N°${destNum} creado (${hNueva.fecha_envio})`);
    await guardarArchivo(ARCH.guias,`Guía N°${numero} movida a ${destLbl} N°${destNum}`);
    await guardarArchivo(ARCH.hr,`${destLbl} N°${destNum}: entra la guía N°${numero}`);
    toast(`Guía N°${numero} ${creada?`en el NUEVO ${destLbl} N°${destNum} (${fFecha(hNueva.fecha_envio)})`:`movida a ${destLbl} N°${destNum}`}${aviso}. Documento pendiente de regenerar.`);
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* ===== Conformidad y rectificación de una guía (logística inversa) =====
   La guía se emite con lo que se VA a despachar. Si algo se rompe, se pierde o no alcanza a
   subir al camión, se rectifica: esas unidades vuelven a quedar PENDIENTES en la OC y reaparecen
   en el Panel. Qué pasa con el stock depende del motivo (Jefe, 24-07-2026):
     · "quedó en bodega" → la mercadería sigue siendo nuestra: vuelve al inventario y NO hay que
       volver a comprarla.
     · "se perdió o se rompió" → la mercadería ya no existe: el stock NO vuelve y además se
       descuenta de lo comprado, para que el Panel la muestre otra vez como POR COMPRAR. */
async function conformarGuia(numero){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  if(!g)return;
  g.conforme=true;g.fecha_conforme=hoyISO();
  velo(true,'Confirmando…');
  try{await guardarArchivo(ARCH.guias,`Guía N°${numero} conforme`);toast(`Guía N°${numero} conforme`);render()}
  catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
function rectificarGuia(numero){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  if(!g)return;
  const box=document.getElementById('rg-'+numero);
  if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML=`<div style="border-top:1.5px dashed var(--line);margin-top:12px;padding-top:10px">
    <b>Rectificar la guía N°${esc(numero)}</b>
    <p class="small muted">Indica cuántas unidades NO se pudieron despachar. Volverán a quedar pendientes en la OC ${esc(g.oc||g.folio_oc)} y reaparecerán en el Panel.</p>
    <table class="tprod" style="margin-top:8px;min-width:520px"><colgroup><col><col style="width:9ch"><col style="width:12ch"><col style="width:19ch"></colgroup>
      <tr><th>Producto</th><th class="num">Despachado</th><th>No despachado</th><th>¿Qué pasó?</th></tr>
      ${g.items.map((i,ix)=>`<tr>
        <td class="trunc" title="${esc(i.producto)}">${esc(i.producto)}</td>
        <td class="num">${num(i.cantidad)}</td>
        <td><input type="number" data-ix="${ix}" min="0" max="${i.cantidad}" step="any" value="0"></td>
        <td><select data-motivo="${ix}">
          <option value="bodega">Quedó en bodega</option>
          <option value="merma">Se perdió o se rompió</option>
        </select></td>
      </tr>`).join('')}
    </table>
    <label>Nota (opcional)</label><input id="rg-nota-${esc(numero)}" placeholder="ej: se quebró al cargar el camión">
    <div class="acciones"><button class="btn mini" onclick="guardarRectificacion('${esc(numero)}')">Guardar rectificación</button><button class="btn mini sec" onclick="rectificarGuia('${esc(numero)}')">Cancelar</button></div>
  </div>`;
}
async function guardarRectificacion(numero){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  if(!g)return;
  const folio=g.oc||g.folio_oc;
  const o=DB[ARCH.oc].data.ordenes.find(x=>String(x.folio)===String(folio));
  const box=document.getElementById('rg-'+numero);
  const filas=[...box.querySelectorAll('input[type=number]')].map(inp=>({
    ix:+inp.dataset.ix,cant:+inp.value||0,
    motivo:box.querySelector(`select[data-motivo="${inp.dataset.ix}"]`).value})).filter(f=>f.cant>0);
  if(!filas.length){toast('Indica al menos una cantidad no despachada.');return}
  for(const f of filas){
    const it=g.items[f.ix];
    if(f.cant>(+it.cantidad||0)){toast(`"${it.producto}": la guía despachó ${num(it.cantidad)}.`);return}
  }
  const nota=document.getElementById('rg-nota-'+numero).value.trim();
  const fecha=hoyISO();
  velo(true,'Rectificando guía…');
  try{
    const inv=DB[ARCH.inv].data;
    const detalle=[];
    for(const f of filas){
      const it=g.items[f.ix];
      // 1. La guía despachó menos de lo que decía
      it.cantidad=(+it.cantidad||0)-f.cant;
      // 2. La línea de la OC vuelve a quedar pendiente
      if(o){
        const oi=o.items.find(x=>x.codigo===it.codigo)
              ||o.items.find(x=>String(x.producto).trim().toUpperCase()===String(it.producto).trim().toUpperCase());
        if(oi){
          oi.cantidad_despachada=Math.max(0,(+oi.cantidad_despachada||0)-f.cant);
          // Si se perdió o rompió, además hay que volver a comprarla
          if(f.motivo==='merma')oi.cantidad_comprada=Math.max(0,(+oi.cantidad_comprada||0)-f.cant);
        }
      }
      // 3. Inventario: el despacho no ocurrió para esas unidades → vuelven…
      // Resolver por código NOV (fiable); si no está en inventario aún, se crea la línea
      let p=it.codigo?inv.productos.find(x=>x.codigo===it.codigo):null;
      if(!p){
        const m=it.codigo?DB[ARCH.prod].data.productos.find(x=>x.codigo===it.codigo):null;
        p=m?{codigo:m.codigo,nombre:m.nombre,cantidad:0,unidad:m.unidad||'UN'}:invProdDe(it.producto,it.unidad);
        if(m)inv.productos.push(p);
      }
      p.cantidad+=f.cant;
      inv.movimientos.push({fecha,tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:f.cant,
        referencia:`Rectificación guía N°${numero}: no despachado`});
      // …y si se perdieron o rompieron, salen como merma (neto: el stock no vuelve)
      if(f.motivo==='merma'){
        p.cantidad=Math.max(0,p.cantidad-f.cant);
        inv.movimientos.push({fecha,tipo:'salida',codigo:p.codigo,producto:p.nombre,cantidad:f.cant,
          referencia:`Merma: producto perdido o roto (guía N°${numero})`});
      }
      // `item_ref` e `ix` se guardan para poder ANULAR la rectificación después: si la línea
      // queda en cero sale de la guía, y sin esta copia no habría cómo reconstruirla con su
      // unidad y su precio (su campo `cantidad` ya viene descontado y no se usa al restaurar).
      // `ix` devuelve la línea a su posición original dentro de la guía.
      detalle.push({codigo:it.codigo,producto:it.producto,cantidad:f.cant,motivo:f.motivo,
        ix:f.ix,item_ref:JSON.parse(JSON.stringify(it))});
    }
    // 4. Ítems que quedaron en cero se sacan de la guía
    g.items=g.items.filter(i=>(+i.cantidad||0)>0);
    g.rectificaciones=g.rectificaciones||[];
    g.rectificaciones.push({fecha,items:detalle,nota,conforme_previo:!!g.conforme});
    g.conforme=true;g.fecha_conforme=fecha;
    await guardarArchivo(ARCH.guias,`Guía N°${numero} rectificada`);
    if(o)await guardarArchivo(ARCH.oc,`OC ${folio}: rectificación de la guía N°${numero}`);
    await guardarArchivo(ARCH.inv,`Inventario: rectificación de la guía N°${numero}`);
    const merma=detalle.filter(d=>d.motivo==='merma').reduce((s,d)=>s+d.cantidad,0);
    toast(`Guía N°${numero} rectificada`+(merma>0?` · ${num(merma)} como merma, vuelven a estar por comprar`:''));
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
/* ===== Anular una rectificación (Jefe, 20-08-2026) =====
   Rectificar es fácil de hacer mal: el campo pide lo que NO se despachó y es natural escribir
   lo que SÍ se entregó. Antes había que pedir la corrección a mano; ahora cada rectificación
   listada en la tarjeta trae su botón para deshacerla.
   Deshace EXACTAMENTE los cuatro efectos de `guardarRectificacion`, en orden inverso:
     1. Las unidades vuelven a la línea de la guía (o la línea se reconstruye desde `item_ref`
        si había quedado en cero y salió de la guía).
     2. La OC vuelve a contarlas como despachadas; si el motivo fue merma, también como compradas.
     3. Inventario: se compensa el movimiento original con su inverso. NUNCA se borra el
        movimiento anterior — el historial de bodega no se reescribe, se contrapesa. En el caso
        "merma" el original eran dos movimientos de neto cero, así que el reverso también lo es.
     4. El registro sale de `rectificaciones` y la guía recupera su estado de conformidad previo.
   Las rectificaciones hechas antes de esta versión no guardan `item_ref` ni `conforme_previo`:
   la línea se reconstruye desde la OC o el maestro y la conformidad se deja como está. */
async function anularRectificacion(numero,idx){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  if(!g||!(g.rectificaciones||[])[idx])return;
  const r=g.rectificaciones[idx];
  const det=(r.items||[]).map(x=>`${x.producto} +${num(x.cantidad)}`).join(' · ');
  const merma=(r.items||[]).filter(x=>x.motivo==='merma').reduce((s,x)=>s+(+x.cantidad||0),0);
  const ok=await confirmar({titulo:`Anular la rectificación del ${fFecha(r.fecha)}`,
    texto:`La guía N°${numero} vuelve a quedar como estaba antes de rectificarla: ${det}.\n`+
      `La OC ${g.oc||g.folio_oc||'(sin OC)'} las contará otra vez como despachadas`+
      (merma>0?`, y las ${num(merma)} unidades dadas por perdidas dejan de estar por comprar.`:'.')+
      `\nEl movimiento de bodega no se borra: se registra su inverso.`,
    confirmar:'Anular rectificación',peligro:true});
  if(!ok)return;
  const folio=g.oc||g.folio_oc;
  const o=DB[ARCH.oc].data.ordenes.find(x=>String(x.folio)===String(folio));
  const fecha=hoyISO();
  velo(true,'Anulando rectificación…');
  try{
    const inv=DB[ARCH.inv].data;
    for(const x of (r.items||[])){
      const cant=+x.cantidad||0;
      if(cant<=0)continue;
      // 1. Las unidades vuelven a la guía
      let it=g.items.find(i=>x.codigo&&i.codigo===x.codigo)
           ||g.items.find(i=>String(i.producto).trim().toUpperCase()===String(x.producto).trim().toUpperCase());
      if(it)it.cantidad=(+it.cantidad||0)+cant;
      else{
        const oi=o&&(o.items.find(i=>i.codigo===x.codigo)
                   ||o.items.find(i=>String(i.producto).trim().toUpperCase()===String(x.producto).trim().toUpperCase()));
        const m=x.codigo?DB[ARCH.prod].data.productos.find(p=>p.codigo===x.codigo):null;
        it=Object.assign({producto:x.producto,codigo:x.codigo||null,nombre_guia:x.producto,
              unidad:(oi&&oi.unidad)||(m&&m.unidad)||'UN',
              precio_unitario:(oi&&oi.precio_unitario)||null,marca:null},
            x.item_ref||{},{cantidad:cant});
        const pos=Number.isInteger(x.ix)?Math.min(x.ix,g.items.length):g.items.length;
        g.items.splice(pos,0,it);
      }
      // 2. La OC vuelve a contarlas como despachadas (y compradas, si fueron merma)
      if(o){
        const oi=o.items.find(i=>i.codigo===x.codigo)
              ||o.items.find(i=>String(i.producto).trim().toUpperCase()===String(x.producto).trim().toUpperCase());
        if(oi){
          oi.cantidad_despachada=(+oi.cantidad_despachada||0)+cant;
          if(x.motivo==='merma')oi.cantidad_comprada=(+oi.cantidad_comprada||0)+cant;
        }
      }
      // 3. Inventario: se compensa con el movimiento inverso, sin tocar el original
      let p=x.codigo?inv.productos.find(i=>i.codigo===x.codigo):null;
      if(!p){
        const m=x.codigo?DB[ARCH.prod].data.productos.find(i=>i.codigo===x.codigo):null;
        p=m?{codigo:m.codigo,nombre:m.nombre,cantidad:0,unidad:m.unidad||'UN'}:invProdDe(x.producto,it.unidad);
        if(m)inv.productos.push(p);
      }
      p.cantidad-=cant;
      inv.movimientos.push({fecha,tipo:'salida',codigo:p.codigo,producto:p.nombre,cantidad:cant,
        referencia:`Anulación de la rectificación de la guía N°${numero}`});
      if(x.motivo==='merma'){
        p.cantidad+=cant;
        inv.movimientos.push({fecha,tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:cant,
          referencia:`Anulación de la merma de la guía N°${numero}`});
      }
    }
    // 4. Fuera el registro y vuelve la conformidad que había antes
    g.rectificaciones.splice(idx,1);
    if(!g.rectificaciones.length)delete g.rectificaciones;
    if(typeof r.conforme_previo==='boolean'){
      g.conforme=r.conforme_previo;
      if(!g.conforme)delete g.fecha_conforme;
    }
    await guardarArchivo(ARCH.guias,`Guía N°${numero}: rectificación anulada`);
    if(o)await guardarArchivo(ARCH.oc,`OC ${folio}: anulada la rectificación de la guía N°${numero}`);
    await guardarArchivo(ARCH.inv,`Inventario: anulada la rectificación de la guía N°${numero}`);
    toast(`Rectificación anulada · la guía N°${numero} vuelve a su estado anterior`);
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
/* Ingreso de compra DESPUÉS de la guía (via de excepción, no el flujo normal).
   Registra la compra en la OC y, si se marca, ingresa al inventario. */
function compraFaltante(numero,btn){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  const oc=g&&DB[ARCH.oc].data.ordenes.find(o=>String(o.folio)===String(g.oc||g.folio_oc));

  const faltas=g.items.map(it=>{
    const i=oc&&(oc.items.find(x=>x.codigo===it.codigo)||oc.items.find(x=>x.producto.trim().toUpperCase()===it.producto.trim().toUpperCase()));
    if(!i)return null;
    const falta=Math.max((+i.cantidad_despachada||0)-(+i.cantidad_comprada||0),0);
    return falta>0?{ix:oc.items.indexOf(i),producto:i.producto,falta}:null;
  }).filter(Boolean);
  box.innerHTML=`<div style="border-top:1.5px dashed var(--line);margin-top:12px;padding-top:8px">
    <p class="small muted">Vía de excepción: normalmente la compra se ingresa antes de la guía. Registra aquí lo comprado para cuadrar la OC y el inventario.</p>
    <div class="grid2">
      <div><label>Proveedor</label><input id="cf-prov-${numero}" placeholder="ej: Ferretería El Volcán"></div>
      <div><label>Fecha de compra</label><input id="cf-fecha-${numero}" type="date" value="${hoyISO()}"></div>
    </div>
    <label style="text-transform:none;font-weight:400;letter-spacing:0;display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--texto)"><input type="checkbox" id="cf-bod-${numero}" checked style="width:auto"> Ingresar al inventario</label>
    <table class="tprod" style="margin-top:10px;min-width:440px"><colgroup><col><col style="width:10ch"><col style="width:16ch"></colgroup><tr><th>Producto</th><th class="num">Falta comprar</th><th>Comprado ahora</th></tr>
    ${faltas.map(f=>`<tr><td class="trunc" title="${esc(f.producto)}">${esc(f.producto)}</td><td class="num" style="color:var(--rojo);font-weight:600">${num(f.falta)}</td><td><input type="number" data-ix="${f.ix}" min="0" step="any" value="${f.falta}"></td></tr>`).join('')}</table>
    <div class="acciones"><button class="btn mini" onclick="guardarCompraFaltante('${numero}')">Guardar compra</button><button class="btn mini sec" onclick="compraFaltante('${numero}',this)">Cancelar</button></div>
  </div>`;
}
async function guardarCompraFaltante(numero){
  const g=DB[ARCH.guias].data.guias.find(x=>String(x.numero)===String(numero));
  const folio=g.oc||g.folio_oc;
  const oc=DB[ARCH.oc].data.ordenes.find(o=>String(o.folio)===String(folio));if(!oc)return;
  const box=document.getElementById('cf-'+numero);
  const prov=document.getElementById('cf-prov-'+numero).value.trim();
  const fecha=document.getElementById('cf-fecha-'+numero).value||hoyISO();
  const aBodega=document.getElementById('cf-bod-'+numero).checked;
  const filas=[...box.querySelectorAll('input[type=number]')].map(inp=>({ix:+inp.dataset.ix,cant:+inp.value||0})).filter(f=>f.cant>0);
  if(!filas.length){toast('Indica al menos una cantidad comprada.');return}
  velo(true,'Registrando compra…');
  try{
    const itemsC=filas.map(f=>({producto:oc.items[f.ix].producto,cantidad:f.cant}));
    // También aquí se puede comprar de más: a la OC solo lo pedido, el resto como stock libre.
    let sobra=0;
    filas.forEach(f=>{const it=oc.items[f.ix];
      const pend=Math.max((+it.cantidad||0)-(+it.cantidad_comprada||0),0);
      const imputa=Math.min(f.cant,pend);
      it.cantidad_comprada=(+it.cantidad_comprada||0)+imputa;
      sobra+=f.cant-imputa;});
    oc.compras=oc.compras||[];oc.compras.push({fecha,proveedor:prov,ingreso_bodega:aBodega,items:itemsC,posterior_guia:numero});
    if(aBodega){
      const inv=DB[ARCH.inv].data;
      itemsC.forEach(it=>{const p=invProdDe(it.producto);p.cantidad+=it.cantidad;
        inv.movimientos.push({fecha,tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:it.cantidad,referencia:`Compra OC ${folio} (posterior a guía N°${numero})${prov?' · '+prov:''}`})});
      await guardarMaestroSiNuevo();
    }
    await guardarArchivo(ARCH.oc,`OC ${folio}: compra posterior a guía N°${numero}`);
    if(aBodega)await guardarArchivo(ARCH.inv,`Inventario: ingreso por compra posterior a guía N°${numero}`);
    toast('Compra registrada'+(sobra>0?` · ${num(sobra)} sobre lo pedido quedan como stock libre`:''));render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

async function guardarEditOC(fe){
  const folio=decodeURIComponent(fe);
  const o=DB[ARCH.oc].data.ordenes.find(x=>x.folio===folio);if(!o)return;
  const nuevoFolio=document.getElementById('eo-folio-'+fe).value.trim();
  if(!nuevoFolio){toast('El folio no puede quedar vacío.');return}
  if(nuevoFolio!==folio&&DB[ARCH.oc].data.ordenes.some(x=>x.folio===nuevoFolio)){toast('Ya existe otra OC con ese folio.');return}
  const items=leerEdit('eo-items-'+fe,o.items);
  if(!items.length){toast('La OC debe tener al menos un ítem.');return}
  // No permitir dejar una cantidad por debajo de lo ya despachado
  for(const i of items){
    const desp=+i.cantidad_despachada||0;
    if(i.cantidad<desp){toast(`"${i.producto}": ya hay ${num(desp)} despachados, la cantidad no puede ser menor.`);return}
  }
  // No permitir quitar ítems con movimiento
  const quedan=new Set(items.map(i=>i._ix));
  const quitadoConMov=o.items.find((i,ix)=>!quedan.has(ix)&&((+i.cantidad_despachada||0)>0||(+i.cantidad_comprada||0)>0));
  if(quitadoConMov){toast(`No puedes quitar "${quitadoConMov.producto}": tiene compras o despachos registrados.`);return}
  velo(true,'Guardando cambios…');
  try{
    o.fecha_emision=document.getElementById('eo-femi-'+fe).value||o.fecha_emision;
    o.fecha_entrega=document.getElementById('eo-fent-'+fe).value||o.fecha_entrega;
    o.destino=document.getElementById('eo-dest-'+fe).value.trim();
    o.items=items.map(({_ix,...r})=>({cantidad_comprada:0,cantidad_despachada:0,...r}));
    let tocaGuias=false;
    if(nuevoFolio!==folio){
      o.folio=nuevoFolio;
      DB[ARCH.guias].data.guias.forEach(g=>{
        if(String(g.folio_oc)===folio){g.folio_oc=nuevoFolio;tocaGuias=true}
        if(String(g.oc)===folio){g.oc=nuevoFolio;tocaGuias=true}
      });
      const d=DB[ARCH.adj].data;let tocaAdj=false;
      d.registros.forEach(r=>{if(r.oc===folio){r.oc=nuevoFolio;tocaAdj=true}});
      d.descartes.forEach(r=>{if(r.oc===folio){r.oc=nuevoFolio;tocaAdj=true}});
      if(tocaAdj)await guardarArchivo(ARCH.adj,`Adjudicaciones: OC ${folio} renumerada a ${nuevoFolio}`);
    }
    await guardarArchivo(ARCH.oc,`OC ${nuevoFolio} modificada`);
    if(tocaGuias)await guardarArchivo(ARCH.guias,`Guías actualizadas: OC ${folio} renumerada a ${nuevoFolio}`);
    toast('OC actualizada');render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* ================= Lista de precios =================
   Vista DERIVADA: no tiene archivo propio. Reúne los precios de las OC cargadas y del reporte
   de Pendientes SAP (que también es listado de OC del cliente). Los precios de cotización NO
   entran: son oferta, no adjudicado. */
let preFiltro='',preSoloCon=false;
/* Los precios salen del HISTORIAL ACUMULATIVO (`historial_precios.json`), que guarda toda
   observación de precio de OC que hayamos tenido, incluidas las de documentos ya archivados.
   Motivo (Jefe, 29-07-2026): la lista de precios es la guía para cotizar, así que NO puede
   perderse cuando se limpia el Panel. Se completa con lo vigente por si algo aún no se anotó. */
function observacionesPrecio(){
  const obs={}; // codigo NOV -> [{fecha, oc, precio}]
  const vistos=new Set();
  const push=(cod,nombre,o)=>{
    if(!cod)cod='N:'+normProd(nombre);
    const k=cod+'|'+o.oc+'|'+o.precio+'|'+o.fecha;
    if(vistos.has(k))return;                 // la misma observación no se cuenta dos veces
    vistos.add(k);
    (obs[cod]=obs[cod]||[]).push(o);
  };
  ((DB[ARCH.hprec]&&DB[ARCH.hprec].data.observaciones)||[]).forEach(h=>{
    const p=+h.precio||0;if(!p)return;
    push(h.codigo||codigoDeItem(h.producto,null),h.producto,{fecha:h.fecha||'',oc:String(h.folio_oc||''),precio:p});
  });
  DB[ARCH.oc].data.ordenes.forEach(o=>o.items.forEach(i=>{
    const p=+i.precio_unitario||0;if(!p)return;
    push(codigoDeItem(i.producto,i.codigo),i.producto,{fecha:o.fecha_emision||'',oc:String(o.folio),precio:p});
  }));
  ((DB[ARCH.psap]&&DB[ARCH.psap].data.registros)||[]).forEach(r=>{
    const p=+r.precio_neto||0;if(!p)return;
    push(r.codigo||codigoDeItem(r.producto,null),r.producto,{fecha:r.fecha_doc||'',oc:String(r.doc_compras||''),precio:p});
  });
  // más reciente primero; a igual fecha, el precio más alto primero (suele ser el formato mayor)
  Object.values(obs).forEach(a=>a.sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||'')||y.precio-x.precio));
  return obs;
}
/* Último precio COTIZADO por producto: referencia para comparar oferta contra adjudicado.
   No entra en las 4 observaciones de OC ni en el cálculo de variación.
   Sale del HISTORIAL ACUMULATIVO (`historial_precios.json` → `cotizaciones`) más las
   cotizaciones vigentes, por el mismo motivo que los precios de OC: la oferta que hicimos no
   puede perderse cuando el documento se archiva o se limpia el Panel. */
function ultimaCotizacion(){
  const obs=[];
  ((DB[ARCH.hprec]&&DB[ARCH.hprec].data.cotizaciones)||[]).forEach(h=>{
    const p=+h.precio||0;if(!p)return;
    obs.push({cod:h.codigo||codigoDeItem(h.producto,null)||('N:'+normProd(h.producto)),
              precio:p,fecha:h.fecha||'',folio:String(h.folio||'')});
  });
  DB[ARCH.cot].data.cotizaciones.forEach(c=>c.items.forEach(i=>{
    const p=+i.precio_unitario||0;if(!p)return;
    obs.push({cod:codigoDeItem(i.producto,i.codigo)||('N:'+normProd(i.producto)),
              precio:p,fecha:c.fecha||'',folio:String(c.folio||'')});
  }));
  const m={};
  obs.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)))
     .forEach(o=>{m[o.cod]={precio:o.precio,fecha:o.fecha,folio:o.folio}});
  return m;
}
function rPrecios(){
  const obs=observacionesPrecio();
  const cots=ultimaCotizacion();
  const prods=DB[ARCH.prod].data.productos;
  let filas=prods.map(p=>({codigo:p.codigo,nombre:p.nombre,unidad:p.unidad||'UN',
                           precios:(obs[p.codigo]||[]).slice(0,4),cot:cots[p.codigo]||null}));
  // productos con precio que no estén en el maestro (por si acaso)
  Object.keys(obs).filter(k=>k.startsWith('N:')).forEach(k=>{
    filas.push({codigo:null,nombre:obs[k][0].producto||k.slice(2),unidad:'UN',precios:obs[k].slice(0,4),cot:cots[k]||null});
  });
  const conPrecio=filas.filter(f=>f.precios.length).length;
  if(preSoloCon)filas=filas.filter(f=>f.precios.length||f.cot);
  if(preFiltro){const q=preFiltro.toLowerCase();
    filas=filas.filter(f=>f.nombre.toLowerCase().includes(q)||String(f.codigo||'').toLowerCase().includes(q));}
  filas.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const celda=o=>`<span class="mono" title="OC ${esc(o.oc)} · ${fFecha(o.fecha)}">${clp(o.precio)}</span>`;
  const variacion=ps=>{
    if(ps.length<2)return '';
    const d=ps[0].precio-ps[1].precio;
    if(!d)return '<span class="muted" title="Sin cambio respecto al precio anterior">=</span>';
    const pct=Math.round(Math.abs(d)/ps[1].precio*100);
    return `<span style="color:var(--${d>0?'rojo':'verde'})" title="${d>0?'Subió':'Bajó'} ${clp(Math.abs(d))} respecto al precio anterior"><i class="fa-solid fa-arrow-${d>0?'up':'down'}" style="font-size:11px"></i> ${pct}%</span>`;
  };
  return `
  <h2>Lista de precios <span class="muted">· ${conPrecio} de ${prods.length} artículos con precio de OC</span></h2>
  <div class="filtro"><input placeholder="Buscar producto o código…" value="${esc(preFiltro)}" oninput="preFiltro=this.value;render();const i=document.querySelector('.filtro input');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">

  :'<div class="card vacio">No hay artículos que coincidan con la búsqueda.</div>'}`;

/* ================= Plantilla de inventario (Jefe, 30-07-2026) =================
   Circuito cerrado para hacer el inventario físico: se descarga una planilla con TODO el
   maestro (código + nombre + cantidad actual), se anotan las cantidades contadas en bodega y
   se vuelve a subir. La carga es DIRECTA, sin pasar por la cola del administrador, porque la
   planilla ya trae el código NOV resuelto: no hay nada que interpretar.
   REGLAS acordadas con el Jefe:
   - La planilla trae los 312 productos del maestro, no solo los que tienen stock.
   - Celda Cantidad VACÍA significa "lo conté y hay cero", así que se fija en 0.
     (Por eso la planilla se descarga con la cantidad actual ya escrita: lo que no se toca,
     no cambia; lo que se borra, queda en cero.)
   - Una fila SIN código NOV es un producto nuevo: se da de alta en el maestro con el
     siguiente correlativo disponible.
   - Es una foto completa del stock, así que se aplica como AJUSTE (cantidad absoluta), no
     como ingreso que suma. */
let _xlsxProm=null;
function cargarXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(_xlsxProm)return _xlsxProm;
  _xlsxProm=new Promise((ok,mal)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>ok(window.XLSX);
    s.onerror=()=>{_xlsxProm=null;mal(new Error('No se pudo cargar el lector de Excel. Revisa la conexión.'))};
    document.head.appendChild(s);
  });
  return _xlsxProm;
}
/* ══════ HOJA DE RUTA: generación del .docx desde el navegador ══════
   Un .docx es un ZIP con XML adentro, y entre una hoja de ruta y otra lo ÚNICO que cambia es
   word/document.xml. El logo flotante con sus offsets en EMU, los márgenes, los estilos y las
   relaciones son siempre los mismos. Por eso NO armamos un Word desde cero (ahí se pierde
   formato): bajamos la plantilla base, le reemplazamos el cuerpo entre <w:body> y <w:sectPr>,
   y volvemos a comprimir. La fidelidad no depende de reproducir bien el formato, depende de
   no tocarlo. Es el mismo procedimiento que usaba generar_hoja_ruta.py, portado al navegador
   para que el proceso sea autónomo. */
/* ═══ Lectura y parseo de la GUÍA DE DESPACHO de Facto ═══
   Este archivo es el que se pega en la app. Se prueba aquí primero contra los PDF reales.
   pdf.js no entrega líneas: entrega fragmentos sueltos con su posición. Hay que rearmar
   las líneas agrupando por coordenada Y y ordenando por X, o cualquier regex falla. */

/* Agrupa los fragmentos de una página en líneas de texto con columnas separadas. */
function hgLineasDePagina(items){
  const filas=new Map();
  items.forEach(it=>{
    const t=String(it.str||''); if(!t.trim())return;
    const y=Math.round(it.transform[5]), x=it.transform[4];
    const alto=Math.abs(it.transform[0])||Math.abs(it.height)||8;   // ~ tamaño de letra
    const ancho=(+it.width)||t.length*alto*0.5;                     // pdf.js sí trae el ancho real
    let k=[...filas.keys()].find(v=>Math.abs(v-y)<=Math.max(2,alto*0.3));
    if(k==null){k=y;filas.set(k,[])}
    filas.get(k).push({x,t,ancho,alto});
  });
  return [...filas.entries()].sort((a,b)=>b[0]-a[0]).map(([y,fs])=>{
    fs.sort((a,b)=>a.x-b.x);
    /* Un hueco grande entre fragmentos es un CAMBIO DE COLUMNA y se marca con dos
       espacios; uno chico es apenas la separación entre palabras. El umbral va contra
       el tamaño de letra, no contra un número fijo: un espacio mide ~0,3 del alto y un
       salto de columna es varias veces eso. */
    let s='',px=null,ph=8;
    fs.forEach(f=>{
      if(px!==null){const hueco=f.x-px; s+=hueco>ph*0.6?'  ':(hueco>ph*0.12?' ':'')}
      s+=f.t; px=f.x+f.ancho; ph=f.alto;
    });
    return {y,texto:s.replace(/\s+$/,'')};
  });
}
const hgNum=t=>+String(t||'').replace(/\./g,'').replace(/[^\d-]/g,'')||0;
const hgFechaISO=t=>{const m=/(\d{2})-(\d{2})-(\d{4})/.exec(t||'');return m?`${m[3]}-${m[2]}-${m[1]}`:null};

/* Un campo con su etiqueta. OJO: Facto usa DOS plantillas. En una, los campos van en la
   columna izquierda ("Chofer Nombre   GABRIEL VALENZUELA"); en la otra van en la derecha y
   la línea empieza con otro campo ("CREDITO 30 DIAS   Transportista Patente VDRL-74").
   Por eso la etiqueta se busca EN CUALQUIER PARTE de la línea, no anclada al inicio, y el
   separador puede ser un solo espacio. El valor termina donde empieza la columna siguiente. */
function hgCampo(lineas,etiqueta){
  const re=new RegExp(etiqueta+'\\s+([^\\s].*?)(?:\\s{2,}|$)','i');
  for(const l of lineas){const m=re.exec(l.texto); if(m&&m[1].trim())return m[1].trim()}
  return null;
}
/* Facto arma el encabezado en dos columnas y el ancho manda: una etiqueta o su valor pueden
   quedar partidos entre líneas ("Transportista / Patente  VDRL-74"), o el tipo de despacho
   escrito en el renglón de ARRIBA de su etiqueta. Buscar solo dentro de una línea deja esos
   campos vacíos, y así fue: 4 de 16 guías perdían el tipo de despacho y 2 la patente.
   Para los campos del encabezado se busca sobre el texto APLANADO: todas las líneas unidas. */
const hgPlano=lineas=>lineas.map(l=>l.texto).join(' ').replace(/\s+/g,' ');
const hgPrimeraCol=t=>String(t||'').split(/\s{2,}/)[0].trim()||null;

/* Línea de producto: NOMBRE [DESCRIPCION]  N UN  $precio ... $total
   El ancla es "<cantidad> <unidad>" seguido de un monto: es lo único que no varía. */
/* Cuando el nombre se fue a la línea de arriba, la fila queda EMPEZANDO por la cantidad y
   sin espacios delante. El molde normal exige dos espacios antes del número, así que no
   calzaba y el ítem se perdía entero. Este segundo molde cubre ese caso. */
const HG_RE_ITEM_SN=/^(\d+(?:[.,]\d+)?)\s*([A-ZÑ]{2,4})\s+\$\s?([\d.]+)\b.*?\$\s?([\d.]+)\s*$/;
const HG_RE_ITEM=/^(.*?)\s{2,}(\d+(?:[.,]\d+)?)\s*([A-ZÑ]{2,4})\s+\$\s?([\d.]+)\b.*?\$\s?([\d.]+)\s*$/;

function hgParsearGuia(lineas){
  const txt=lineas.map(l=>l.texto);
  const todo=txt.join('\n');
  const g={numero:null,fecha:null,cliente:null,rut_cliente:null,patente:null,chofer:null,
           oc:null,fecha_oc:null,destino_texto:null,observaciones:null,
           items:[],neto:0,iva:0,total:0,avisos:[]};

  const mN=/N\s*[ºo°]\s*(\d{3,})/i.exec(todo);            if(mN)g.numero=mN[1];
  const mF=/Fecha:\s*(\d{2}-\d{2}-\d{4})/i.exec(todo);    if(mF)g.fecha=hgFechaISO(mF[1]);
  g.cliente=hgCampo(lineas,'Señor\\(es\\)');
  const mR=/RUT\s{2,}([\d.]+-[\dkK])/.exec(todo);         if(mR)g.rut_cliente=mR[1];
  const plano=hgPlano(lineas);
  // Patente chilena: letras y dígitos con guion. Se busca ese molde junto a la etiqueta.
  const mp=/Patente\s*:?\s*([A-ZÑ]{2,4}\s?-\s?[A-Z0-9]{2,4})/i.exec(plano);
  g.patente=hgCampo(lineas,'Transportista Patente')||(mp?mp[1].replace(/\s/g,''):null);
  /* Facto declara quién traslada: "por cuenta del emisor" = la llevamos nosotros y va a una
     Hoja de Ruta; "por cuenta del receptor" = la retira el cliente y va a un Resumen de
     Retiros. Es un dato duro del documento, no una inferencia. */
  /* El texto del tipo de despacho es largo y casi siempre queda partido, a veces en el
     renglón anterior al de su etiqueta. Se busca la frase completa en el texto aplanado. */
  const mt=/por cuenta del (receptor|emisor)/i.exec(hgPlano(lineas));
  g.tipo_despacho=mt?mt[0]:(hgCampo(lineas,'Tipo de despacho')||'');
  g.es_retiro=mt?/receptor/i.test(mt[1]):null;
  const mc=/Chofer\s+Nombre\s*:?\s*([A-ZÑÁÉÍÓÚ][A-ZÑÁÉÍÓÚ ]{4,48}?)\s+(?:Chofer\s+RUT|Transportista|Condiciones|Servicio\/)/i.exec(plano);
  g.chofer=hgCampo(lineas,'Chofer Nombre')||(mc?mc[1].trim():null);

  // Referencia a la OC: "Orden de compra  4500973765  27-07-2026  BODEGA CENTRAL"
  const mOC=/Orden de compra\s{2,}(\d{6,})(?:\s{2,}(\d{2}-\d{2}-\d{4}))?(?:\s{2,}(.+?))?(?:\s{2,}\S*)?$/im.exec(todo);
  // El destino sale de la columna "Razón ref."; hay que cortar antes de que se cuele la
  // columna de montos que viene a la derecha ("BODEGA CENTRAL    Monto Exento").
  if(mOC){g.oc=mOC[1];g.fecha_oc=hgFechaISO(mOC[2]);g.destino_texto=hgPrimeraCol(mOC[3])}

  const iObs=txt.findIndex(t=>/^OBSERVACIONES/i.test(t.trim()));
  if(iObs>=0){
    const obs=txt.slice(iObs+1).map(t=>t.trim())
      .filter(t=>t&&!/Timbre|Resoluci|Verifique|Monto|IVA|Total|www\./i.test(t));
    if(obs.length)g.observaciones=obs[0];
  }
  if(!g.destino_texto&&g.observaciones)g.destino_texto=hgPrimeraCol(g.observaciones);
  // Los retiros no traen chofer ni patente: el cliente manda a alguien distinto cada vez
  // y no es dato nuestro. No es un error, es la señal de que esa guía va a un Resumen de
  // Retiros. Solo se avisa como dato faltante cuando falta UNO de los dos, que sí es raro.
  if(!g.chofer&&!g.patente)g.avisos.push('Sin chofer ni patente: es lo normal en un retiro del cliente');
  else if(!g.chofer)g.avisos.push('Trae patente pero no chofer: revísalo');
  else if(!g.patente)g.avisos.push('Trae chofer pero no patente: revísalo');

  const mNeto=/Monto Neto\s{2,}\$\s?([\d.]+)/i.exec(todo);   if(mNeto)g.neto=hgNum(mNeto[1]);
  const mIva=/IVA\s*19%\s{2,}\$\s?([\d.]+)/i.exec(todo);     if(mIva)g.iva=hgNum(mIva[1]);
  const mTot=/^\s*Total\s{2,}\$\s?([\d.]+)/im.exec(todo);    if(mTot)g.total=hgNum(mTot[1]);

  // Ítems: entre el encabezado de la tabla y la fila de referencias
  let ini=txt.findIndex(t=>/Servicio\/Producto/i.test(t));
  let fin=txt.findIndex(t=>/^\s*Documento ref\./i.test(t));
  if(ini<0)ini=0; if(fin<0)fin=txt.length;
  for(let i=ini+1;i<fin;i++){
    let m=HG_RE_ITEM.exec(txt[i]);
    if(!m){const sn=HG_RE_ITEM_SN.exec(txt[i]); if(sn)m=['', '', sn[1],sn[2],sn[3],sn[4]]}
    if(!m)continue;
    /* Un nombre largo se parte en varias líneas y la cantidad queda sola en la suya, con el
       lado izquierdo vacío. Sin recuperar el nombre de las líneas vecinas, el ítem se pierde
       entero: pasaba en la guía 1565, que leía uno de dos y el aviso de cuadratura lo delató. */
    let izq=m[1].trim();
    if(!izq){
      for(let k=i-1;k>ini;k--){
        const t=txt[k].trim();
        if(!t||HG_RE_ITEM.test(txt[k])||HG_RE_ITEM_SN.test(txt[k]))break;
        izq=t; break;
      }
      const sig=(txt[i+1]||'').trim();
      if(sig&&!HG_RE_ITEM.test(txt[i+1])&&!HG_RE_ITEM_SN.test(txt[i+1])&&sig.length<=24&&!/^(Documento ref|OBSERVAC|Monto|Total)/i.test(sig))
        izq=(izq+' '+sig).trim();
    }
    // El nombre y la descripción vienen separados por dos o más espacios
    const part=String(izq).split(/\s{2,}/);
    g.items.push({nombre_guia:part[0].trim(),descripcion:part.slice(1).join(' ').trim()||null,
      cantidad:+String(m[2]).replace(',','.'),unidad:m[3],
      precio_unitario:hgNum(m[4]),total:hgNum(m[5])});
  }

  // Cuadraturas: no corregimos, avisamos
  if(!g.numero)g.avisos.push('No pude leer el número de la guía');
  if(!g.fecha)g.avisos.push('No pude leer la fecha');
  if(!g.items.length)g.avisos.push('No encontré líneas de producto');
  g.items.forEach(it=>{
    if(Math.abs(it.cantidad*it.precio_unitario-it.total)>1)
      g.avisos.push(`${it.nombre_guia}: cantidad x precio no da el total de la línea`);
  });
  const suma=g.items.reduce((s,i)=>s+i.total,0);
  if(g.neto&&Math.abs(suma-g.neto)>1)g.avisos.push(`La suma de las líneas (${suma}) no cuadra con el neto (${g.neto})`);
  if(g.neto&&g.iva&&Math.abs(Math.round(g.neto*0.19)-g.iva)>2)g.avisos.push('El IVA no es el 19% del neto');
  return g;
}

/* Empareja las líneas de la guía contra las de la OC referenciada.
   La guía NO trae código: el ancla es el PRECIO UNITARIO, que en Facto sale de la misma OC.
   Nombre solo como desempate. Lo que no queda seguro se marca y lo revisa Jefe. */
function hgResolverContraOC(guia,oc){
  const nrm=t=>String(t||'').toUpperCase().replace(/Ñ/g,'N').replace(/[^A-Z0-9]/g,'');
  const usados=new Set();
  guia.items.forEach(it=>{
    it.codigo=null;it.producto=null;it.match=null;
    if(!oc){it.match='sin_oc';return}
    const libres=oc.items.map((x,ix)=>({x,ix})).filter(o=>!usados.has(o.ix));
    let c=libres.filter(o=>Math.abs((+o.x.precio_unitario||0)-it.precio_unitario)<=1);
    if(c.length>1){
      const porNom=c.filter(o=>nrm(o.x.producto)===nrm(it.nombre_guia));
      if(porNom.length===1)c=porNom;
      else{
        const porCant=c.filter(o=>(+o.x.cantidad||0)===it.cantidad);
        if(porCant.length===1)c=porCant;
      }
    }
    if(c.length===1){
      it.codigo=c[0].x.codigo;it.producto=c[0].x.producto;it.match='precio';
      usados.add(c[0].ix);return;
    }
    const nom=libres.filter(o=>nrm(o.x.producto)===nrm(it.nombre_guia));
    if(nom.length===1){
      it.codigo=nom[0].x.codigo;it.producto=nom[0].x.producto;it.match='nombre';
      usados.add(nom[0].ix);return;
    }
    it.match=c.length>1?'ambiguo':'sin_match';
  });
  return guia;
}

/* ── Lectura del PDF en el navegador ────────────────────────────────────────
   pdf.js ya viene en lib/ y lo carga cargarPdfJs(), que ya existía para el lector de OC.
   Aquí NO se redefine: había dos funciones con ese nombre y la segunda pisaba a la primera
   en silencio. Funcionaban igual por casualidad, pero era cuestión de tiempo.
   pdf.js no entrega líneas: entrega fragmentos con coordenadas, y hgLineasDePagina() los
   reagrupa antes de que ninguna expresión regular los toque. */
async function lineasDelPDF(file){
  const pdfjs=await cargarPdfJs();
  const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let out=[];
  for(let i=1;i<=doc.numPages;i++){
    const c=await (await doc.getPage(i)).getTextContent();
    out=out.concat(hgLineasDePagina(c.items));
  }
  return out;
}
let _gLeida=null;
async function leerGuiaPDF(inp){
  const file=inp.files&&inp.files[0]; if(!file)return;
  velo(true,'Leyendo la guía…');
  try{
    const h=await huella(file);
    const ya=(DB[ARCH.arch].data.archivos||[]).find(a=>a.hash===h);
    if(ya&&ya.estado==='procesado'){velo(false);toast(`Ese archivo ya fue procesado (${ya.nombre}).`);inp.value='';return}
    const lineas=await lineasDelPDF(file);
    window._lineasGuia=lineas;   // para diagnosticar: copiar desde la consola si algo falla
    if(!lineas.length)throw new Error('el PDF no tiene texto, parece escaneado');
    const g=hgParsearGuia(lineas);
    if(DB[ARCH.guias].data.guias.some(x=>String(x.numero)===String(g.numero)))
      throw new Error(`la guía N°${g.numero} ya está cargada`);
    const oc=DB[ARCH.oc].data.ordenes.find(o=>String(o.folio)===String(g.oc));
    hgResolverContraOC(g,oc);
    g.destino=normBodega(g.destino_texto||'');
    if(g.es_retiro===true)g.avisos.push('El documento dice que la retira el cliente: asígnala a un Resumen de Retiros');
    if(!bodegasOrden().includes(g.destino)){g.avisos.push(`Destino no reconocido: "${g.destino_texto||''}"`);g.destino=''}
    if(!oc)g.avisos.push(`La OC ${g.oc||'(sin folio)'} no está en el sistema: la guía quedará marcada como pendiente`);
    _gLeida={g,oc,file,hash:h};
    velo(false);render();
    setTimeout(()=>{const e=document.getElementById('gl-panel');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},60);
  }catch(e){velo(false);toast('No pude leer la guía: '+e.message)}
  inp.value='';
}
function cancelarGuiaLeida(){_gLeida=null;render()}
function glSet(i,campo,v){if(_gLeida)_gLeida.g.items[i][campo]=v}
function glCab(campo,v){if(_gLeida)_gLeida.g[campo]=v}
/* Panel de revisión. Jefe pidió revisar SIEMPRE antes de guardar: una cantidad mal
   leída entra al inventario y a la OC, y desandarlo cuesta más que mirarlo. */
function panelGuiaLeida(){
  if(!_gLeida)return '';
  const g=_gLeida.g, oc=_gLeida.oc;
  const MATCH={precio:['verde','emparejada por precio con la OC'],nombre:['ambar','emparejada solo por nombre'],
    ambiguo:['rojo','varias líneas de la OC calzan: elige tú'],sin_match:['rojo','no calza con ninguna línea de la OC'],
    sin_oc:['rojo','la OC no está en el sistema']};
  const opciones=it=>{
    const usados=g.items.filter(x=>x!==it&&x.codigo).map(x=>x.codigo);
    const ls=(oc?oc.items:[]).map(x=>`<option value="${esc(x.codigo)}"${it.codigo===x.codigo?' selected':''}${usados.includes(x.codigo)?' disabled':''}>${esc(x.producto)} · ${num(x.cantidad)} @ ${clp(x.precio_unitario)}</option>`).join('');
    return `<option value="">— sin asignar —</option>${ls}<option value="__nuevo__"${it.codigo==='__nuevo__'?' selected':''}>No está en la OC: usar el nombre de la guía</option>`;
  };
  return `<div id="gl-panel" class="form" style="border:2px solid var(--ambar);border-radius:10px;padding:14px;margin:12px 0">

      else{const oi=(oc?oc.items:[]).find(x=>x.codigo===cod);nom=oi?oi.producto:it.nombre_guia}

      const p=invProdDe(nom,it.unidad);

         Si algo sale por guía es porque se compró: sin esto el inventario acumulaba salidas
         sin su ingreso y el stock caía a negativo. Se ingresa solo lo que falte para cubrir
         la salida — una compra ya registrada antes no se vuelve a ingresar. La guía sin OC en
         el sistema también ingresa: la mercadería existió igual. Cuando la OC se cargue
         después, se imputa la compra sin volver a tocar bodega. */

      const falta=Math.max(it.cantidad-compSinUsar,0);

      if(oi){
        oi.cantidad_despachada=(+oi.cantidad_despachada||0)+it.cantidad;

    if(oc)oc.guias=[...new Set([...(oc.guias||[]),String(g.numero)])];

    DB[ARCH.guias].data.guias.push({numero:String(g.numero),fecha:g.fecha,fecha_envio:null,

      items,neto:g.neto,iva:g.iva,total:g.total,hoja_ruta:null,

      notas:oc?null:((()=>{const M=(DB[ARCH.psap]&&DB[ARCH.psap].data)||{},f=String(g.oc||'');
        return ((M.folios_reporte||[]).includes(f)||(M.registros||[]).some(r=>String(r.doc_compras||'')===f))
          ?`Sin la OC ${f} en el sistema, pero el folio viene en el reporte de Pendientes SAP: la OC existe y falta que el cliente la envíe.`
          :`Cargada sin OC en el sistema: falta registrar la OC ${f}.`;})())});
    const A=DB[ARCH.arch].data.archivos, reg=A.find(a=>a.hash===hash);
    if(reg){reg.estado='procesado';reg.ruta=ruta;reg.referencia=String(g.numero)}
    else A.push({hash,nombre:file.name,tipo:'guias_despacho',ruta,estado:'procesado',
      fecha:hoyISO(),referencia:String(g.numero)});
    await guardarMaestroSiNuevo();
    await guardarArchivo(ARCH.inv,`Guía N°${g.numero}: salida de ${g.items.length} producto(s)`);
    if(oc)await guardarArchivo(ARCH.oc,`OC ${g.oc}: despachada la guía N°${g.numero}`);
    await guardarArchivo(ARCH.arch,`Guía N°${g.numero} registrada`);
    await guardarArchivo(ARCH.guias,`Guía N°${g.numero} leída del PDF y cargada`);
    _gLeida=null;
    toast(`Guía N°${g.numero} cargada. Asígnala a una Hoja de Ruta o a un Resumen de Retiros.`);

let _zipProm=null;
function cargarJSZip(){
  if(window.JSZip)return Promise.resolve(window.JSZip);
  if(_zipProm)return _zipProm;
  _zipProm=new Promise((ok,mal)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>ok(window.JSZip);
    s.onerror=()=>{_zipProm=null;mal(new Error('No se pudo cargar el generador de Word. Revisa la conexión.'))};
    document.head.appendChild(s);
  });
  return _zipProm;
}
/* Trae un binario del repo de datos tal cual, sin pasar por base64 cuando se puede. */
async function bajarBinarioRepo(p){
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(p)}?t=${Date.now()}`,
    {headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github.raw'}});
  if(!r.ok)throw new Error('No se encontró '+p+' (HTTP '+r.status+')');
  const b=await r.blob();
  if(b.type.includes('json')){                 // la API respondió metadata: rearmar desde base64
    const j=JSON.parse(await b.text());
    if(!j.content)throw new Error('El servidor no devolvió el archivo '+p);
    const bin=atob(j.content.replace(/\s/g,''));
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return arr.buffer;
  }
  return await b.arrayBuffer();
}
async function subirBinario(ruta,blob,msg){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
  let sha=null;
  try{const j=await gh(`contents/${encodeURI(ruta)}?t=${Date.now()}`);sha=j.sha}catch(_){}
  await gh(`contents/${encodeURI(ruta)}`,{method:'PUT',
    body:JSON.stringify(sha?{message:msg,content:b64,sha}:{message:msg,content:b64})});
}
/* ---- Armado del XML. Espejo exacto de generar_hoja_ruta.py ---- */
const hrEsc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hrRun(t,sz,b){
  const rpr='<w:rPr>'+(b?'<w:b/>':'')+`<w:color w:val="${HR_TINTA}"/>`
    +(sz?`<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`:'')+'</w:rPr>';
  return `<w:r>${rpr}<w:t xml:space="preserve">${hrEsc(t)}</w:t></w:r>`;
}
const hrP=(cont,ppr)=>`<w:p>${ppr||''}${cont}</w:p>`;
const hrBordes=()=>'<w:tcBorders>'+['top','left','bottom','right']
  .map(l=>`<w:${l} w:val="single" w:sz="4" w:space="0" w:color="${HR_TINTA}"/>`).join('')+'</w:tcBorders>';
/* keep: pega la fila con la siguiente. Se usa para que una guia NUNCA se parta entre
   paginas; la ultima fila de cada guia va sin keep, y ahi es donde puede caer el corte. */
function hrCelda(txt,w,merge,b,sz,span,antes,keep){
  const vm=merge==='restart'?'<w:vMerge w:val="restart"/>':(merge==='cont'?'<w:vMerge/>':'');
  const gs=span?`<w:gridSpan w:val="${span}"/>`:'';
  const esp=antes==null?20:antes;
  const ppr=`<w:pPr>${keep?'<w:keepNext/>':''}<w:spacing w:before="${esp}" w:after="${esp}"/></w:pPr>`;
  const cuerpo=txt==null?`<w:p>${ppr}</w:p>`:`<w:p>${ppr}${hrRun(txt,sz||20,b)}</w:p>`;
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${gs}${hrBordes()}${vm}`
        +`<w:vAlign w:val="center"/></w:tcPr>${cuerpo}</w:tc>`;
}
function hrCant(v,u){
  const n=+v||0;
  const s=Number.isInteger(n)?String(n):String(Math.round(n*10)/10).replace('.',',');
  return `${s} ${u||'UN'}`;
}
/* Una tabla por destino. La bodega es la PRIMERA FILA de la tabla, celda unica de ancho
   completo: asi viaja pegada a sus guias y no queda un titulo huerfano al pie de pagina.
   Filas 1 y 2 marcadas como encabezado repetido, por si una bodega no cabe ni en una
   pagina entera y hay que partirla igual. */
function hrTabla(dest,gs){
  const filas=[
    '<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>'
      +hrCelda(bodegaTitulo(dest),
               HR_COLS.reduce((a,b)=>a+b,0),null,true,26,4,90,true)+'</w:tr>',
    '<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>'
      +hrCelda('N° Guía',HR_COLS[0],null,true,20,null,20,true)
      +hrCelda('Folio OC',HR_COLS[1],null,true,20,null,20,true)
      +hrCelda('Producto',HR_COLS[2],null,true,20,null,20,true)
      +hrCelda('Cantidad',HR_COLS[3],null,true,20,null,20,true)+'</w:tr>'];
  const cuerpo=[];
  gs.forEach(g=>(g.items||[]).forEach((it,k)=>cuerpo.push({
    n:k===0?g.numero:null, oc:k===0?g.oc:null, pr:it.producto,
    ct:hrCant(it.cantidad,it.unidad), m:k===0?'restart':'cont'})));
  cuerpo.forEach((f,i)=>{
    const finGuia=(i===cuerpo.length-1)||(cuerpo[i+1].m==='restart');
    const keep=!finGuia;                        // el corte solo cae entre guias
    filas.push('<w:tr><w:trPr><w:cantSplit/></w:trPr>'
      +hrCelda(f.n,HR_COLS[0],f.m,false,20,null,20,keep)
      +hrCelda(f.oc,HR_COLS[1],f.m,false,20,null,20,keep)
      +hrCelda(f.pr,HR_COLS[2],null,false,20,null,20,keep)
      +hrCelda(f.ct,HR_COLS[3],null,false,20,null,20,keep)+'</w:tr>');
  });
  return `<w:tbl><w:tblPr><w:tblW w:w="${HR_COLS.reduce((a,b)=>a+b,0)}" w:type="dxa"/>`
    +'<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'
    +HR_COLS.map(c=>`<w:gridCol w:w="${c}"/>`).join('')+'</w:tblGrid>'+filas.join('')+'</w:tbl>';
}
/* Word fusiona dos tablas consecutivas si no hay un parrafo entre medio. */
const HR_ESPACIO=`<w:p><w:pPr><w:keepNext/><w:spacing w:before="0" w:after="0"/>`
  +`<w:rPr><w:sz w:val="20"/></w:rPr></w:pPr></w:p>`;
/* Cabecera: titulo y fecha centrados en la hoja, encuadrados dentro del mismo alto que
   el logo (2,94 cm). El logo va anclado al margen, no en offset absoluto, asi queda
   pegado arriba y a la derecha aunque despues cambien los margenes. */
function hrCabecera(numero,fechaISO,tipo){
  const banda=Math.round(2.94*566.929), lt=Math.round(28*20*1.15), lf=Math.round(12*20*1.15);
  const sobra=Math.max(0,banda-lt-lf), arriba=Math.floor(sobra/2), abajo=sobra-arriba;
  return hrP(`<w:r><w:rPr><w:noProof/></w:rPr>[[DRAWING]]</w:r>`
      +hrRun(`${(HR_TIPOS[tipo]||HR_TIPOS.ruta).titulo} ${numero}`,56,true),
      `<w:pPr><w:keepNext/><w:jc w:val="center"/><w:spacing w:before="${arriba}" w:after="0"/></w:pPr>`)
    +hrP(hrRun('Fecha: '+fFecha(fechaISO),24),
      `<w:pPr><w:keepNext/><w:jc w:val="center"/><w:spacing w:before="0" w:after="${abajo}"/></w:pPr>`);
}
function hrCuerpo(numero,fechaISO,guias,destinos,tipo){
  return hrCabecera(numero,fechaISO,tipo)+destinos.map((dest,idx)=>{
    const gs=guias.filter(g=>normBodega(g.destino||'')===dest)
      .sort((a,b)=>String(a.numero).localeCompare(String(b.numero),'es',{numeric:true}));
    return (idx?HR_ESPACIO:'')+hrTabla(dest,gs);
  }).join('');
}
async function generarDocumento(tipo,numero){
  const tp=HR_TIPOS[tipo]?tipo:'ruta', T=HR_TIPOS[tp], lbl=T.lbl;
  const hoja=DB[ARCH.hr].data.hojas.find(h=>String(h.numero)===String(numero)&&hrTipo(h)===tp);
  if(!hoja){toast(`No encontré ${lbl} N°${numero}`);return}
  const guias=DB[ARCH.guias].data.guias.filter(g=>String(g.hoja_ruta)===String(numero)&&hrTipoGuia(g)===tp);
  if(!guias.length){toast(`${lbl} N°${numero} no tiene guías asociadas.`);return}
  const sinItems=guias.filter(g=>!(g.items||[]).length);
  if(sinItems.length){toast(`La guía N°${sinItems[0].numero} no tiene productos cargados: no puedo armar la tabla.`);return}
  if((hoja.estado||'borrador')==='cerrada'&&!await confirmar({
      titulo:'El documento ya está cerrado',
      texto:`${lbl} N°${numero} está cerrado. Regenerarlo reemplaza el archivo de un despacho ya cumplido. ¿Continuar?`,
      confirmar:'Regenerar igual',peligro:true}))return;
  const fecha=hoja.fecha_envio||hoja.fecha;
  if(!fecha){toast('La hoja no tiene fecha de envío.');return}
  const destinos=bodegasOrden().filter(d=>guias.some(g=>normBodega(g.destino||'')===d));
  const otros=[...new Set(guias.map(g=>normBodega(g.destino||'')).filter(d=>!bodegasOrden().includes(d)))];
  if(otros.length){toast('Destino desconocido en las guías: '+otros.join(', ')+'. Revísalo antes de generar.');return}
  velo(true,'Generando la hoja de ruta…');
  try{
    const JSZipLib=await cargarJSZip();
    const zip=await JSZipLib.loadAsync(await bajarBinarioRepo(HR_PLANTILLA));
    const ent=zip.file('word/document.xml');
    if(!ent)throw new Error('La plantilla base no tiene word/document.xml');
    const x=await ent.async('string');
    // El bloque <w:drawing> del logo se recorta de la plantilla y se reinyecta tal cual:
    // así el logo conserva posición, tamaño y ajuste sin que nosotros los describamos.
    const dm=x.match(/<w:drawing>[\s\S]*?<\/w:drawing>/);
    if(!dm)throw new Error('La plantilla base no trae el logo');
    const ini=x.indexOf('<w:body>')+'<w:body>'.length, fin=x.indexOf('<w:sectPr',ini);
    if(ini<8||fin<0)throw new Error('La plantilla base tiene una estructura inesperada');
    const cuerpo=hrCuerpo(numero,fecha,guias,destinos,tp).replace('[[DRAWING]]',dm[0]);
    zip.file('word/document.xml',x.slice(0,ini)+cuerpo+x.slice(fin));
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',
      mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const nombre=`${T.archivo}_N${numero}_${fFecha(fecha)}.docx`;
    const ruta=`documentos/${T.carpeta}/${nombre}`;
    // Una sola versión por hoja: si cambió la fecha, el archivo viejo se borra.
    if(hoja.archivo&&hoja.archivo!==ruta)await borrarArchivoRepo(hoja.archivo,`${lbl} N°${numero}: reemplazado por ${nombre}`);
    await subirBinario(ruta,blob,`${lbl} N°${numero} generado desde la app`);
    hoja.archivo=ruta;hoja.destinos=destinos;
    hoja.guias=guias.map(g=>String(g.numero)).sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
    await guardarArchivo(ARCH.hr,`${lbl} N°${numero}: documento generado (${guias.length} guía(s), ${destinos.length} destino(s))`);
    bajarBlob(blob,nombre);                                    // bajarBlob ya cierra el velo
    toast(`${lbl} N°${numero} generado: ${guias.length} guía(s) en ${destinos.join(' · ')}`);
    render();
  }catch(e){
    velo(false);
    toast('No se pudo generar: '+e.message);
  }
}

    const filas=prods.map(p=>({'Código NOV':p.codigo,'Producto':p.nombre,'Cantidad':stock[p.codigo]||0}));
    const ws=XLSX.utils.json_to_sheet(filas,{header:COL_PLANTILLA});
    ws['!cols']=[{wch:12},{wch:62},{wch:10}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Inventario');
    XLSX.writeFile(wb,`Inventario_Novetec_${hoyISO()}.xlsx`);
    toast(`Plantilla descargada con ${filas.length} productos.`);
  }catch(e){toast('Error: '+e.message)}
  velo(false);
}
/* Busca la columna por encabezado, tolerando variantes de redacción */
function colDe(fila,claves){
  for(const k of Object.keys(fila)){
    const n=k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(claves.some(c=>n.includes(c)))return k;
  }
  return null;
}
/* Arma el plan de cambios a partir de las filas de la planilla. Función pura y sin DOM:
   así se puede probar con el harness antes de escribir nada. */
function planInventario(filas){
  if(!filas.length)throw new Error('La planilla no tiene filas.');
  const kCod=colDe(filas[0],['codigo','nov']),
        kNom=colDe(filas[0],['producto','nombre','descripcion']),
        kCant=colDe(filas[0],['cantidad','stock','conteo']);
  if(!kCant||!(kCod||kNom))throw new Error('No encuentro las columnas Producto y Cantidad.');
  const stockAct={};
  (DB[ARCH.inv].data.productos||[]).forEach(p=>{if(p.codigo)stockAct[p.codigo]=p.cantidad});
  const plan={cambios:[],nuevos:[],iguales:0,ignoradas:0};
  filas.forEach(r=>{
    const cod=String(kCod?r[kCod]:'').trim();
    const nom=String(kNom?r[kNom]:'').trim();
    const bruto=String(r[kCant]).trim().replace(/\./g,'').replace(',','.');
    const cant=bruto===''?0:Number(bruto);          // vacío = contado en cero
    if(!cod&&!nom){plan.ignoradas++;return}
    if(!isFinite(cant)||cant<0){plan.ignoradas++;return}
    const m=cod?DB[ARCH.prod].data.productos.find(p=>p.codigo===cod):null;
    if(m){
      const antes=stockAct[m.codigo]||0;
      if(antes===cant)plan.iguales++; else plan.cambios.push({codigo:m.codigo,nombre:m.nombre,antes,cant});
    }else if(nom){
      const porNombre=prodMaestro(nom);            // por si el código venía vacío o mal escrito
      if(porNombre){
        const antes=stockAct[porNombre.codigo]||0;
        if(antes===cant)plan.iguales++; else plan.cambios.push({codigo:porNombre.codigo,nombre:porNombre.nombre,antes,cant});
      }else plan.nuevos.push({nombre:nom,cant});
    }else plan.ignoradas++;
  });
  return plan;
}
async function cargarPlantillaInv(){
  const el=document.getElementById('inv-plantilla');
  const f=el&&el.files[0];
  if(!f){toast('Elige la planilla que quieres cargar.');return}
  velo(true,'Leyendo la planilla…');
  let plan;
  try{
    const XLSX=await cargarXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    plan=planInventario(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));
  }catch(e){velo(false);toast('Error: '+e.message);return}
  velo(false);
  if(!plan.cambios.length&&!plan.nuevos.length){toast('La planilla no trae ningún cambio de stock.');return}
  if(!await confirmarPlantillaInv(plan))return;
  velo(true,'Aplicando el inventario…');
  try{
    const inv=DB[ARCH.inv].data;
    const ref='Inventario por planilla '+fFecha(hoyISO());
    plan.nuevos.forEach(n=>{
      const m=crearProdMaestro(n.nombre,'UN');
      inv.productos.push({codigo:m.codigo,nombre:m.nombre,cantidad:n.cant,unidad:m.unidad});
      inv.movimientos.push({fecha:hoyISO(),tipo:'ajuste',codigo:m.codigo,producto:m.nombre,cantidad:n.cant,referencia:ref+' (producto nuevo)'});
    });
    plan.cambios.forEach(c=>{
      let p=inv.productos.find(x=>x.codigo===c.codigo);
      if(!p){p={codigo:c.codigo,nombre:c.nombre,cantidad:0,unidad:'UN'};inv.productos.push(p)}
      p.cantidad=c.cant;
      inv.movimientos.push({fecha:hoyISO(),tipo:'ajuste',codigo:c.codigo,producto:c.nombre,cantidad:c.cant,referencia:ref});
    });
    await guardarMaestroSiNuevo();
    await guardarArchivo(ARCH.inv,`Inventario por planilla: ${plan.cambios.length} ajuste(s), ${plan.nuevos.length} producto(s) nuevo(s)`);
    toast(`Inventario cargado: ${plan.cambios.length} ajuste(s) y ${plan.nuevos.length} producto(s) nuevo(s).`);
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
/* Resumen antes de escribir: la carga es directa, pero conviene ver qué va a cambiar por si
   se subió la planilla equivocada. */
function confirmarPlantillaInv(plan){
  return new Promise(res=>{
    const filas=[...plan.cambios.slice(0,12).map(c=>`<tr><td class="mono small">${esc(c.codigo)}</td><td class="trunc" title="${esc(c.nombre)}">${esc(c.nombre)}</td><td class="num">${num(c.antes)}</td><td class="num" style="font-weight:600">${num(c.cant)}</td></tr>`),
      ...plan.nuevos.slice(0,6).map(n=>`<tr><td class="mono small" style="color:var(--verde)">nuevo</td><td class="trunc" title="${esc(n.nombre)}">${esc(n.nombre)}</td><td class="num">—</td><td class="num" style="font-weight:600">${num(n.cant)}</td></tr>`)];
    const resto=(plan.cambios.length>12?plan.cambios.length-12:0)+(plan.nuevos.length>6?plan.nuevos.length-6:0);
    const ov=document.createElement('div');ov.className='modal-ov';
    ov.innerHTML=`<div class="modal" style="max-width:640px">
      <b>Revisa antes de cargar el inventario</b>
      <div class="monto-ctx" style="margin-top:10px">
        <div><div class="et">Ajustes de stock</div><div class="va">${plan.cambios.length}</div></div>
        <div><div class="et">Productos nuevos</div><div class="va">${plan.nuevos.length}</div></div>
        <div><div class="et">Sin cambio</div><div class="va">${plan.iguales}</div></div>
      </div>
      ${plan.ignoradas?`<p class="small muted" style="margin-top:8px">${plan.ignoradas} fila(s) sin datos válidos se omiten.</p>`:''}
      <div style="max-height:260px;overflow:auto;margin-top:10px"><table class="tprod"><colgroup><col style="width:11ch"><col><col style="width:8ch"><col style="width:8ch"></colgroup>
        <tr><th>Código</th><th>Producto</th><th class="num">Antes</th><th class="num">Queda</th></tr>${filas.join('')}</table></div>
      ${resto?`<p class="small muted">y ${resto} más…</p>`:''}
      <div class="acciones">
        <button class="btn" id="pl-ok">Cargar inventario</button>
        <button class="btn sec" id="pl-no">Cancelar</button>
      </div></div>`;
    document.body.appendChild(ov);
    const cerrar=r=>{document.removeEventListener('keydown',tecla);ov.remove();res(r)};
    const tecla=e=>{if(e.key==='Escape')cerrar(false)};
    document.addEventListener('keydown',tecla);
    ov.querySelector('#pl-ok').onclick=()=>cerrar(true);
    ov.querySelector('#pl-no').onclick=()=>cerrar(false);
    ov.onclick=e=>{if(e.target===ov)cerrar(false)};
  });
}
