<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novetec · Gestión de Despacho</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema claro (por defecto) */
  --ink:#16232E; --texto:#16232E; --paper:#F1F3F5; --card:#FFFFFF; --line:#D5DBE1; --muted:#5D6B77;
  --barra:#16232E; --btn-bg:#16232E; --btn-fg:#FFFFFF; --btn-bg-h:#0E1820;
  --campo:#FFFFFF; --hover:#EEF3F7; --sub-bg:#FAFBFC;
  --rojo:#C7392F; --rojo-bg:#FBEAE8; --ambar:#B57708; --ambar-bg:#FCF3E1;
  --verde:#2E7D4F; --verde-bg:#E7F3EC; --gris-bg:#EAEDF0; --vencida:#7A1F17;
  --radius:10px; --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  /* Escala tipográfica (guía Learn UI Design, diseño interaction-heavy).
     16px es el piso del cuerpo y de TODOS los campos: bajo eso iOS hace zoom al tocarlos.
     --escala la controla el botón de zoom de la barra superior (1 · 1,15 · 1,3). */
  --escala:1;
  --fs-xs:calc(12.5px * var(--escala)); --fs-sm:calc(14px * var(--escala));
  --fs-md:calc(16px * var(--escala)); --fs-base:calc(16px * var(--escala));
  --fs-lg:calc(18px * var(--escala));
}
/* Tema oscuro */
html[data-tema="oscuro"]{
  --ink:#E4EBF1; --texto:#E4EBF1; --paper:#0E151C; --card:#16202B; --line:#2B3846; --muted:#93A5B6;
  --barra:#080D12; --btn-bg:#E4EBF1; --btn-fg:#0E151C; --btn-bg-h:#FFFFFF;
  --campo:#0F1821; --hover:#1E2A37; --sub-bg:#131C25;
  --rojo:#F0897D; --rojo-bg:#3B1D19; --ambar:#E0A94D; --ambar-bg:#352712;
  --verde:#6FCB95; --verde-bg:#123021; --gris-bg:#243040; --vencida:#5E1811;
}
html[data-tema="oscuro"] #splash img{filter:brightness(1.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--texto);font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased}
header{background:var(--barra);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
header .sub{font-family:var(--mono);font-size:var(--fs-sm);color:#9FB0BE;letter-spacing:.02em}
header .conn{font-family:var(--mono);font-size:var(--fs-xs);color:#9FB0BE;cursor:pointer;text-decoration:underline dotted}
/* Acciones de la barra: botones redondos */
.hacciones{margin-left:auto;display:flex;align-items:center;gap:10px}
.hbtn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#E4EBF1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;position:relative;transition:background .15s,border-color .15s}
.hbtn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.45)}
.hbtn img{width:100%;height:100%;object-fit:cover;display:block}
.hbtn i{font-size:15px}
.hbtn .nivel{position:absolute;bottom:-1px;right:-1px;background:var(--btn-bg);color:var(--btn-fg);font-family:var(--mono);font-size:9.5px;font-weight:600;line-height:1;padding:2px 3px;border-radius:6px}
@media(max-width:640px){.hacciones .conn{display:none}}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:10}
nav button{font-family:var(--sans);font-size:var(--fs-md);font-weight:600;letter-spacing:.01em;padding:14px 18px;border:none;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}
nav button:hover{color:var(--texto)}
nav button.on{color:var(--texto);border-bottom-color:var(--texto);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
h2{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.005em;margin:34px 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.3}
h2:first-child{margin-top:0}
h2 .muted{font-size:var(--fs-sm);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;overflow-x:auto}
.card>table:first-child{margin-top:-2px}
.mono{font-family:var(--mono);letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
/* Rótulo de bodega dentro de una tarjeta: mismo cuerpo que el resto del texto */
.bodega-lbl{font-size:var(--fs-base);font-weight:700;color:var(--texto);display:flex;align-items:center;gap:7px;margin:20px 0 8px}
.bodega-lbl:first-child{margin-top:8px}
.bodega-lbl .muted{font-weight:400;font-size:var(--fs-sm)}
button.btn{font-family:var(--sans);font-weight:700;font-size:var(--fs-sm);letter-spacing:.01em;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:8px;padding:10px 17px;cursor:pointer;transition:background .15s}
button.btn:hover{background:var(--btn-bg-h)}
button.btn.sec{background:none;color:var(--texto);border:1.5px solid var(--texto)}
button.btn.mini{padding:7px 12px;font-size:var(--fs-xs)}
button.btn.peligro{background:none;border:1.5px solid var(--rojo);color:var(--rojo)}
input,select,textarea{font-family:var(--mono);font-size:var(--fs-base);padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:var(--campo);color:var(--texto);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--texto);outline-offset:1px}
label{display:block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:15px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
/* Semáforo */
.sem-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:640px){.sem-strip{grid-template-columns:repeat(2,1fr)}}
.sem-box{border-radius:var(--radius);padding:14px;border:1px solid var(--line);background:var(--card)}
.sem-box .n{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.sem-box .l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.sem-box.rojo{background:var(--rojo-bg)}.sem-box.rojo .n,.sem-box.rojo .l{color:var(--rojo)}
.sem-box.ambar{background:var(--ambar-bg)}.sem-box.ambar .n,.sem-box.ambar .l{color:var(--ambar)}
.sem-box.verde{background:var(--verde-bg)}.sem-box.verde .n,.sem-box.verde .l{color:var(--verde)}
.sem-box.vencida{background:var(--vencida)}.sem-box.vencida .n,.sem-box.vencida .l{color:#fff}
/* Etiqueta de carga (fila OC) */
.tag{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;display:flex;overflow:hidden}
.tag .bar{width:7px;flex:none}
.tag .bar.rojo{background:var(--rojo)}.tag .bar.ambar{background:var(--ambar)}.tag .bar.verde{background:var(--verde)}
.tag .bar.vencida{background:var(--vencida)}.tag .bar.gris{background:#AEB9C2}
/* La tarjeta recorta (overflow:hidden) para que la pestaña de color respete las esquinas
   redondeadas, pero eso dejaba SIN DESPLAZAMIENTO a las tablas de adentro, que tienen ancho
   mínimo mayor que un teléfono: la información quedaba cortada y no había forma de verla
   (Jefe, 29-07-2026). El cuerpo se desplaza en horizontal. */
.tag .body{flex:1;padding:12px 14px;min-width:0;overflow-x:auto}
.tag .body>table,.tag .body .tprod{max-width:none}
.tag .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
/* Fichas plegables de documento (cotizaciones y OC): el encabezado es el resumen y el
   detalle queda oculto hasta desplegarlo, para poder recorrer el listado de folios. */
details.doc>summary{list-style:none;cursor:pointer;align-items:center}
details.doc>summary::-webkit-details-marker{display:none}
details.doc>summary::before{content:'\f105';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--muted);transition:transform .15s;flex:none;width:9px}
details.doc[open]>summary::before{transform:rotate(90deg)}
details.doc>summary:hover{opacity:.85}
details.doc .resumen{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
details.doc[open] .resumen{display:none}
.tag .folio{font-family:var(--mono);font-weight:700;font-size:var(--fs-lg);letter-spacing:-.01em}
.chip{display:inline-block;font-family:var(--mono);font-size:var(--fs-xs);font-weight:600;padding:3px 10px;border-radius:20px;background:var(--gris-bg);color:var(--muted);white-space:nowrap}
.chip.rojo{background:var(--rojo-bg);color:var(--rojo)}
.chip.ambar{background:var(--ambar-bg);color:var(--ambar)}
.chip.verde{background:var(--verde-bg);color:var(--verde)}
.chip.vencida{background:var(--vencida);color:#fff}
.chip.ink{background:var(--btn-bg);color:var(--btn-fg)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);line-height:1.4}
th{font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
/* Realce de fila al pasar el puntero (Jefe, 30-07-2026): permite seguir visualmente
   dónde empieza y termina cada fila. Solo aplica a filas de datos: los encabezados usan
   <th>, así que este selector no los toca. */
tr:hover>td{background:var(--hover)}
tr:last-child td{border-bottom:none}
td .small{font-size:var(--fs-xs);line-height:1.4}
td .small.sep::before{content:'·';color:var(--line);margin:0 5px}
/* Celda de una sola línea: si el texto no cabe, se corta con puntos suspensivos.
   Al hacer clic se despliega completo (puede ocupar más de una línea). */
td.trunc{max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* Grilla estándar de TODA la app (Jefe, 22-07-2026): las columnas de cifras y de acción llevan
   ancho fijo y el NOMBRE DEL PRODUCTO se queda con todo el espacio sobrante. Los anchos van en
   ch para que acompañen al botón de zoom de la barra. */
table.tprod{table-layout:fixed}
table.tprod th{white-space:normal;vertical-align:bottom}
table.tprod td.trunc{max-width:none}
table.tprod td,table.tprod th{padding-left:8px;padding-right:8px}
table.tprod td:first-child,table.tprod th:first-child{padding-left:2px}
table.tprod td:last-child,table.tprod th:last-child{padding-right:2px}
.aviso-medida{color:var(--ambar);margin-right:5px;cursor:help}
/* Línea de una OC que aún tiene unidades por despachar: amarillo suave (Jefe, 24-07-2026) */
tr.fila-pend>td{background:var(--ambar-bg)}
tr.fila-adj>td{background:var(--verde-bg)}
tr.fila-adj-parcial>td{background:var(--ambar-bg)}
/* Resumen del Panel: estado de la COMPRA de cada producto (Jefe, 20-08-2026).
   Comprado del todo = verde suave · comprado en parte = amarillo suave · sin comprar = sin color.
   Van después de tr:hover a propósito: misma especificidad, así el estado se sigue viendo
   mientras el puntero recorre la fila. */
tr.fila-comprada>td{background:var(--verde-bg)}
tr.fila-comprada-parcial>td{background:var(--ambar-bg)}
/* Alerta roja junto a una cifra (ej: se despachó más de lo comprado) */
.alerta-cifra{color:var(--rojo);margin-left:5px;cursor:help}
/* Acordeón de guías: hoja de ruta -> guías de ese viaje */
.acc-bodega{margin-bottom:12px}
.acc-fecha>summary{list-style:none;cursor:pointer;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:8px;font-weight:600}
.acc-fecha>summary .btn{flex:none}
.acc-fecha>summary::-webkit-details-marker{display:none}
.acc-fecha>summary::before{content:'\f105';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--muted);transition:transform .15s}
.acc-fecha[open]>summary::before{transform:rotate(90deg)}
.acc-fecha>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);font-weight:400}
.acc-fecha>summary .chip{font-weight:400}
.acc-fecha .cuerpo{padding:6px 0 4px 6px;min-width:0}
/* Pestaña de color de la hoja de ruta, igual criterio que las OC (Jefe, 24-07-2026) */
.acc-fecha.hr-gris>summary{border-left:5px solid #AEB9C2}
.acc-fecha.hr-ambar>summary{border-left:5px solid var(--ambar)}
.acc-fecha.hr-verde>summary{border-left:5px solid var(--verde)}
/* Acordeón de MES (Jefe, 30-07-2026): agrupa cotizaciones, OC y guías. Va por fuera de todo lo
   demás (incluida la agrupación por Hoja de Ruta de las guías, que se conserva adentro). Un
   nivel más grande que acc-fecha para que se note que es el contenedor exterior. */
.acc-mes{margin-bottom:10px}
.acc-mes>summary{list-style:none;cursor:pointer;padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--sub-bg);display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;font-weight:700;font-size:var(--fs-md)}
.acc-mes>summary::-webkit-details-marker{display:none}
.acc-mes>summary::before{content:'\f105';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--muted);transition:transform .15s}
.acc-mes[open]>summary::before{transform:rotate(90deg)}
.acc-mes>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.acc-mes .cuerpo{padding:10px 0 2px 2px}
/* Acordeón de AÑO (Jefe, 30-07-2026): solo aparece cuando la data cruza más de un año
   calendario. Sin esto, dos meses del mismo nombre en años distintos (dos "Junio") quedaban
   uno junto al otro y se leían como un mes duplicado. Un nivel más grande que acc-mes. */
/* Acordeón de la cola de archivos (Jefe, 30-07-2026): cerrado por defecto y mostrando solo
   el conteo, para que una carga grande no ocupe toda la pantalla. */
.acc-cola{border:1.5px solid var(--ambar);border-radius:10px;background:var(--card);margin-bottom:14px}
.acc-cola>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ambar)}
.acc-cola>summary::-webkit-details-marker{display:none}
.acc-cola>summary::before{content:'\f105';font-family:'Font Awesome 6 Free';font-weight:900;transition:transform .15s}
.acc-cola[open]>summary::before{transform:rotate(90deg)}
.acc-cola>summary .cnt{margin-left:auto;font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
/* Alto de unos 5 archivos (cada fila mide ~37px: botón mini de 29px más 8px de separación).
   En em para que acompañe al zoom de la app. El resto queda bajo el scroll. */
.acc-cola .cuerpo{padding:0 16px 14px;max-height:12.5em;overflow:auto}
.acc-anio{margin-bottom:12px}
.acc-anio>summary{list-style:none;cursor:pointer;padding:14px 16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;font-weight:800;font-size:var(--fs-lg)}
.acc-anio>summary::-webkit-details-marker{display:none}
.acc-anio>summary::before{content:'\f105';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--muted);transition:transform .15s}
.acc-anio[open]>summary::before{transform:rotate(90deg)}
.acc-anio>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.acc-anio .cuerpo{padding:10px 2px 2px}
td.trunc:hover{background:var(--hover)}
td.trunc.abierto{white-space:normal;overflow:visible;text-overflow:clip;background:var(--hover)}
td.num,th.num{text-align:right;font-family:var(--mono);letter-spacing:-.01em}
.item-row{display:grid;grid-template-columns:1fr 110px 130px 34px;gap:8px;margin-bottom:8px}
@media(max-width:640px){.item-row{grid-template-columns:1fr 80px 100px 30px}}
.item-row button{border:none;background:none;color:var(--rojo);font-size:18px;cursor:pointer}
.acciones{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.vacio{text-align:center;color:var(--muted);padding:32px;font-size:var(--fs-sm)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-fg);font-family:var(--mono);font-size:var(--fs-sm);padding:13px 18px;border-radius:8px;display:none;z-index:99;max-width:90vw}
#velo{position:fixed;inset:0;background:rgba(22,35,46,.35);display:none;align-items:center;justify-content:center;z-index:50;font-family:var(--mono);color:#fff;font-size:var(--fs-md)}
#splash{position:fixed;inset:0;background:var(--paper);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;opacity:1;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(46vw,260px);animation:splashIn .7s ease}
@keyframes splashIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-ov{position:fixed;inset:0;background:rgba(22,35,46,.45);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .cand{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--campo);border-radius:8px;padding:11px 13px;margin-top:8px;cursor:pointer;font-family:var(--sans);font-size:var(--fs-sm);line-height:1.4}
.modal .cand:hover{border-color:var(--texto);background:var(--hover)}
.modal .cand.nuevo{border-style:dashed;color:var(--muted);margin-top:14px}
/* Ventana de ingreso de montos: reemplaza a prompt() del navegador. */
.monto-ctx{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.monto-ctx div{background:var(--sub-bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;flex:1;min-width:96px}
.monto-ctx .et{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.monto-ctx .va{font-family:var(--mono);font-size:var(--fs-lg);font-weight:600;line-height:1.25}
.monto-campo{display:flex;align-items:stretch;gap:8px;margin-top:4px}
.monto-campo input{font-size:26px;font-weight:600;text-align:right;padding:12px 14px;letter-spacing:-.01em}
.monto-campo .uni{display:flex;align-items:center;color:var(--muted);font-family:var(--mono);font-size:var(--fs-sm);white-space:nowrap}
.monto-aviso{font-size:var(--fs-sm);margin-top:9px;min-height:1.3em;line-height:1.35}
.monto-aviso.mal{color:var(--rojo);font-weight:600}
.monto-aviso.bien{color:var(--muted)}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;background:var(--campo);transition:all .15s}
.dropzone.hover{border-color:var(--texto);background:var(--hover)}
.dropzone .dz-icono{font-size:26px;color:var(--muted);margin-bottom:6px}
details.form{border:1.5px dashed var(--line);border-radius:var(--radius);margin-bottom:16px;background:var(--sub-bg)}
details.form summary{padding:14px 16px;font-weight:700;font-size:var(--fs-base);letter-spacing:0;cursor:pointer;list-style:none}
details.form summary::before{content:'+ '}
details.form[open] summary::before{content:'– '}
details.form .inner{padding:0 16px 16px}
.filtro{margin-bottom:12px}
#setup{max-width:460px;margin:60px auto;padding:0 16px}
#setup .card{padding:26px}
#setup h1{font-size:20px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
a{color:var(--texto)}
/* En celular la línea completa no cabe a lo ancho, y una tabla no salta sola. Se despliega
   en cinco renglones, dando línea propia a los campos largos:
       (X) [Producto]
           [Descripción]
           [Bodega]
       [Cant] [Unidad] [Precio]
       [OC] [Cot]
   Sobre 820px vuelve a ser una sola fila de ocho columnas. */
@media (max-width:820px){
  table.cot-lineas,table.cot-lineas tbody,table.cot-lineas tr,table.cot-lineas td{display:block;width:auto}
  table.cot-lineas thead{display:none}
  table.cot-lineas td{padding:2px 0;border:none}
  table.cot-lineas td input,table.cot-lineas td select{width:100%}
  table.cot-lineas tr.cot-a{display:grid;grid-template-columns:38px 1fr;gap:6px 8px;
    border-top:1.5px solid var(--line);padding-top:12px;margin-top:12px}
  table.cot-lineas tr.cot-a td:nth-child(1){grid-column:1;grid-row:1;align-self:start}
  table.cot-lineas tr.cot-a td:nth-child(2){grid-column:2;grid-row:1}
  table.cot-lineas tr.cot-a td:nth-child(n+3){grid-column:1/-1}
  table.cot-lineas tr.cot-b{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px 8px;
    padding:6px 0 2px}
  table.cot-lineas tr.cot-b td:nth-child(4){grid-column:1/-1}
  table.cot-lineas tr.cot-b td:nth-child(4) button{flex:1 1 46%}
  table.cot-lineas td[data-et]::before{content:attr(data-et);display:block;font-size:11px;
    color:var(--muted);margin-bottom:2px}
}
</style>

<body>

<div id="setup" style="display:none">
  <div class="card">
    <h1>Novetec · Gestión</h1>

<header>
  <h1>Novetec · Despacho</h1>
  <span class="sub" id="hoy-lbl"></span>
  <div class="hacciones">
    <button class="hbtn" id="btn-tema" onclick="alternarTema()" title="Modo oscuro" aria-label="Modo oscuro"><img src="logo-marca.png" alt=""></button>
    <button class="hbtn" id="btn-zoom" onclick="ciclarZoom()" title="Ampliar la vista" aria-label="Ampliar la vista"><i class="fa-solid fa-magnifying-glass-plus"></i><span class="nivel" id="zoom-nivel" style="display:none"></span></button>

</header>

  <button data-t="precios">Lista de precios</button>
  <button data-t="inv">Inventario</button>
</nav>

</div>

<div id="splash"><img src="logo.png" alt="Novetec SPA"></div>
<div id="toast"></div>
<div id="velo"><span id="velo-msg">Guardando…</span></div>

<script>
/* ================= Conexión GitHub ================= */
const LSKEY='novetec_cfg';
let cfg=null;
let DB={}; // path -> {data, sha}
const ARCH={cot:'data/cotizaciones.json',oc:'data/ordenes_compra.json',guias:'data/guias_despacho.json',inv:'data/inventario.json',conf:'data/config.json',pend:'data/pendientes.json',hr:'data/hojas_ruta.json',prod:'data/productos.json',sin:'data/sinonimos.json',psap:'data/pendientes_sap.json',arch:'data/archivos.json',hprec:'data/historial_precios.json',adj:'data/adjudicaciones.json',bod:'data/bodegas.json',cli:'data/clientes.json'};

const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function b64enc(s){const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(r)}

async function gh(path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${path}`,{
    ...opts,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){
    const e=await r.json().catch(()=>({}));
    /* GitHub responde en inglés y con su propio vocabulario. Un "422: sha wasn't supplied"
       no le dice nada a quien está cargando una guía: se traduce a qué pasó y qué hacer. */
    const t=String(e.message||'');
    const claro=
      r.status===401?'El token de GitHub no es válido o expiró. Vuelve a ingresarlo en Ajustes.':
      r.status===403?(/rate limit/i.test(t)?'GitHub está limitando las peticiones. Espera unos minutos y reintenta.'
                     :'El token no tiene permisos para esta operación.'):
      r.status===404?'No encontré ese archivo en el repositorio.':
      r.status===409?'conflicto':
      (r.status===422&&/sha/i.test(t))?'Ese documento ya existe en el repositorio y no se pudo reemplazar. Reintenta; si vuelve a fallar, avísame.':
      r.status===422?('GitHub rechazó la operación: '+t):
      r.status>=500?'GitHub está con problemas en este momento. Reintenta en unos minutos.':
      `${r.status}: ${t||'error de GitHub'}`;
    const err=new Error(claro);
    err.status=r.status;              // el texto se traduce; el código NO se pierde
    err.githubMessage=t;
    throw err;
  }
  return r.json();
}
const ESTRUCTURAS_BASE={'data/cotizaciones.json':{cotizaciones:[]},'data/clientes.json':{clientes:[]},'data/ordenes_compra.json':{ordenes:[]},
 'data/historial_precios.json':{observaciones:[]},
 'data/guias_despacho.json':{guias:[]},'data/inventario.json':{productos:[],movimientos:[]},
 'data/pendientes.json':{pendientes:[]},'data/hojas_ruta.json':{hojas:[]},
 'data/productos.json':{productos:[],correlativo:0},
 'data/pendientes_sap.json':{registros:[],actualizado:null,archivo_origen:null},
 'data/adjudicaciones.json':{registros:[],descartes:[]},
 'data/bodegas.json':{bodegas:[],excepcionales:[]},
 'data/archivos.json':{archivos:[]},
 'data/config.json':{empresa:'Novetec SPA',semaforo:{rojo_dias:5,amarillo_dias:10},proxima_hoja_ruta:1,proximo_resumen_retiro:1,resumen_ocultos:[]}};
/* Normalización defensiva: garantiza la estructura mínima de cada documento apenas se carga,
   para que un registro incompleto (cargado a mano o por una versión vieja) NUNCA tumbe una
   vista. Motivo real: el 24-07-2026 la pestaña de guías se cayó porque tres guías se cargaron
   por datos sin el campo `items`. Las vistas pueden asumir que estos campos existen. */
function normalizarDatos(p,d){
  if(!d||typeof d!=='object')return d;
  const arr=k=>{if(!Array.isArray(d[k]))d[k]=[]};
  if(p===ARCH.oc){arr('ordenes');d.ordenes.forEach(o=>{o.items=o.items||[];o.guias=o.guias||[];
    o.items.forEach(i=>{i.producto=i.producto||'';i.cantidad=+i.cantidad||0;
      i.cantidad_comprada=+i.cantidad_comprada||0;i.cantidad_despachada=+i.cantidad_despachada||0})})}
  if(p===ARCH.cot){arr('cotizaciones');d.cotizaciones.forEach(c=>{c.items=c.items||[];
    // Migración 31-07-2026: la cotización ya no tiene estado de envío. 'enviada'/'convertida' -> 'abierta'.
    if(c.estado==='enviada'||c.estado==='convertida'||!c.estado)c.estado='abierta';
    c.items.forEach(i=>{i.producto=i.producto||'';i.cantidad=+i.cantidad||0;i.precio_unitario=+i.precio_unitario||0})})}
  if(p===ARCH.adj){arr('registros');arr('descartes')}
  if(p===ARCH.bod){arr('bodegas');arr('excepcionales')}
  if(p===ARCH.cli){arr('clientes');d.clientes.forEach(c=>{c.contactos=c.contactos||[];c.bodegas=c.bodegas||[];
    c.contactos.forEach(k=>{k.emails=k.emails||[];k.telefonos=k.telefonos||[]})})}
  if(p===ARCH.guias){arr('guias');d.guias.forEach(g=>{g.items=g.items||[];
    g.oc=g.oc||g.folio_oc||'';g.folio_oc=g.folio_oc||g.oc||'';g.discrepancias=g.discrepancias||[];
    if(g.hoja_ruta)g.hoja_tipo=HR_TIPOS[g.hoja_tipo]?g.hoja_tipo:'ruta';
    g.items.forEach(i=>{i.producto=i.producto||'';i.cantidad=+i.cantidad||0})})}
  if(p===ARCH.hr){arr('hojas');d.hojas.forEach(h=>{h.guias=h.guias||[];h.destinos=h.destinos||[];
    h.tipo=HR_TIPOS[h.tipo]?h.tipo:'ruta'})}   // todo lo anterior a 08-2026 es hoja de ruta
  if(p===ARCH.inv){arr('productos');arr('movimientos')}
  if(p===ARCH.prod){arr('productos');d.productos.forEach(x=>{x.alias=x.alias||[];x.codigos_cliente=x.codigos_cliente||{}})}
  if(p===ARCH.psap){arr('registros')}
  if(p===ARCH.hprec){arr('observaciones');arr('cotizaciones')}
  if(p===ARCH.pend){arr('pendientes')}
  return d;
}
async function cargarArchivo(p){
  try{
    const j=await gh(`contents/${p}?t=${Date.now()}`);
    DB[p]={data:normalizarDatos(p,JSON.parse(b64dec(j.content))),sha:j.sha};
  }catch(e){
    // Auto-recuperación: si el archivo no existe, la app lo crea con estructura vacía
    if(e.message.startsWith('404')&&ESTRUCTURAS_BASE[p]){
      DB[p]={data:JSON.parse(JSON.stringify(ESTRUCTURAS_BASE[p])),sha:undefined};
      try{const j=await gh(`contents/${p}`,{method:'PUT',body:JSON.stringify({message:'Inicialización automática: '+p,content:b64enc(JSON.stringify(DB[p].data,null,2))})});DB[p].sha=j.content.sha}catch(_){/* seguir en memoria */}
    } else throw e;
  }
}
async function guardarArchivo(p,msg){
  try{
    const j=await gh(`contents/${p}`,{method:'PUT',body:JSON.stringify({message:msg,content:b64enc(JSON.stringify(DB[p].data,null,2)),sha:DB[p].sha})});
    DB[p].sha=j.content.sha;
  }catch(e){
    /* Un 409/422 al guardar un JSON significa que el sha quedó viejo: otro guardado se
       adelantó. Se compara el CÓDIGO, no el texto: traducir los mensajes rompió la
       comparación anterior, que buscaba que el texto empezara con '409'. */
    if(e.status===409||e.status===422){
      toast('Atención: otro usuario guardó cambios. Recargando datos…');await cargarTodo();render();throw new Error('conflicto');
    }
    throw e;
  }
}
/* GitHub exige el 'sha' de la versión anterior para reemplazar un archivo que ya existe; sin
   él responde 422 "sha wasn't supplied". Pasaba al reintentar una carga que fallo despues de
   subir el PDF, o al recargar un documento con nombre fijo (OC_xxx.pdf, GD_xxx.pdf): el
   archivo ya estaba en el repositorio y el segundo intento moria con un error de GitHub que
   no dice nada al usuario. Se consulta el sha antes de subir, igual que subirBinario. */
async function subirDocumento(carpeta,file,nombreFijo){
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});
  const ruta=`documentos/${carpeta}/${nombreFijo||(Date.now()+'_'+file.name.replace(/[^\w.\-]/g,'_'))}`;
  let sha=null;
  try{const j=await gh(`contents/${encodeURI(ruta)}?t=${Date.now()}`);sha=j.sha}catch(_){}
  const cuerpo={message:`Documento: ${file.name}`,content:b64};
  if(sha)cuerpo.sha=sha;
  await gh(`contents/${encodeURI(ruta)}`,{method:'PUT',body:JSON.stringify(cuerpo)});
  return ruta;
}
async function borrarArchivoRepo(p,msg){
  try{const j=await gh(`contents/${encodeURI(p)}?t=${Date.now()}`);
    await gh(`contents/${encodeURI(p)}`,{method:'DELETE',body:JSON.stringify({message:msg,sha:j.sha})});
  }catch(e){/* si el archivo ya no existe, continuar */}
}
function bajarBlob(b,nombre){
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=nombre;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
  velo(false);
}
async function descargarArchivo(p,nombre){
  if(!p||p==='null'||p==='undefined'){toast('Ese documento todavía no tiene archivo generado.');return}
  velo(true,'Descargando…');
  try{
    const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(p)}?t=${Date.now()}`,
      {headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github.raw'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const b=await r.blob();
    if(b.type.includes('json')&&!/\.json$/i.test(p)){
      const t=await b.text();
      try{const j=JSON.parse(t);
        if(j.content){ // la API respondió en JSON: rearmamos el binario desde base64
          const bin=atob(j.content.replace(/\s/g,''));
          const arr=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
          return bajarBlob(new Blob([arr]),nombre||p.split('/').pop());
        }
      }catch(_){}
      throw new Error('el servidor no devolvió el archivo');
    }
    const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download=nombre||p.split('/').pop();
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){toast('Error al descargar: '+e.message)}
  velo(false);
}
async function cargarTodo(){await Promise.all(Object.values(ARCH).map(cargarArchivo))}

async function conectar(){
  const owner=v('s-owner').trim(),repo=v('s-repo').trim(),token=v('s-token').trim();
  if(!owner||!repo||!token){document.getElementById('s-err').textContent='Completa los tres campos.';return}
  cfg={owner,repo,token};
  try{await gh('contents/data');localStorage.setItem(LSKEY,JSON.stringify(cfg));iniciar()}
  catch(e){document.getElementById('s-err').textContent='No se pudo conectar: '+e.message;cfg=null}
}
async function cambiarConexion(){
  if(await confirmar({titulo:'Desconectar el navegador',texto:'Se borrará el acceso guardado en este navegador y tendrás que volver a ingresar el token.',confirmar:'Desconectar',peligro:true})){localStorage.removeItem(LSKEY);location.reload()}
}

/* ================= Utilidades ================= */
const v=id=>document.getElementById(id).value;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(n||0);
const num=n=>new Intl.NumberFormat('es-CL').format(n||0);
const hoyISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
/* Plazo de entrega que se compromete Novetec: 10 días corridos desde que el documento se carga
   en la app (Jefe, 23-08-2026). NO se usa la fecha del PDF: el cliente pone cualquier cosa ahí
   (la OC 4500952609, emitida en marzo, traía entrega para el 30 de junio). Antes se calculaba
   emisión + 15 días, que arrastraba el mismo problema por otra vía: una OC emitida hace meses
   entraba al sistema ya vencida. El semáforo de atraso se mide contra esta fecha. */
function fechaCompromiso(desde){
  const base=desde?Date.parse(desde):Date.parse(hoyISO());
  return new Date(base+10*864e5).toISOString().slice(0,10);
}
function fFecha(iso){if(!iso)return '—';const[a,m,d]=iso.split('-');return `${d}-${m}-${a}`}
function dias(iso){if(!iso)return null;const[a,m,d]=iso.split('-').map(Number);const f=new Date(a,m-1,d);const h=new Date();h.setHours(0,0,0,0);return Math.round((f-h)/86400000)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',4200)}
function velo(on,msg){document.getElementById('velo').style.display=on?'flex':'none';if(msg)document.getElementById('velo-msg').textContent=msg}

/* Maestro de productos: sin duplicados, codigo propio NOV-#### */
const normProd=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function prodMaestro(nombre){const n=normProd(nombre);
  return DB[ARCH.prod].data.productos.find(p=>normProd(p.nombre)===n||(p.alias||[]).some(a=>normProd(a)===n))}
function crearProdMaestro(nombre,unidad){const d=DB[ARCH.prod].data;d.correlativo++;
  const p={codigo:'NOV-'+String(d.correlativo).padStart(4,'0'),nombre:nombre.trim(),unidad:(unidad||'UN').toUpperCase(),codigos_cliente:{},alias:[]};
  d.productos.push(p);DB[ARCH.prod]._nuevos=true;return p}
function invProdDe(nombre,unidad,crear=true){
  let m=prodMaestro(nombre);
  if(!m){if(!crear)return null;m=crearProdMaestro(nombre,unidad)}
  let p=DB[ARCH.inv].data.productos.find(x=>x.codigo===m.codigo);
  if(!p&&crear){p={codigo:m.codigo,nombre:m.nombre,cantidad:0,unidad:m.unidad};DB[ARCH.inv].data.productos.push(p)}
  return p}
async function guardarMaestroSiNuevo(){
  if(DB[ARCH.prod]._nuevos){await guardarArchivo(ARCH.prod,'Maestro: nuevos productos');DB[ARCH.prod]._nuevos=false}}
/* Similitud simple para desambiguar nombres parecidos */
// Lematiza a raíz simple: minúsculas sin tildes y sin plural (lapices a lapiz aproximado)
function raiz(t){t=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  t=t.replace(/ces$/,'z').replace(/es$/,'').replace(/s$/,'');return t}
function tokens(s){return normProd(s).split(' ').filter(t=>t.length>2).map(raiz)}
function expandirSinonimos(toks){
  const grupos=(DB[ARCH.sin]&&DB[ARCH.sin].data.grupos)||[];
  const set=new Set(toks);
  toks.forEach(t=>{grupos.forEach(g=>{const gr=g.map(raiz);if(gr.includes(t))gr.forEach(x=>set.add(x))})});
  return [...set];}
function candidatosMaestro(nombre){
  const tq=expandirSinonimos(tokens(nombre)); if(!tq.length)return [];
  return DB[ARCH.prod].data.productos
    .map(p=>{
      const nombres=[p.nombre,...(p.alias||[])];
      let mejor=0;
      nombres.forEach(nm=>{const tn=tokens(nm);
        const comp=tq.filter(t=>tn.includes(t)).length;
        if(!comp)return;
        // relevancia: proporción de tokens de la búsqueda cubiertos + del nombre cubiertos
        const score=(comp/tq.length)*0.6 + (comp/tn.length)*0.4;
        if(score>mejor)mejor=score;});
      return {p,s:mejor};
    })
    .filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s)
    .map(x=>x.p);}
// Devuelve el producto del maestro elegido (exacto, o vía modal si hay similares), o {crear:nombre}
function resolverProducto(nombre){
  return new Promise(res=>{
    const exacto=prodMaestro(nombre);
    if(exacto){res(exacto);return}
    const cand=candidatosMaestro(nombre);
    if(!cand.length){res({crear:nombre});return}
    const ov=document.createElement('div');ov.className='modal-ov';
    const filtro=cand.length>8?`<input id="cand-filtro" placeholder="Filtrar lista…" style="margin:8px 0">`:'';
    ov.innerHTML=`<div class="modal">
      <b>¿A qué producto corresponde?</b>
      <p class="small muted">Escribiste "<b>${esc(nombre)}</b>". Hay ${cand.length} producto(s) similar(es) en el maestro — elige el correcto para ingresar/descontar sobre ese código, o créalo como nuevo si ninguno corresponde.</p>
      ${filtro}
      <div id="cand-list" style="max-height:46vh;overflow-y:auto">${cand.map((p,i)=>`<button class="cand" data-i="${i}"><span class="mono small">${esc(p.codigo)}</span> ${esc(p.nombre)} <span class="mono small muted">· ${esc(p.unidad)}</span>${p.alias&&p.alias.length?`<br><span class="small muted">alias: ${esc(p.alias.slice(0,2).join(', '))}</span>`:''}</button>`).join('')}</div>
      <button class="cand nuevo" data-i="-1">+ Crear "<b>${esc(nombre)}</b>" como producto NUEVO (distinto a los de arriba)</button>
    </div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('.cand').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;ov.remove();res(i<0?{crear:nombre}:cand[i]);});
    const fi=ov.querySelector('#cand-filtro');
    if(fi)fi.oninput=()=>{const q=normProd(fi.value);
      ov.querySelectorAll('#cand-list .cand').forEach(b=>{b.style.display=normProd(b.textContent).includes(q)?'block':'none'})};
  });
}


/* Estado y semaforo de OC */
function ocTot(oc){return oc.items.reduce((s,i)=>s+(+i.cantidad||0),0)}
function ocDesp(oc){return oc.items.reduce((s,i)=>s+(+i.cantidad_despachada||0),0)}
function ocEstado(oc){const t=ocTot(oc),d=ocDesp(oc);return d<=0?'pendiente':(d<t?'parcial':'despachada')}
function ocComp(oc){return oc.items.reduce((s,i)=>s+(+i.cantidad_comprada||0),0)}
function chipCompra(oc){const t=ocTot(oc),c=ocComp(oc);
  if(c<=0)return '<span class="chip rojo">Compra pendiente</span>';
  if(c<t)return `<span class="chip ambar">Compra parcial ${num(c)}/${num(t)}</span>`;
  return '<span class="chip ink">Comprada</span>'}
function semaforo(oc){
  if(ocEstado(oc)==='despachada')return {c:'gris',txt:'despachada'};
  const dd=dias(oc.fecha_entrega);
  const s=DB[ARCH.conf].data.semaforo||{rojo_dias:5,amarillo_dias:10};
  if(dd===null)return {c:'gris',txt:'sin fecha'};
  if(dd<0)return {c:'vencida',txt:`vencida ${Math.abs(dd)} d`};
  if(dd<=s.rojo_dias)return {c:'rojo',txt:`${dd} días`};
  if(dd<=s.amarillo_dias)return {c:'ambar',txt:`${dd} días`};
  return {c:'verde',txt:`${dd} días`};
}
/* Los TRES estados de una OC (Jefe, 24-07-2026), con su color:
   pendiente = gris · parcial = ámbar · despachada = verde.
   El color se aplica al chip Y a la pestaña lateral de la tarjeta. */
const ESTADO_LBL={pendiente:'Pendiente',parcial:'Parcial',despachada:'Despachada'};
const ESTADO_COLOR={pendiente:'gris',parcial:'ambar',despachada:'verde'};
/* Una HOJA DE RUTA usa los mismos tres estados y colores, medidos sobre la conformidad de sus
   guías (Jefe, 24-07-2026): ninguna confirmada = por despachar (gris), algunas = parcial
   (ámbar), todas = conforme (verde). */
const HOJA_LBL={pendiente:'Por despachar',parcial:'Parcial',despachada:'Conforme'};
function hojaEstado(guias){
  if(!guias||!guias.length)return 'pendiente';
  const ok=guias.filter(g=>g.conforme).length;
  return ok===0?'pendiente':(ok<guias.length?'parcial':'despachada');
}
/* Los MISMOS tres estados para las guías (Jefe, 24-07-2026):
   por despachar = gris (aún sin confirmar) · conforme = verde (salió tal cual) ·
   parcial = ámbar (se rectificó: algo no se pudo despachar). */
const GUIA_ESTADO_LBL={pendiente:'Por despachar',parcial:'Parcial',conforme:'Conforme'};
const GUIA_ESTADO_COLOR={pendiente:'gris',parcial:'ambar',conforme:'verde'};
function guiaEstado(g){
  if(!g.conforme)return 'pendiente';
  return (g.rectificaciones||[]).length?'parcial':'conforme';
}

/* ===== Agrupación por mes (Jefe, 30-07-2026) =====
   Cotizaciones, OC y Guías se aglomeran en una pestaña plegable por mes calendario (más
   reciente primero), cerrada hasta que se hace click. En Guías la agrupación por Hoja de
   Ruta (viaje) se conserva ADENTRO de cada mes: el mes es un nivel exterior nuevo, no la
   reemplaza. Usa el mismo mecanismo de fichasAbiertas que ya recuerda qué quedó desplegado. */
const MESES_LBL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function mesKey(fechaISO){const m=/^(\d{4})-(\d{2})/.exec(fechaISO||'');return m?m[1]+'-'+m[2]:null}
function mesLbl(key){if(!key)return 'Sin fecha';const[a,m]=key.split('-');return `${MESES_LBL[(+m)-1]} ${a}`}
/* Agrupa `items` por el mes que entrega fechaFn(item), del más reciente al más antiguo.
   Los que no tengan fecha válida caen en un grupo "Sin fecha" al final (no se pierden,
   pero tampoco desordenan el resto). El orden ORIGINAL dentro de cada mes se respeta. */
function agruparPorMes(items,fechaFn){
  const g={};
  items.forEach(it=>{const k=mesKey(fechaFn(it))||'__sin__';(g[k]=g[k]||[]).push(it)});
  const keys=Object.keys(g).filter(k=>k!=='__sin__').sort((a,b)=>b.localeCompare(a));
  if(g.__sin__)keys.push('__sin__');
  return keys.map(k=>[k,g[k]]);
}
/* Cuenta de estados para el encabezado del mes, en el orden pedido por Jefe (30-07-2026):
   confirmados · pendiente · parcial. `mapa` dice qué valor de estadoFn(item) es cada uno. */
function contarEstados(items,estadoFn,mapa){
  let ok=0,pend=0,parcial=0;
  items.forEach(it=>{const e=estadoFn(it);
    if(e===mapa.ok)ok++;else if(e===mapa.pend)pend++;else if(e===mapa.parcial)parcial++});
  return {ok,pend,parcial};
}
/* Los tres números del encabezado, coloreados con el mismo semáforo verde/gris/ámbar de
   siempre (confirmados=verde, pendiente=gris/muted, parcial=ámbar). */
function cntEstados({ok,pend,parcial}){
  return `<span style="color:var(--verde)">${ok}</span> - <span style="color:var(--muted)">${pend}</span> - <span style="color:var(--ambar)">${parcial}</span>`;
}
function accMes(k,titulo,cnt,cuerpo){
  return `<details class="acc-mes" data-k="mes:${esc(k)}"${fichaAbierta('mes:'+k)?' open':''} ontoggle="recordarFicha(this)">
    <summary><b>${titulo}</b><span class="cnt">${cnt}</span></summary>
    <div class="cuerpo">${cuerpo}</div>
  </details>`;
}
function anioDeMes(k){return k==='__sin__'?null:k.split('-')[0]}
/* Envuelve los grupos de mes en un acordeón de AÑO, pero SOLO si la data cruza más de un año
   (Jefe, 30-07-2026). Con un único año no cambia nada en pantalla: cero ruido en el caso común.
   `grupos` = salida de agruparPorMes; `renderMes` = función que arma el HTML de un grupo mes. */
function renderMeses(prefijo,grupos,renderMes){
  const anios=[...new Set(grupos.map(([k])=>anioDeMes(k)).filter(Boolean))];
  if(anios.length<=1)return grupos.map(renderMes).join('');
  const porAnio={};
  grupos.forEach(g=>{const a=anioDeMes(g[0])||'__sin__';(porAnio[a]=porAnio[a]||[]).push(g)});
  const orden=Object.keys(porAnio).filter(a=>a!=='__sin__').sort((a,b)=>b.localeCompare(a));
  if(porAnio.__sin__)orden.push('__sin__');
  return orden.map(a=>{
    const sub=porAnio[a];
    const total=sub.reduce((s,g)=>s+g[1].length,0);
    const key='anio:'+prefijo+':'+a;
    return `<details class="acc-anio" data-k="${esc(key)}"${fichaAbierta(key)?' open':''} ontoggle="recordarFicha(this)">
      <summary><b>${a==='__sin__'?'Sin fecha':a}</b><span class="cnt">${total} documento${total===1?'':'s'}</span></summary>
      <div class="cuerpo">${sub.map(renderMes).join('')}</div>
    </details>`;
  }).join('');
}

/* Cola de documentos por procesar con Claude */
const TIPO_LBL={cotizaciones:'Cotización',ordenes_compra:'OC',guias_despacho:'Guía de despacho',pendientes_sap:'Pendientes SAP'};
/* Huella SHA-256 del archivo: es lo que permite reconocer un documento ya cargado
   aunque venga con otro nombre (Jefe, 22-07-2026). */
async function huella(file){
  const buf=await file.arrayBuffer();
  const h=await crypto.subtle.digest('SHA-256',buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const EST_LBL={procesado:'ya fue procesado',en_cola:'ya está en la cola esperando proceso',
               duplicado:'ya fue rechazado antes por duplicado',descartado:'fue descartado antes'};
/* Aviso de documentos repetidos. Antes pintaba una tarjeta por archivo, lo que con una tanda
   grande llenaba la pantalla; ahora es una lista compacta con scroll propio: nombre y cuándo
   se había subido antes (Jefe, 30-07-2026). */
function modalDuplicados(dups,nuevos){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='modal-ov';
    ov.innerHTML=`<div class="modal" style="max-width:620px">
      <b>${dups.length===1?'Este documento ya había entrado al sistema':`${dups.length} documentos ya habían entrado al sistema`}</b>
      <p class="small muted" style="margin-top:6px">Se comparó el contenido del archivo, no el nombre: aunque lo hayas renombrado, es el mismo documento.</p>
      <div style="max-height:13em;overflow:auto;margin-top:10px">
        <table class="tprod"><colgroup><col><col style="width:15ch"></colgroup>
        <tr><th>Archivo</th><th>Subido antes</th></tr>
        ${dups.map(d=>{
          const det=[EST_LBL[d.reg.estado]||'ya está registrado',
                     d.reg.referencia||'',
                     d.reg.nombre&&d.reg.nombre!==d.file.name?`se subió como "${d.reg.nombre}"`:''
                    ].filter(Boolean).join(' · ');
          return `<tr><td class="trunc" title="${esc(d.file.name)}${det?' — '+esc(det):''}">${esc(d.file.name)}</td>
            <td class="mono small muted">${d.reg.fecha?fFecha(d.reg.fecha):'—'}</td></tr>`;
        }).join('')}
        </table>
      </div>
      ${nuevos.length?`<p class="small muted" style="margin-top:10px">Los otros ${nuevos.length} archivo(s) sí son nuevos: se suben de todas formas aunque descartes ${dups.length===1?'el repetido':'los repetidos'}.</p>`:''}
      <div class="acciones">
        <button class="btn mini" id="dup-igual">Cargar igualmente</button>
        <button class="btn mini sec" id="dup-omitir">Descartar archivo${dups.length===1?'':'s'}</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const cerrar=r=>{document.removeEventListener('keydown',tecla);ov.remove();res(r)};
    const tecla=e=>{if(e.key==='Escape')cerrar(null)};
    document.addEventListener('keydown',tecla);
    ov.querySelector('#dup-igual').onclick=()=>cerrar('todos');
    ov.querySelector('#dup-omitir').onclick=()=>cerrar('omitir');
    ov.onclick=e=>{if(e.target===ov)cerrar(null)};
  });
}
async function subirPendiente(tipo){
  let files=[...document.getElementById('pd-file-'+tipo).files];
  if(!files.length){toast('Selecciona al menos un archivo.');return}
  velo(true,'Revisando si ya fueron cargados…');
  try{
    const nota=v('pd-nota-'+tipo).trim();
    const fenvEl=document.getElementById('pd-fenv-'+tipo);
    const fenv=fenvEl?fenvEl.value:null;
    if(tipo==='guias_despacho'&&!fenv){velo(false);toast('Indica la fecha de envío del viaje.');return}

    // 1. Huella de cada archivo y cruce contra el registro y contra la propia tanda
    const reg=(DB[ARCH.arch]&&DB[ARCH.arch].data.archivos)||[];
    const hs=[];
    for(const f of files) hs.push({file:f,h:await huella(f)});
    const dups=[],nuevos=[],vistos=new Set();
    hs.forEach(x=>{
      const previo=reg.find(r=>r.hash===x.h);
      const repetidoEnTanda=vistos.has(x.h);
      vistos.add(x.h);
      if(previo) dups.push({...x,reg:previo});
      else if(repetidoEnTanda) dups.push({...x,reg:{estado:'duplicado',nombre:x.file.name,referencia:'repetido dentro de esta misma subida'}});
      else nuevos.push(x);
    });
    if(dups.length){
      velo(false);
      const q=await modalDuplicados(dups,nuevos);
      if(!q)return;
      files=(q==='omitir'?nuevos:hs).map(x=>x.file);
      if(!files.length){toast('No quedaron archivos por subir.');return}
    }
    const porNombre={};hs.forEach(x=>{porNombre[x.file.name]=x.h});

    // 2. Subida
    for(let i=0;i<files.length;i++){
      const f=files[i];
      velo(true,`Subiendo ${i+1} de ${files.length}: ${f.name}`);
      const ruta=await subirDocumento('pendientes/'+tipo,f);
      DB[ARCH.pend].data.pendientes.push({id:'P-'+Date.now()+'-'+i,tipo,archivo:ruta,nombre:f.name,hash:porNombre[f.name],subido:hoyISO(),nota,...(fenv?{fecha_envio:fenv}:{})});
      reg.push({hash:porNombre[f.name],nombre:f.name,tipo,ruta,estado:'en_cola',fecha:hoyISO(),referencia:null});
    }
    await guardarArchivo(ARCH.pend,`${files.length} documento(s) en cola (${tipo})`);
    await guardarArchivo(ARCH.arch,`Registro de archivos: ${files.length} documento(s)`);
    toast(`${files.length} documento(s) en cola. El administrador los procesará y cargará los datos.`);render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

   COLORES: medidos sobre la COT 831 real, no elegidos a ojo.

   - Fondos: Facto deja TODO blanco salvo el encabezado de la tabla, en #F9F9F9.

   COLUMNAS: se revisaron las 58 cotizaciones del repositorio. 'Dsc/Rcrg' e 'Imp. Esp.' están

   de Jefe. 'Validez oferta' va como observación, igual que en Facto. */
const TINTA=[0x33,0x33,0x33], AZUL=[0x27,0x4C,0x7B], ROJO=[0xCC,0x00,0x00],
      LINEA=[0xBB,0xBB,0xBB], FONDO=[0xF9,0xF9,0xF9];
const EMPRESA={
  nombre:'NOVETEC SPA', rut:'RUT: 77.717.888-1',
  giro:'Com. Art. Ferretería, Const, EPP, Menaje, Art. Eléctricos y Papelería',
  dir:'Casa Matriz: Camino a Melipilla # 7786, Cerrillos, Santiago',
  fono:'Fono: 233411168', email:'Email: novetec@novetec.cl', web:'http://www.novetec.cl'};

function cotizacionPDF(jsPDFCtor,cot,logoB64){
  const doc=new jsPDFCtor({unit:'mm',format:'letter'});
  const W=215.9, H=279.4, M=15, AN=W-2*M;
  const tinta=()=>doc.setTextColor(...TINTA);
  const linea=()=>doc.setDrawColor(...LINEA);
  tinta(); linea();

  /* ── Encabezado ── */
  let y=14;
  if(logoB64){try{doc.addImage(logoB64,'JPEG',M,y-2,21,22.7)}catch(e){}}
  const xT=M+25;
  doc.setTextColor(...AZUL).setFont('helvetica','bold').setFontSize(12).text(EMPRESA.nombre,xT,y+2);
  tinta().setFont('helvetica','normal').setFontSize(7.2);
  let yy=y+6.5;
  doc.splitTextToSize(EMPRESA.giro,80).forEach(l=>{doc.text(l,xT,yy);yy+=3.2});
  [EMPRESA.dir,EMPRESA.fono,EMPRESA.email,EMPRESA.web].forEach(t=>{doc.text(t,xT,yy);yy+=3.2});

  const bx=W-M-56, bw=56;
  doc.setDrawColor(...ROJO).setLineWidth(0.5).rect(bx,y-3,bw,17);
  doc.setTextColor(...ROJO).setFont('helvetica','bold').setFontSize(8.5)
     .text(EMPRESA.rut,bx+bw/2,y+2,{align:'center'});
  doc.setFontSize(11).text('COTIZACIÓN',bx+bw/2,y+7.5,{align:'center'});
  doc.setFontSize(12).text('N° '+cot.folio,bx+bw/2,y+13,{align:'center'});
  linea().setLineWidth(0.3).rect(bx,y+17,bw,7);
  tinta().setFont('helvetica','normal').setFontSize(8.5)
     .text('Fecha: '+fFecha(cot.fecha),bx+bw/2,y+21.7,{align:'center'});

  /* ── Bloque del cliente: sin relleno, como Facto ── */
  y=Math.max(yy,y+24)+5;
  const hCli=22;
  doc.setLineWidth(0.3).rect(M,y,AN,hCli);
  const dato=(et,va,x,yl)=>{
    doc.setFont('helvetica','bold').setFontSize(7.5).text(et,x,yl);
    doc.setFont('helvetica','normal').setFontSize(8).text(String(va||''),x+27,yl);
  };
  /* El NOMBRE del comprador no va en el PDF: en la cotización de Facto tampoco aparece.
     En la app sirve como llave para rellenar su correo y su teléfono, y ahí se queda.
     De cada uno se imprime UNO solo, el marcado como principal. */
  /* El nombre del comprador vuelve al documento (Jefe, 05-08-2026). Se había sacado para
     calcar a Facto, pero identifica a quién va dirigida la oferta y eso vale más que el calco. */
  dato('Señor(es)',cot.cliente,M+3,y+5);              dato('RUT',cot.rut_cliente,M+AN/2,y+5);
  dato('Contacto',cot.contacto_nombre,M+3,y+10);      dato('Teléfono',cot.contacto_fono,M+AN/2,y+10);
  dato('Email Cliente',cot.contacto_email,M+3,y+15);  dato('Email Vendedor',cot.vendedor_email,M+AN/2,y+15);
  dato('Vendedor',cot.vendedor,M+3,y+20);

  /* ── Tabla de ítems, de alto fijo ── */
  y+=hCli+6;
  const Y_BLOQUES=184;
  /* Cantidad necesita ancho: con unidades libres cabe "100 ROLLO" o "1.250 MT", no solo
     "1 UN". Con 15 mm el texto se salía sobre la columna vecina. */
  const COL=[{t:'Servicio/Producto',w:63,a:'left'},{t:'Descripción',w:38,a:'left'},
             {t:'Cant.',w:20,a:'right'},{t:'Valor',w:23,a:'right'},
             {t:'Afec. IVA',w:17,a:'center'},{t:'Total',w:24.9,a:'right'}];
  const xCol=[];{let x=M;COL.forEach(c=>{xCol.push(x);x+=c.w})}
  const px=i=>COL[i].a==='right'?xCol[i]+COL[i].w-2:(COL[i].a==='center'?xCol[i]+COL[i].w/2:xCol[i]+2);
  const al=i=>COL[i].a==='right'?'right':(COL[i].a==='center'?'center':'left');
  const encabezado=()=>{
    doc.setFillColor(...FONDO).setLineWidth(0.3);
    COL.forEach((c,i)=>doc.rect(xCol[i],y,c.w,7,'FD'));
    doc.setFont('helvetica','bold').setFontSize(7.8);
    COL.forEach((c,i)=>doc.text(c.t,px(i),y+4.6,{align:al(i)}));
    y+=7;
  };
  encabezado();
  let neto=0;
  cot.items.forEach(it=>{
    const tot=(+it.cantidad||0)*(+it.precio_unitario||0); neto+=tot;
    const nom=doc.splitTextToSize(String(it.producto||''),COL[0].w-4);
    const des=doc.splitTextToSize(String(it.descripcion||''),COL[1].w-4);
    const alto=Math.max(7,3.4*Math.max(nom.length,des.length)+3.6);
    if(y+alto>Y_BLOQUES){
      doc.setLineWidth(0.3).rect(M,y,AN,Y_BLOQUES-y);
      doc.addPage(); tinta(); linea(); y=18; encabezado();
    }
    doc.setLineWidth(0.3);
    COL.forEach((c,i)=>doc.rect(xCol[i],y,c.w,alto));
    doc.setFont('helvetica','normal').setFontSize(7.8);
    [nom,des,`${it.cantidad} ${it.unidad||'UN'}`,clp(it.precio_unitario),'SI',clp(tot)]
      .forEach((txt,i)=>(Array.isArray(txt)?txt:[txt])
        .forEach((l,k)=>doc.text(String(l),px(i),y+4.4+k*3.4,{align:al(i)})));
    y+=alto;
  });
  if(y<Y_BLOQUES)doc.setLineWidth(0.3).rect(M,y,AN,Y_BLOQUES-y);

  /* ── Observaciones y totales, anclados bajo la tabla ── */
  const iva=Math.round(neto*0.19), total=neto+iva;
  const yB=Y_BLOQUES+5, wTot=70, wObs=AN-wTot-5, xt=W-M-wTot;
  const filas=[['Moneda','PESO CHILENO',false],['Monto Neto',clp(neto),false],
               ['Monto Exento',clp(0),false],['IVA 19%',clp(iva),false],['Total',clp(total),true]];
  const hBloque=7+filas.length*6.6;
  doc.setLineWidth(0.3).rect(M,yB,wObs,hBloque);
  doc.line(M,yB+7,M+wObs,yB+7);
  doc.setFont('helvetica','bold').setFontSize(8).text('Observaciones',M+3,yB+4.8);
  doc.setFont('helvetica','normal').setFontSize(7.8);
  let yo=yB+11.8;
  const obs=[].concat(cot.validez?[`VALIDEZ OFERTA ${cot.validez}`]:[],cot.observaciones||[]);
  obs.forEach(o=>doc.splitTextToSize(String(o),wObs-6)
    .forEach(l=>{if(yo<yB+hBloque-1.5){doc.text(l,M+3,yo);yo+=3.8}}));
  let yt=yB;
  doc.setLineWidth(0.3).rect(xt,yt,wTot,7);
  doc.setFont('helvetica','bold').setFontSize(8).text('Resumen',xt+3,yt+4.8);
  yt+=7;
  filas.forEach(([et,va,neg])=>{
    doc.setLineWidth(0.3).rect(xt,yt,wTot,6.6);
    doc.setFont('helvetica',neg?'bold':'normal').setFontSize(neg?9:8);
    doc.text(et,xt+3,yt+4.6); doc.text(String(va),W-M-3,yt+4.6,{align:'right'});
    yt+=6.6;
  });

  /* ── Pie ── */
  const yPie=H-12;
  doc.setLineWidth(0.3).line(M,yPie-4,W-M,yPie-4);
  doc.setFont('helvetica','normal').setFontSize(6.8);
  doc.text('Documento no tributario. Precios en pesos chilenos, afectos a IVA.',M,yPie);
  doc.text(EMPRESA.web,W-M,yPie,{align:'right'});
  return {doc,neto,iva,total};
}


/* ══════════════════ PLANILLA CONSOLIDADA DEL CLIENTE ══════════════════
   Agrosuper manda un Excel con lo que necesita cotizar y espera el MISMO archivo de vuelta
   con nuestros precios en su columna. La app lo lee, deja poner precio línea por línea con
   los mismos botones de historial, y devuelve el archivo completado.

   POR QUÉ NO SE REGENERA EL EXCEL: el archivo es del cliente y trae sus colores, anchos,
   celdas combinadas y las columnas de los otros tres proveedores. Reescribirlo con una
   librería perdería todo eso. En vez de eso se abre el .xlsx como el ZIP que es y se le
   escriben SOLO las celdas de precio dentro del XML de la hoja. Lo demás no se toca.
   Mismo criterio que la hoja de ruta: copiar el archivo, no reconstruirlo. */
const PL_COL={centro:'C',solped:'D',material:'E',nombre:'F',cantidad:'G',unidad:'H',precio:'I'};
const PL_FILA_ENC=10;                       // fila de encabezados; los datos parten en la 11

const colNum=L=>[...L.toUpperCase()].reduce((n,c)=>n*26+c.charCodeAt(0)-64,0);
const refCol=r=>String(r).match(/^[A-Z]+/)[0];

/* Escribe un número en una celda del XML de la hoja, respetando el orden de columnas y
   conservando el estilo que ya tenía esa celda o, si no existía, el de su vecina de arriba. */
function xlsxEscribirNumero(xml,fila,colLetra,valor){
  const ref=colLetra+fila, ci=colNum(colLetra);
  const reFila=new RegExp(`<row[^>]*\\sr="${fila}"[^>]*(?:/>|>[\\s\\S]*?</row>)`);
  const mFila=reFila.exec(xml);
  if(!mFila)return xml;                                  // fila inexistente: no inventamos
  let bloque=mFila[0];
  /* OJO con el cuantificador: si el segundo [^>]* es GOLOSO, en una celda vacía
     <c r="I11" s="9"/> se traga la barra, calza con la rama ">…</c>" y el match se extiende
     hasta el </c> de la celda siguiente que sí tenga contenido. Resultado: al reemplazar se
     borran las celdas intermedias, incluidas las fórmulas del cliente. Con [^>]*? cierra en
     la primera oportunidad y cada celda queda acotada a sí misma. */
  const celdas=[...bloque.matchAll(/<c\s[^>]*r="([A-Z]+\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)];
  const existente=celdas.find(c=>c[1]===ref);
  // estilo: el de la celda misma, o el de otra celda de la misma columna en el archivo
  let s='';
  const conS=existente?existente[0]:null;
  const mS=conS&&/\ss="(\d+)"/.exec(conS);
  if(mS)s=` s="${mS[1]}"`;
  else{
    // Estilo de otra celda de precio YA LLENA, no de una del encabezado: si se copia el de
    // arriba, los precios nuevos salen con otro formato de número que los existentes.
    const otra=new RegExp(`<c\\s[^>]*r="${colLetra}(\\d+)"[^>]*\\ss="(\\d+)"[^>]*>\\s*<v>`).exec(xml);
    if(otra&&+otra[1]>PL_FILA_ENC)s=` s="${otra[2]}"`;
  }
  /* Sin precio NO se borra la celda: se deja VACÍA conservando su estilo. Borrarla le quita
     los bordes y la planilla queda con huecos abiertos en la grilla. Vacía con estilo es lo
     mismo que ve el cliente en una línea que nadie cotizó. */
  const nueva=valor==null||valor===''?`<c r="${ref}"${s}/>`:`<c r="${ref}"${s}><v>${+valor}</v></c>`;
  let nuevo;
  if(existente)nuevo=bloque.replace(existente[0],nueva);
  else{
    const sig=celdas.find(c=>colNum(refCol(c[1]))>ci);
    if(sig)nuevo=bloque.replace(sig[0],nueva+sig[0]);
    else if(/\/>$/.test(bloque))nuevo=bloque.replace(/\/>$/,`>${nueva}</row>`);
    else nuevo=bloque.replace(/<\/row>$/,nueva+'</row>');
  }
  return xml.replace(bloque,nuevo);
}

/* Busca rastros NUESTROS dentro del archivo del cliente. Una planilla que ya pasó por
   nosotros puede traer notas internas pegadas —códigos NOV, folios de cotización, precios
   de referencia— y si se reenvía así, el cliente ve información que no le corresponde.
   La app tiene prohibido tocar nada fuera de la columna de precio, así que no las borra:
   AVISA, con la celda exacta, para que Jefe decida antes de mandar el archivo.
   El patrón busca códigos NOV y menciones a Novetec, que en un archivo del cliente no
   tienen por qué aparecer en el cuerpo de la planilla. */
const PL_RASTRO=/NOV-\d{3,}|novetec|lista de precios/i;
function plNotasInternas(wb){
  const XLSXlib=window.XLSX, out=[];
  wb.SheetNames.forEach(nombre=>{
    const ws=wb.Sheets[nombre]; if(!ws||!ws['!ref'])return;
    Object.keys(ws).forEach(ref=>{
      if(ref[0]==='!')return;
      const cel=ws[ref]; if(!cel||cel.t!=='s')return;
      const t=String(cel.v||'');
      if(t.length>25&&PL_RASTRO.test(t))out.push({hoja:nombre,ref,texto:t});
    });
  });
  return out;
}
/* Lee la hoja CONSOLIDADO devolviendo una línea por fila con datos. */
function plLeerConsolidado(wb){
  const XLSXlib=window.XLSX;
  const hoja=wb.SheetNames.find(n=>/CONSOLIDADO/i.test(n))||wb.SheetNames[0];
  const ws=wb.Sheets[hoja];
  const cel=(c,f)=>{const v=ws[c+f];return v==null?null:(v.w!=null&&v.t==='s'?v.w:v.v)};
  const rango=XLSXlib.utils.decode_range(ws['!ref']);
  const filas=[];
  for(let f=PL_FILA_ENC+1;f<=rango.e.r+1;f++){
    const nombre=cel(PL_COL.nombre,f);
    if(nombre==null||String(nombre).trim()==='')continue;
    filas.push({fila:f,centro:cel(PL_COL.centro,f),solped:cel(PL_COL.solped,f),
      material:cel(PL_COL.material,f)==null?null:String(cel(PL_COL.material,f)).trim(),
      nombre:String(nombre).trim(),cantidad:+cel(PL_COL.cantidad,f)||0,
      unidad:cel(PL_COL.unidad,f)||'UN',
      precio_original:cel(PL_COL.precio,f),precio:''});
  }
  return {hoja,filas};
}

/* REGLA DEL ARCHIVO DEL CLIENTE (Jefe, 04-08-2026): lo ÚNICO que se escribe es la columna
   de precio, la primera de las cuatro rotuladas PROV4, justo después de Unidad. Todo lo
   demás —fórmulas, formatos, las otras tres columnas de proveedores, las demás hojas, hasta
   el valor que cada fórmula lleva cacheado— es SOLO LECTURA: se usa para calzar con nuestra
   base y nada más. Si en el futuro hay que tocar algo más, se decide antes, no sobre la
   marcha.
   Consecuencia asumida: no se limpia el resultado cacheado de las fórmulas del cliente. Este
   archivo no trae calcChain, así que Excel recalcula al abrirlo y las columnas de adjudicación
   se actualizan solas. Si algún visor no recalculara, basta con abrir y guardar. */
let _pl=null;
async function cargarPlanilla(inp){
  const file=inp.files&&inp.files[0]; if(!file)return;
  velo(true,'Leyendo la planilla…');
  try{
    const XLSXlib=await cargarXLSX();
    const buf=await file.arrayBuffer();
    const wb=XLSXlib.read(new Uint8Array(buf),{type:'array'});
    const {hoja,filas}=plLeerConsolidado(wb);
    if(!filas.length)throw new Error('no encontré líneas de producto en la hoja CONSOLIDADO');
    // Resolver contra el maestro: primero por código SAP, que es lo confiable; el nombre solo si falla
    filas.forEach(f=>{
      const P=DB[ARCH.prod].data.productos;
      let p=f.material?P.find(x=>sapsDe(x).includes(String(f.material))):null;
      if(!p)p=prodMaestro(f.nombre);
      f.codigo=p?p.codigo:null;
      f.producto=p?p.nombre:f.nombre;
      f.bodega=bodegaDeCentro(f.centro)||'';
    });
    const cl=clientes()[0]||{};
    _pl={file,buf,hoja,filas,cliente:cl.nombre||'',contacto_nombre:'',validez:'7 DIAS',
         obsDespacho:'',obsEditada:false,notas:plNotasInternas(wb)};
    velo(false);render();
    setTimeout(()=>{const e=document.getElementById('pl-panel');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},60);
  }catch(e){velo(false);toast('No pude leer la planilla: '+e.message)}
  inp.value='';
}
function cancelarPlanilla(){_pl=null;render()}
function plSet(c,v){if(!_pl)return;_pl[c]=v;render()}
function plFila(i,c,v){if(!_pl)return;_pl.filas[i][c]=v;render()}
function plPrecio(i,fuente){
  const f=_pl.filas[i];
  if(!f.codigo){toast('Esa línea no calza con ningún producto del maestro.');return}
  const p=ultimoPrecio(f.codigo,fuente);
  if(!p){toast(`Sin precio previo ${fuente==='oc'?'adjudicado':'ofertado'} para ${f.producto}.`);return}
  f.precio=p.precio;render();
}
function panelPlanilla(){
  if(!_pl)return '';
  const conCot=_pl.filas.filter(f=>+f.precio>0);
  const neto=conCot.reduce((s,f)=>s+(+f.precio)*(+f.cantidad||0),0);
  const cl=clientePorNombre(_pl.cliente)||{};
  return `<div id="pl-panel" class="form" style="border:2px solid var(--ambar);border-radius:10px;padding:14px;margin:12px 0">
    <b style="font-size:15px">Planilla del cliente · ${esc(_pl.file.name)}</b>
    <p class="small muted">Los precios que pongas aquí se escriben en la columna PROV4 del MISMO archivo y te lo devuelvo completado. Dejar una línea en blanco significa NO COTIZAR ese producto: así lo entiende la planilla.</p>
    ${(_pl.notas||[]).length?`<div class="chip rojo" style="display:block;white-space:normal;margin:8px 0;padding:10px">
      <b>Este archivo trae ${_pl.notas.length} nota(s) internas nuestras.</b> Vienen de una vez anterior en que se trabajó esta planilla, no las agregó la app. Si se lo mandas así al cliente, va a ver información que no le corresponde. Bórralas en Excel antes de enviar:
      <ul style="margin:6px 0 0 18px">${_pl.notas.map(n=>`<li><b>${esc(n.hoja)} ${esc(n.ref)}</b>: ${esc(n.texto.slice(0,90))}${n.texto.length>90?'…':''}</li>`).join('')}</ul></div>`:''}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px">
      <div><label>Cliente</label><select onchange="plSet('cliente',this.value)">
        ${clientes().map(c=>`<option value="${esc(c.nombre)}"${_pl.cliente===c.nombre?' selected':''}>${esc(c.corto)}</option>`).join('')}</select></div>
      <div><label>Comprador</label><input list="cn-compradores" value="${esc(_pl.contacto_nombre)}" onchange="plSet('contacto_nombre',this.value)">
        <datalist id="cn-compradores">${(cl.contactos||[]).map(k=>`<option value="${esc(k.nombre)}">`).join('')}</datalist></div>
      <div><label>Condición / validez</label><input list="cn-cond" value="${esc(_pl.validez)}" onchange="plSet('validez',this.value)">
        <datalist id="cn-cond">${CONDICIONES.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
    </div>
    <table style="margin-top:10px"><tr><th>Producto solicitado</th><th>Bodega</th><th class="num">Cant.</th><th>Precio unitario</th></tr>
    ${_pl.filas.map((f,i)=>{
      const oc=f.codigo?ultimoPrecio(f.codigo,'oc'):null, co=f.codigo?ultimoPrecio(f.codigo,'cot'):null;
      return `<tr${+f.precio>0?'':' style="opacity:.62"'}>
        <td class="trunc" title="${esc(f.nombre)}">${esc(f.nombre)}<br>
          <span class="small ${f.codigo?'muted':''}">${f.codigo?esc(f.codigo):'<span class="chip rojo">fuera del maestro</span>'}${f.material?' · SAP '+esc(f.material):''}</span></td>
        <td class="small">${esc(f.bodega||f.centro||'—')}</td>
        <td class="num">${num(f.cantidad)} ${esc(f.unidad)}</td>
        <td><div style="display:flex;gap:6px;align-items:center;flex-wrap:nowrap">
          <input style="width:110px" placeholder="sin cotizar" value="${f.precio===''?'':esc(String(f.precio))}" onchange="plFila(${i},'precio',this.value===''?'':(+this.value||0))">
          <button class="btn mini sec" ${oc?'':'disabled'} onclick="plPrecio(${i},'oc')" title="${oc?`Adjudicado el ${fFecha(oc.fecha)} en la OC ${esc(oc.ref)}`:'Sin precio adjudicado previo'}">OC ${oc?clp(oc.precio):'—'}</button>
          <button class="btn mini sec" ${co?'':'disabled'} onclick="plPrecio(${i},'cot')" title="${co?`Ofertado el ${fFecha(co.fecha)} en ${esc(co.ref)}`:'Sin precio ofertado previo'}">Cot ${co?clp(co.precio):'—'}</button>
        </div></td></tr>`}).join('')}
    </table>
    <div class="small muted" style="margin-top:8px">${conCot.length} de ${_pl.filas.length} línea(s) cotizadas · neto ${clp(neto)}</div>
    <div class="acciones" style="margin-top:10px">
      <button class="btn" onclick="generarPlanilla()"><i class="fa-solid fa-file-excel"></i> Generar y descargar el Excel</button>
      <button class="btn sec" onclick="cancelarPlanilla()">Cancelar</button>
    </div></div>`;
}
async function generarPlanilla(){
  if(!_pl)return;
  const cot=_pl.filas.filter(f=>+f.precio>0);
  if(!cot.length){toast('No hay ninguna línea con precio.');return}
  const cl=clientePorNombre(_pl.cliente); if(!cl){toast('Elige el cliente.');return}
  const sinCod=cot.filter(f=>!f.codigo);
  if(sinCod.length&&!await confirmar({titulo:'Productos fuera del maestro',
    texto:`${sinCod.length} línea(s) cotizadas no calzan con el maestro: ${sinCod.map(f=>f.nombre).join(', ')}.\nSe escriben igual en el Excel, pero no van a emparejar solas cuando llegue la OC.`,
    confirmar:'Continuar'}))return;
  const avisoNotas=(_pl.notas||[]).length;
  if(avisoNotas&&!await confirmar({titulo:'El archivo trae notas internas',peligro:true,
    texto:`Este Excel conserva ${avisoNotas} nota(s) nuestras en ${_pl.notas.map(n=>n.ref).join(', ')}. `
      +`La app no las toca ni las borra. Si lo envías así, el cliente las va a leer.\n¿Generar igual?`,
    confirmar:'Generar igual'}))return;
  const conf=DB[ARCH.conf].data, n=+conf.proxima_cotizacion_prueba||31, folio='P'+n;
  velo(true,'Completando la planilla…');
  try{
    const JSZipLib=await cargarJSZip();
    const zip=await JSZipLib.loadAsync(_pl.buf);
    // Ubicar el XML de la hoja: el nombre visible no dice en qué archivo está
    const wbxml=await zip.file('xl/workbook.xml').async('string');
    const rels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
    const mh=new RegExp(`<sheet[^>]*name="${_pl.hoja}"[^>]*r:id="([^"]+)"`).exec(wbxml)
          ||/<sheet[^>]*r:id="([^"]+)"/.exec(wbxml);
    const mt=new RegExp(`Id="${mh[1]}"[^>]*Target="([^"]+)"`).exec(rels);
    const ruta='xl/'+String(mt[1]).replace(/^\//,'').replace(/^xl\//,'');
    let xml=await zip.file(ruta).async('string');
    _pl.filas.forEach(f=>{xml=xlsxEscribirNumero(xml,f.fila,PL_COL.precio,+f.precio>0?+f.precio:null)});
    zip.file(ruta,xml);
    // El compresor agrega entradas de carpeta que el archivo original no traía: se quitan
    // para que el paquete devuelto tenga exactamente las mismas partes que el recibido.
    Object.keys(zip.files).forEach(k=>{if(zip.files[k].dir)delete zip.files[k]});
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',createFolders:false,
      mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const nombre=`Cotizacion_${folio}_${fFecha(hoyISO())}.xlsx`;
    const ruta_repo='documentos/cotizaciones/'+nombre;
    await subirBinario(ruta_repo,blob,`Planilla cotizada ${folio} (prueba)`);
    const neto=cot.reduce((s,f)=>s+(+f.precio)*(+f.cantidad||0),0);
    const iva=Math.round(neto*0.19);
    DB[ARCH.cot].data.cotizaciones.push({
      id:'COT-APP-'+folio,folio,fecha:hoyISO(),cliente:cl.nombre,estado:'abierta',
      prueba:true,origen:'app',formato:'planilla',neto,iva,total:neto+iva,archivo:ruta_repo,
      contacto_nombre:_pl.contacto_nombre||null,validez:_pl.validez,
      /* La bodega viene del CENTRO de la planilla, que sale del SAP del cliente:
         es dato duro por línea, no una deducción de texto libre. */
      items:cot.map(f=>({producto:f.producto,codigo:f.codigo||null,codigo_sap:f.material||null,
        nombre_cliente:f.nombre,bodega:f.bodega||null,centro:f.centro==null?null:String(f.centro),
        cantidad:+f.cantidad,unidad:f.unidad||'UN',precio_unitario:+f.precio})),
      notas:`Planilla del cliente completada desde la app (prueba). ${_pl.filas.length-cot.length} línea(s) quedaron sin cotizar.`});
    const H=DB[ARCH.hprec].data;
    cot.forEach(f=>{if(f.codigo)H.cotizaciones.push({codigo:f.codigo,codigo_sap:f.material||null,
      producto:f.producto,fecha:hoyISO(),folio,precio:+f.precio,origen:'cotizacion',folio_oc:folio})});
    H.actualizado=hoyISO();
    conf.proxima_cotizacion_prueba=n+1;
    await guardarArchivo(ARCH.hprec,`Precios ofertados de la planilla ${folio}`);
    await guardarArchivo(ARCH.conf,`Próxima cotización de prueba: P${n+1}`);
    await guardarArchivo(ARCH.cot,`Planilla ${folio} cotizada desde la app (prueba)`);
    _pl=null;
    bajarBlob(blob,nombre);
    toast(avisoNotas
      ? `${folio} generado, pero el Excel conserva ${avisoNotas} nota(s) internas: bórralas antes de enviarlo.`
      : `${folio}: ${cot.length} línea(s) cotizadas por ${clp(neto)}. Excel descargado.`);
    render();
  }catch(e){velo(false);if(e.message!=='conflicto')toast('No se pudo generar: '+e.message)}
}

/* ══════════════════ EMISIÓN DE COTIZACIONES ══════════════════
   La app pasa a emitir cotizaciones, hasta hoy hechas en Facto. Una cotización NO es un DTE
   (sin timbre SII ni folio tributario), así que podemos emitirla nosotros.

   MODO PRUEBA (Jefe, 04-08-2026): mientras se prueba, Facto sigue emitiendo en paralelo. Por
   eso las de la app llevan folio "P31", "P32"… con correlativo propio: no chocan con la serie
   real y se reconocen de un vistazo. Al archivarlas se cierran Y se sueltan sus adjudicaciones,
   devolviendo las líneas de OC a "sin adjudicar" para asignarlas a la cotización de Facto
   correcta. Sin ese paso, una prueba dejaría consumido un saldo que no consumió de verdad. */
const COT_PDF_CDN='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let _jspdfProm=null;
function cargarJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  if(_jspdfProm)return _jspdfProm;
  _jspdfProm=new Promise((ok,mal)=>{
    const s=document.createElement('script'); s.src=COT_PDF_CDN;
    s.onload=()=>ok(window.jspdf.jsPDF);
    s.onerror=()=>{_jspdfProm=null;mal(new Error('No se pudo cargar el generador de PDF. Revisa la conexión.'))};
    document.head.appendChild(s);
  });
  return _jspdfProm;
}
let _logoB64=null;
async function logoCotizacion(){
  if(_logoB64!==null)return _logoB64;
  try{
    const buf=await bajarBinarioRepo('documentos/plantillas/logo_hoja_ruta.jpeg');
    let bin=''; const a=new Uint8Array(buf);
    for(let i=0;i<a.length;i+=8192)bin+=String.fromCharCode(...a.subarray(i,i+8192));
    _logoB64='data:image/jpeg;base64,'+btoa(bin);
  }catch(e){_logoB64=''}          // sin logo el documento igual sale
  return _logoB64;
}
const clientes=()=>((DB[ARCH.cli]&&DB[ARCH.cli].data.clientes)||[])
  .slice().sort((a,b)=>(+a.orden||99)-(+b.orden||99));
/* Un cliente con la lista de bodegas VACÍA no está restringido: se le ofrecen todas. Las
   razones sociales del grupo cotizan casi siempre desde la oficina central de Rancagua y no
   siempre ajustan los datos, así que restringir por cliente generaría más problemas que los
   que resuelve. */
const bodegasDe=cl=>((cl&&cl.bodegas&&cl.bodegas.length)?cl.bodegas:bodegasOrden());
const clientePorNombre=n=>clientes().find(c=>c.nombre===n||c.corto===n)||null;
const contactoPrincipal=(lista)=>{const l=lista||[];return (l.find(x=>x.principal)||l[0]||{}).valor||''};

/* Últimos precios del historial. Se muestran los DOS: lo que ofertamos y lo que el cliente
   efectivamente compró. La app NO propone un precio sola — cotizar es decisión comercial. */
function ultimoPrecio(codigo,fuente){
  const H=DB[ARCH.hprec].data;
  const arr=fuente==='oc'?(H.observaciones||[]):(H.cotizaciones||[]);
  const c=arr.filter(x=>x.codigo===codigo&&+x.precio>0)
    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  return c.length?{precio:+c[0].precio,fecha:c[0].fecha,ref:c[0].folio_oc||c[0].folio||''}:null;
}

/* El texto de despacho se arma solo con los datos ya elegidos. En las 58 cotizaciones del
   repositorio esta línea está escrita de veinte formas distintas ("DESP A", "DESPACHO A",
   "DESPACHOS A", "//", "Y/O", "AT:", "AT.:", "ATENCION"), porque se tipea a mano cada vez.
   Al componerla queda pareja siempre, y el dato ya vive estructurado en la cotización.
   Si Jefe la edita a mano, deja de recomponerse: manda lo que él escribió. */
/* La unidad no es decorativa: 100 no significa lo mismo en rollos, metros, litros o kilos,
   y el cliente cotiza y recibe por esa unidad. La lista son las habituales, pero el campo
   es libre: siempre aparece una unidad que no estaba prevista. */
const UNIDADES=['UN','MT','KG','LT','ROLLO','CAJA','PAR','JGO','M2','M3','SACO','BOLSA','PQTE','TAMBOR','TON','GL'];
const CONDICIONES=['7 DIAS','7 DIAS HABILES','HASTA AGOTAR STOCK','PRODUCTO A PEDIDO',
                   'ENTREGA INMEDIATA','3 DIAS HABILES','A CONVENIR'];
/* Traduce la condición a texto con fecha cuando se puede: "7 DIAS" dice poco dentro de un mes,
   "7 DIAS (HASTA EL 12-08-2026)" no deja dudas. Los días hábiles saltan sábados y domingos.
   Si la condición no habla de días (hasta agotar stock, a convenir), va tal cual. */
function textoValidez(cond){
  const t=String(cond||'').toUpperCase().trim();
  const m=/^(\d+)\s*DIAS(\s*HABILES)?$/.exec(t);
  if(!m)return t;
  const habiles=!!m[2], d=new Date(hoyISO()+'T12:00:00');
  let quedan=+m[1];
  while(quedan>0){d.setDate(d.getDate()+1);if(!habiles||(d.getDay()!==0&&d.getDay()!==6))quedan--}
  const iso=d.toISOString().slice(0,10);
  return `${t} (HASTA EL ${fFecha(iso)})`;
}
function cnTextoDespacho(){
  if(!_cotN||_cotN.obsEditada)return;
  const bs=[...new Set(_cotN.items.map(i=>i.bodega).filter(Boolean))];
  const ord=bodegasOrden();
  bs.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
  const nom=b=>b==='RETIRA CLIENTE'?b:bodegaDespacho(b);
  /* Tres bloques separados por línea en blanco: destino, a quién va dirigida, y hasta cuándo
     rige el precio. En una sola línea corrida los tres datos se leían como un párrafo. */
  const partes=[];
  if(bs.length===1)partes.push(bs[0]==='RETIRA CLIENTE'?'RETIRA CLIENTE':'DESP A '+nom(bs[0]));
  else if(bs.length>1)partes.push('DESP A BODEGAS: '+bs.map(nom).join(' Y/O '));
  if(_cotN.contacto_nombre)partes.push('AT.: '+_cotN.contacto_nombre.toUpperCase());
  if(_cotN.validez)partes.push('VALIDEZ DE PRECIO '+textoValidez(_cotN.validez));
  _cotN.obsDespacho=partes.join('\n\n');
}

/* El NOMBRE del comprador es único: al calzar se rellenan su correo y su teléfono
   principales. Si no calza, los tres campos quedan libres para escribir a mano. */
function cnAutorrelleno(){
  const cl=clientePorNombre(_cotN.cliente); if(!cl)return;
  const k=(cl.contactos||[]).find(x=>x.nombre===_cotN.contacto_nombre);
  if(!k)return;
  _cotN.contacto_email=contactoPrincipal(k.emails);
  _cotN.contacto_fono=contactoPrincipal(k.telefonos);
}
/* La estrellita: fija cuál correo o teléfono se imprime por defecto de aquí en adelante. */
async function cnPrincipal(tipo,valor){
  const cl=clientePorNombre(_cotN.cliente); if(!cl)return;
  const k=(cl.contactos||[]).find(x=>x.nombre===_cotN.contacto_nombre); if(!k)return;
  (k[tipo]||[]).forEach(x=>x.principal=(x.valor===valor));
  try{await guardarArchivo(ARCH.cli,`${k.nombre}: ${tipo==='emails'?'correo':'teléfono'} principal ${valor}`);
    toast('Marcado como principal.');render()}
  catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
}
