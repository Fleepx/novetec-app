async function emitirCotizacion(){
  if(!_cotN)return;
  const cl=clientePorNombre(_cotN.cliente);
  if(!cl){toast('Elige el cliente.');return}
  if(cl.rut==='PENDIENTE'&&!await confirmar({titulo:'Datos del cliente incompletos',
    texto:`${cl.corto} todavía tiene el RUT y la dirección como PENDIENTE. La cotización saldría con esos marcadores impresos. ¿Continuar igual?`,
    confirmar:'Continuar',peligro:true}))return;
  const items=_cotN.items.filter(i=>i.producto&&+i.cantidad>0&&+i.precio>0);
  if(!items.length){toast('Necesitas al menos una línea con producto, cantidad y precio.');return}
  const sinCod=items.filter(i=>!i.codigo);
  if(sinCod.length&&!await confirmar({titulo:'Productos fuera del maestro',

      /* La bodega por línea es CONFIABLE aquí: la eligió Jefe al cotizar, no se dedujo de un
         texto libre. Para el match vale como la de una cotización XLSX, no como la de un PDF. */
      items:items.map(i=>({producto:i.producto,codigo:i.codigo||null,
        nombre_cliente:i.descripcion||null,bodega:i.bodega||null,

  }catch(e){velo(false);if(e.message!=='conflicto')toast('No se pudo emitir: '+e.message)}

/* Abre Outlook con destinatario, asunto y cuerpo listos.
   El cuerpo es una CARTA DE PRESENTACIÓN, corta y formal: los productos, cantidades, precios
   y totales ya van en el PDF y repetirlos en el correo solo agrega ruido y una fuente más
   que puede quedar desactualizada.
   No adjunta el archivo: ningún navegador permite que una página adjunte algo al correo, es
   una restricción de seguridad. Para eso está compartirCotizacion(). */
function correoCotizacion(id,via){
  const c=DB[ARCH.cot].data.cotizaciones.find(x=>x.id===id); if(!c)return;
  const v=(DB[ARCH.conf].data.vendedor)||{};
  const saludo=c.contacto_nombre?`Estimado(a) ${c.contacto_nombre}:`:'Estimados:';
  const cuerpo=[saludo,'',
    `Junto con saludar, adjuntamos la cotización N° ${c.folio} del ${fFecha(c.fecha)} para su revisión.`,
    '','Quedamos atentos a sus comentarios.','','Saludos cordiales,','',
    v.nombre||'Comercializadora Novetec','NOVETEC SPA',v.email||'novetec@novetec.cl'].join('\n');
  const asunto=`Cotización N° ${c.folio} - Novetec SPA`;
  const para=c.contacto_email||'';
  if(via==='web'){
    // Outlook en el navegador: no pasa por el programa instalado, así que da igual cuántos
    // Outlook tenga el equipo. Es la salida cuando el sistema abre el que no corresponde.
    window.open(`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(para)}`
      +`&subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`,'_blank');
    toast('Se abrió Outlook en el navegador. Adjunta el PDF antes de enviar.');
    return;
  }
  if(via==='copiar'){
    navigator.clipboard.writeText(`Para: ${para}\nAsunto: ${asunto}\n\n${cuerpo}`)
      .then(()=>toast('Texto copiado: pégalo en el correo que quieras.'))
      .catch(()=>toast('No se pudo copiar. Selecciona el texto a mano.'));
    return;
  }
  /* mailto abre el programa que Windows tenga como predeterminado para correo. La página no
     puede elegir cuál: es una decisión del sistema, no del navegador. Si abre el Outlook
     equivocado, se arregla en Windows (Configuración → Aplicaciones predeterminadas → Correo)
     o se usa el botón de Outlook web, que no toca el programa instalado. */
  location.href=`mailto:${encodeURIComponent(para)}?subject=${encodeURIComponent(asunto)}`
    +`&body=${encodeURIComponent(cuerpo)}`;
  toast('Se abrió el correo. Recuerda adjuntar el PDF antes de enviar.');
}
/* Vía alternativa que SÍ puede llevar el archivo: el menú de compartir del sistema. En
   Windows con Edge o Chrome incluye las apps de correo. No está en todos los equipos, por
   eso el botón solo aparece cuando el navegador declara que puede compartir archivos. */
const puedeCompartirPDF=()=>{
  try{return !!(navigator.canShare&&navigator.canShare({files:[new File([new Blob([1])],'x.pdf',{type:'application/pdf'})]}))}
  catch(e){return false}
};
async function compartirCotizacion(id){
  const c=DB[ARCH.cot].data.cotizaciones.find(x=>x.id===id); if(!c||!c.archivo)return;
  velo(true,'Preparando el archivo…');
  try{
    const buf=await bajarBinarioRepo(c.archivo);
    const f=new File([buf],`COT_${c.folio}.pdf`,{type:'application/pdf'});
    velo(false);
    await navigator.share({files:[f],title:`Cotización N° ${c.folio}`,
      text:`Cotización N° ${c.folio} del ${fFecha(c.fecha)} - Novetec SPA`});
  }catch(e){
    velo(false);
    if(e&&e.name==='AbortError')return;                 // el usuario cerró el menú
    toast('No se pudo compartir: '+(e.message||e.name)+'. Usa el botón de correo y adjunta el PDF.');
  }
}

/* ══════ BODEGAS: una sola fuente ══════
   Todo sale de data/bodegas.json. Antes la lista estaba repetida en cuatro constantes del
   código y agregar una bodega obligaba a tocarlas todas — se olvidaba una y el sistema
   quedaba a medias. Ahora agregar una bodega es editar SOLO ese archivo.
   Se calcula una vez por carga y se recalcula cuando el archivo cambia. */
let _bodCache=null,_bodRef=null;
function bodegas(){
  const d=(DB[ARCH.bod]&&DB[ARCH.bod].data)||null;
  const lista=d?[...(d.bodegas||[]),...(d.excepcionales||[])]:[];
  if(_bodRef!==lista)_bodCache=null,_bodRef=lista;
  if(_bodCache)return _bodCache;
  _bodCache=lista.slice().sort((a,b)=>(+a.orden||99)-(+b.orden||99)).map(b=>({
    nombre:b.nombre, orden:+b.orden||99,
    centros:(b.centros||[]).map(c=>String(c).trim().toUpperCase()),
    claves:(b.claves||[]).concat(b.nombre).map(t=>sinTilde(t)),
    titulo:b.titulo_documento||('BODEGA '+String(b.nombre||'').toUpperCase()),
    despacho:b.nombre_despacho||b.titulo_documento||String(b.nombre||'').toUpperCase(),
    excepcional:!!b.excepcional}));
  return _bodCache;
}
const sinTilde=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
/* Orden de prioridad en tablas y documentos. Es una función, no una constante:
   depende de datos que se cargan después de que el script se evalúa. */
function bodegasOrden(){return bodegas().map(b=>b.nombre)}
function bodegasExcepcion(){return bodegas().filter(b=>b.excepcional).map(b=>b.nombre)}
function bodegaDeCentro(c){
  const k=String(c||'').trim().toUpperCase();
  const b=bodegas().find(x=>x.centros.includes(k));
  return b?b.nombre:null;
}
function bodegaTitulo(nombre){
  const b=bodegas().find(x=>x.nombre===nombre);
  return b?b.titulo:('BODEGA '+String(nombre||'').toUpperCase());
}
/* Cómo se nombra la bodega en la línea de despacho de una cotización. No sirve el título de
   la hoja de ruta: ahí va "BODEGA LONGOVILO - LONGOVILO" y en la frase quedaría repetido. */
function bodegaDespacho(nombre){
  const b=bodegas().find(x=>x.nombre===nombre);
  return b?b.despacho:String(nombre||'').toUpperCase();
}
/* Normaliza cómo viene escrito un destino en un documento. Gana la PRIMERA bodega cuya
   clave aparezca en el texto, por eso el orden del archivo importa. Sin tildes a ambos
   lados: los documentos vienen con y sin ñ. */
function normBodega(b){
  const s=String(b||'').trim();if(!s)return 'Sin destino';
  const x=sinTilde(s);
  const hit=bodegas().find(bo=>bo.claves.some(k=>k&&x.includes(k)));
  return hit?hit.nombre:s;
}

function medidaPendiente(codigo){
  if(!codigo)return false;
  const p=DB[ARCH.prod].data.productos.find(x=>x.codigo===codigo);
  return !!(p&&p.medida_pendiente);
}
function codigoDeItem(nombre,codigo){
  if(codigo)return codigo;
  const m=prodMaestro(nombre);return m?m.codigo:null;
}
function stockDeCodigo(codigo,nombre){
  let p=codigo?DB[ARCH.inv].data.productos.find(x=>x.codigo===codigo):null;
  if(!p&&nombre)p=invProdDe(nombre,null,false);
  return p?(+p.cantidad||0):0;
}
/* Guías despachadas contra un folio DESPUÉS de la foto del reporte SAP (Jefe, 20-08-2026).
   El `por_entregar` del reporte ya viene descontado de todo lo que entregamos hasta la fecha en
   que se descargó, así que restar nuestras guías otra vez sería contar doble. Solo hay que
   descontar las guías cargadas después de esa fecha, hasta que llegue un reporte nuevo.
   El emparejamiento va por código Y por nombre: el reporte del cliente y nuestra guía pueden
   traer el mismo producto con nombres distintos (y, si el maestro tiene un duplicado, hasta con
   códigos distintos). Devuelve folio -> [{codigo, prod, cant}] para ir descontando. */
function despachadoTrasReporte(){
  const meta=(DB[ARCH.psap]&&DB[ARCH.psap].data)||{};
  const corte=meta.actualizado;
  const m={};
  if(!corte)return m;
  for(const g of DB[ARCH.guias].data.guias){
    if(!(g.fecha>corte))continue;
    const folio=String(g.oc||g.folio_oc||'');
    if(!folio)continue;
    for(const it of (g.items||[])){
      (m[folio]=m[folio]||[]).push({codigo:it.codigo||null,prod:normProd(it.producto||''),
        cant:+it.cantidad||0});
    }
  }
  return m;
}
/* Consume del mapa lo que corresponda a un registro SAP, sin pasarse de su saldo. */
function tomarDespachoPost(post,folio,cod,producto,tope){
  const arr=post[folio];
  if(!arr||tope<=0)return 0;
  const np=normProd(producto||'');
  let usa=0;
  for(const e of arr){
    if(usa>=tope)break;
    if(!((cod&&e.codigo===cod)||(e.prod&&e.prod===np)))continue;
    const t=Math.min(e.cant,tope-usa);
    e.cant-=t;usa+=t;
  }
  return usa;
}
/* Líneas CONFIRMADAS: ítems de OC activas + registros Pendientes SAP.
   Si el doc_compras de un registro SAP ya existe como OC cargada, manda la OC (se omite el registro). */
function lineasConfirmadas(){
  const ocs=DB[ARCH.oc].data.ordenes;
  const folios=new Set(ocs.map(o=>String(o.folio)));
  const lineas=[];
  ocs.filter(o=>ocEstado(o)!=='despachada').forEach(o=>{const s=semaforo(o);
    o.items.forEach(i=>{
      const total=+i.cantidad||0;
      const pendiente=Math.max(total-(+i.cantidad_despachada||0),0);
      const porComprar=Math.max(total-(+i.cantidad_comprada||0),0);
      if(pendiente<=0&&porComprar<=0)return;
      lineas.push({origen:'oc',ref:i,oc:String(o.folio),cot:o.cotizacion_sap||'',producto:i.producto,
        codigo:codigoDeItem(i.producto,i.codigo),cantidad:total,pendiente,porComprar,
        bodega:normBodega(o.destino),precio:+i.precio_unitario||0,sem:s});
    });
  });
  const psap=((DB[ARCH.psap]&&DB[ARCH.psap].data.registros)||[]).filter(r=>!folios.has(String(r.doc_compras||'')));
  const post=despachadoTrasReporte();
  psap.forEach(r=>{
    const total=+r.cantidad||0;
    const folio=String(r.doc_compras||'');
    const cod=r.codigo||codigoDeItem(r.producto,null);
    /* Lo que el cliente ya nos recibió en esta línea. Es compra hecha: si salió por una guía,
       se compró. Sin esto el Panel pedía comprar el total del documento aunque estuviera casi
       entregado (detergente: pedía 3640 cuando faltaban 1806). */
    const entregado=Math.max(total-(+r.por_entregar||0),0);
    const usa=tomarDespachoPost(post,folio,cod,r.producto,+r.por_entregar||0);
    const pendiente=Math.max((+r.por_entregar||0)-usa,0);
    const comprado=Math.max(+r.cantidad_comprada||0,entregado+usa);
    const porComprar=Math.max(total-comprado,0);
    if(pendiente<=0&&porComprar<=0)return;
    lineas.push({origen:'sap',ref:r,oc:folio,cot:'',producto:r.producto,
      codigo:cod,cantidad:total,pendiente,porComprar,entregado:entregado+usa,
      bodega:normBodega(r.bodega||bodegaDeCentro(r.centro)||''),precio:+r.precio_neto||0,sem:{c:'gris',txt:'SAP'}});
  });
  return lineas;
}
/* Las lineas siguen trayendo `sem` (urgencia) y `cot` (cotizacion) aunque el Panel ya no
   muestre esas columnas (orden de Jefe, 22-07-2026): quedan listas por si se reactivan.
   El semaforo de fechas se sigue viendo en la pestana Ordenes de compra. */
/* Consolidado por producto (un código NOV = una fila, stock GLOBAL) */
function consolidadoConfirmado(lineas){
  const map={};
  lineas.forEach(l=>{
    const k=l.codigo||('N:'+normProd(l.producto));
    const c=map[k]=map[k]||{k,codigo:l.codigo,producto:l.producto,cantidad:0,pendiente:0,porComprar:0,comprada:0,bodegas:new Set(),lineas:[]};
    if(l.codigo&&!c.codigo)c.codigo=l.codigo;
    c.cantidad+=l.cantidad;c.pendiente+=l.pendiente;c.porComprar+=l.porComprar;
    // `comprada` alimenta el color de la fila en el resumen. Se acota a lo pedido en la línea
    // porque una compra sobre lo pedido (sobrestock) no pertenece a la OC.
    c.comprada+=Math.min(+l.ref.cantidad_comprada||0,l.cantidad);
    c.bodegas.add(l.bodega);c.lineas.push(l);
  });
  return Object.values(map)
    .map(c=>({...c,stock:stockDeCodigo(c.codigo,c.producto)}))
    .sort((a,b)=>a.producto.localeCompare(b.producto,'es'));
}
let panelSort={campo:'producto',dir:1};
function sortPanel(campo){if(panelSort.campo===campo)panelSort.dir*=-1;else panelSort={campo,dir:1};render()}
/* SEMÁFORO SUPERIOR DEL PANEL — DESACTIVADO por orden de Jefe (22-07-2026).
   El código se conserva completo aquí. Para REACTIVARLO basta con agregar `${semStripHTML()}`
   al inicio del template que retorna rPanel(). */

  const act=DB[ARCH.oc].data.ordenes.filter(o=>ocEstado(o)!=='despachada');

  <div class="sem-strip">
    <div class="sem-box vencida"><div class="n">${g.vencida.length}</div><div class="l">Vencidas</div></div>
    <div class="sem-box rojo"><div class="n">${g.rojo.length}</div><div class="l">≤ ${DB[ARCH.conf].data.semaforo.rojo_dias} días</div></div>
    <div class="sem-box ambar"><div class="n">${g.ambar.length}</div><div class="l">≤ ${DB[ARCH.conf].data.semaforo.amarillo_dias} días</div></div>
    <div class="sem-box verde"><div class="n">${g.verde.length}</div><div class="l">Con holgura</div></div>
  </div>`;
}
function rPanel(){
  const lineas=lineasConfirmadas();
  const consTodo=consolidadoConfirmado(lineas);
  const psapMeta=(DB[ARCH.psap]&&DB[ARCH.psap].data)||{};
  // Ocultos del resumen: solo se respetan mientras no haya nada por comprar. Si vuelve a
  // aparecer algo por comprar (una OC nueva), el producto reaparece solo.
  const ocultos=DB[ARCH.conf].data.resumen_ocultos||[];
  const cons=consTodo.filter(c=>!(c.porComprar<=0&&ocultos.includes(c.k)));
  const nOcultos=consTodo.length-cons.length;

  /* ZONA SUPERIOR: resumen consolidado solo de confirmado (OC + Pendientes SAP) */
  const zonaResumen=`
  <h2>Resumen consolidado <span class="muted">· confirmado: OC + Pendientes SAP${psapMeta.actualizado?` (reporte del ${fFecha(psapMeta.actualizado)})`:''}</span></h2>
  ${cons.length?`<div class="card" style="overflow-x:auto"><table class="tprod" style="min-width:540px">
    <colgroup><col><col style="width:8ch"><col style="width:8ch"><col style="width:7ch"><col style="width:14ch"></colgroup>
    <tr><th>Producto</th><th class="num">Total a despachar</th><th class="num">Pendiente</th><th class="num">Stock</th><th class="num">Compra</th></tr>
    ${cons.map(c=>`<tr class="${c.porComprar<=0?'fila-comprada':(c.comprada>0?'fila-comprada-parcial':'')}" title="${c.porComprar<=0?'Comprado':(c.comprada>0?`Comprado en parte: ${num(c.comprada)} de ${num(c.cantidad)}`:'Sin comprar')}">
      <td class="trunc" title="${esc(c.producto)} — ${esc([...c.bodegas].join(', '))}">${medidaPendiente(c.codigo)?'<i class="fa-solid fa-ruler aviso-medida" title="El documento no especifica la medida o la talla: confirmar antes de despachar"></i>':''}${esc(c.producto)}<span class="small muted sep">${esc([...c.bodegas].join(' · '))}</span></td>
      <td class="num">${num(c.cantidad)}</td>
      <td class="num" style="font-weight:600">${num(c.pendiente)}</td>

        :`<button class="btn mini" onclick="ocultarDelResumen('${encodeURIComponent(c.k)}')" title="Comprada · pulsa para quitarla del resumen"><i class="fa-solid fa-check"></i></button>`}${revertible(c)>0?`
        <button class="btn mini sec" onclick="revertirCompra('${encodeURIComponent(c.k)}')" title="Revertir una compra ingresada por error (hasta ${num(revertible(c))})"><i class="fa-solid fa-rotate-left"></i></button>`:''}</td>
    </tr>`).join('')}
  </table></div>`:`<div class="card vacio">${nOcultos?'Todo lo confirmado está comprado y oculto del resumen.':'No hay pendientes confirmados (OC ni Pendientes SAP).'}</div>`}
  ${nOcultos?`<p class="small muted" style="margin:-6px 0 14px">${nOcultos} producto(s) comprados ocultos del resumen · <a href="#" onclick="event.preventDefault();mostrarOcultos()">volver a mostrarlos</a></p>`:''}`;

  /* ZONA INFERIOR: detalle por bodega, orden fijo Rancagua → San Francisco Mostazal → El Peumo → Longovilo.
     Se muestran SIEMPRE Total y Pendiente, aunque no haya stock. */
  const filas=lineas.filter(l=>l.pendiente>0);
  filas.forEach(f=>{f.stock=stockDeCodigo(f.codigo,f.producto)});
  const cS=panelSort.campo,dS=panelSort.dir;
  const urg={vencida:0,rojo:1,ambar:2,verde:3,gris:4};
  const valS=f=>cS==='sem'?urg[f.sem.c]:f[cS];
  filas.sort((a,b)=>{const va=valS(a),vb=valS(b);
    return (typeof va==='string'?va.localeCompare(vb,'es'):va-vb)*dS});
  const grupos={};
  filas.forEach(f=>{(grupos[f.bodega]=grupos[f.bodega]||[]).push(f)});
  const th=(lbl,campo,cls='')=>`<th class="${cls}" style="cursor:pointer;user-select:none" onclick="sortPanel('${campo}')">${lbl}${panelSort.campo===campo?(panelSort.dir>0?' <i class="fa-solid fa-arrow-up-short-wide" style="font-size:11px"></i>':' <i class="fa-solid fa-arrow-down-wide-short" style="font-size:11px"></i>'):''}</th>`;
  const tablaGrupo=(dest,fs)=>`
    <h2><i class="fa-solid fa-warehouse" style="font-size:15px;color:var(--muted)"></i> ${esc(dest)} <span class="muted">· ${fs.length} ítem(s) pendiente(s)</span></h2>
    <div class="card" style="overflow-x:auto"><table class="tprod" style="min-width:600px">
      <colgroup><col style="width:12.5ch"><col><col style="width:7ch"><col style="width:8ch"><col style="width:7ch"><col style="width:9ch"></colgroup>
      <tr>${th('OC','oc')}${th('Producto','producto')}${th('Total','cantidad','num')}${th('Pendiente','pendiente','num')}${th('Stock','stock','num')}${th('Precio','precio','num')}</tr>
      ${fs.map(f=>`<tr>
        <td class="mono trunc" title="${esc(f.oc)}${f.origen==='sap'?' (Pendientes SAP)':''}">${esc(f.oc)||'—'}${f.origen==='sap'?' <span class="chip">SAP</span>':''}</td>
        <td class="trunc" title="${esc(f.producto)}">${medidaPendiente(f.codigo)?'<i class="fa-solid fa-ruler aviso-medida" title="El documento no especifica la medida o la talla: confirmar antes de despachar"></i>':''}${esc(f.producto)}</td>
        <td class="num">${num(f.cantidad)}</td>
        <td class="num" style="font-weight:600">${num(f.pendiente)}</td>
        <td class="num" style="${f.stock<f.pendiente?'color:var(--rojo);font-weight:600':''}">${num(f.stock)}</td>
        <td class="num">${clp(f.precio)}</td>
      </tr>`).join('')}
    </table></div>`;
  const destOrden=bodegasOrden().filter(b=>grupos[b])
    .concat(Object.keys(grupos).filter(b=>!bodegasOrden().includes(b)).sort((a,b)=>a.localeCompare(b,'es')));
  return `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <button class="btn mini sec" onclick="alternarNombres(this)"><i class="fa-solid fa-arrows-up-down-left-right"></i> Desplegar nombres</button>
  </div>
  ${zonaResumen}
  ${DB[ARCH.pend].data.pendientes.length?`<div class="card" style="border-color:var(--ambar)"><i class="fa-solid fa-file-lines"></i> <b>${DB[ARCH.pend].data.pendientes.length}</b> documento(s) en cola esperando ser procesados por el administrador.</div>`:''}
  ${destOrden.length?destOrden.map(dst=>tablaGrupo(dst,grupos[dst])).join(''):'<div class="card vacio">No hay ítems pendientes de despacho.</div>'}`;
}
/* Fichas plegables de documento: se recuerda cuáles quedaron abiertas para que un render
   (tras guardar una compra, editar, etc.) no las vuelva a cerrar todas. */
const fichasAbiertas=new Set();
function fichaAbierta(k){return fichasAbiertas.has(k)}
function recordarFicha(el){
  const k=el.dataset.k;if(!k)return;
  el.open?fichasAbiertas.add(k):fichasAbiertas.delete(k);
}
function alternarFichas(btn){
  const ds=[...document.querySelectorAll('#vista details.doc, #vista details.acc-fecha, #vista details.acc-mes, #vista details.acc-anio')];
  if(!ds.length)return;
  const abrir=ds.some(d=>!d.open);
  ds.forEach(d=>{d.open=abrir;recordarFicha(d)});
  btn.innerHTML=abrir?'<i class="fa-solid fa-chevron-up"></i> Contraer todas'
                     :'<i class="fa-solid fa-chevron-down"></i> Desplegar todas';
}
function barraFichas(){
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
    <button class="btn mini sec" onclick="alternarFichas(this)"><i class="fa-solid fa-chevron-down"></i> Desplegar todas</button>
    <button class="btn mini sec" onclick="alternarNombres(this)"><i class="fa-solid fa-arrows-up-down-left-right"></i> Desplegar nombres</button>
  </div>`;
}
/* Despliega o contrae de una vez todos los nombres cortados de la vista (util en celular) */
function alternarNombres(btn){
  const celdas=[...document.querySelectorAll('#vista td.trunc')];
  const abrir=celdas.some(c=>!c.classList.contains('abierto'));
  celdas.forEach(c=>c.classList.toggle('abierto',abrir));
  btn.innerHTML=abrir?'<i class="fa-solid fa-compress"></i> Contraer nombres'
                     :'<i class="fa-solid fa-arrows-up-down-left-right"></i> Desplegar nombres';
}

/* ===== Ingreso de cantidades =====
   Ventana propia de la app. Sustituye a prompt() del navegador, que no valida mientras se
   escribe, no respeta el tema, puede abrir teclado alfabético en el teléfono, solo admite un
   campo y el navegador permite bloquearlo (Jefe, 22-07-2026).
   Devuelve {valor, extra} o null si se cancela. */
function pedirMonto(o){
  return new Promise(res=>{
    const min=o.min??0, max=(o.max===undefined||o.max===null)?Infinity:o.max;
    const ov=document.createElement('div');ov.className='modal-ov';
    ov.innerHTML=`<div class="modal">
      <b>${esc(o.titulo)}</b>
      ${o.producto?`<p class="small muted" style="margin-top:4px">${esc(o.producto)}</p>`:''}
      ${(o.contexto||[]).length?`<div class="monto-ctx">${o.contexto.map(c=>`<div><div class="et">${esc(c.et)}</div><div class="va">${esc(String(c.va))}</div></div>`).join('')}</div>`:''}
      <label style="margin-top:12px">${esc(o.etiqueta||'Cantidad')}</label>
      <div class="monto-campo">
        <input id="mo-val" type="text" inputmode="decimal" autocomplete="off" value="${o.valor??''}">
        ${o.unidad?`<span class="uni">${esc(o.unidad)}</span>`:''}
        ${isFinite(max)?`<button class="btn mini sec" type="button" id="mo-max" title="Usar el máximo">Todo</button>`:''}
      </div>
      <div class="monto-aviso bien" id="mo-aviso"></div>
      ${o.extra?`<label>${esc(o.extra.etiqueta)}</label>
        <input id="mo-extra" placeholder="${esc(o.extra.placeholder||'')}" value="${esc(o.extra.valor||'')}">`:''}
      <div class="acciones">
        <button class="btn mini" id="mo-ok">${esc(o.confirmar||'Confirmar')}</button>
        <button class="btn mini sec" id="mo-cancel">Cancelar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('#mo-val'), aviso=ov.querySelector('#mo-aviso'), ok=ov.querySelector('#mo-ok');
    const leer=()=>{const t=inp.value.trim().replace(',','.');return t===''?NaN:Number(t)};
    const revisar=()=>{
      const v=leer();
      let mal='';
      if(isNaN(v))mal='Escribe una cantidad.';
      else if(v<min)mal=`No puede ser menor que ${num(min)}.`;
      else if(v>max)mal=`El máximo es ${num(max)}.`;
      aviso.className='monto-aviso '+(mal?'mal':'bien');
      aviso.textContent=mal||(o.resultado&&!isNaN(v)?o.resultado(v):'');
      ok.disabled=!!mal;ok.style.opacity=mal?.45:1;ok.style.cursor=mal?'not-allowed':'pointer';
      return !mal;
    };
    inp.addEventListener('input',revisar);
    const cerrar=r=>{document.removeEventListener('keydown',tecla);ov.remove();res(r)};
    const aceptar=()=>{if(revisar())cerrar({valor:leer(),extra:(ov.querySelector('#mo-extra')||{}).value?.trim()||''})};
    const tecla=e=>{if(e.key==='Escape')cerrar(null);else if(e.key==='Enter'&&document.activeElement!==ov.querySelector('#mo-cancel'))aceptar()};
    document.addEventListener('keydown',tecla);
    ok.onclick=aceptar;
    ov.querySelector('#mo-cancel').onclick=()=>cerrar(null);
    ov.onclick=e=>{if(e.target===ov)cerrar(null)};
    const bmax=ov.querySelector('#mo-max');
    if(bmax)bmax.onclick=()=>{inp.value=max;revisar();inp.focus()};
    revisar();
    setTimeout(()=>{inp.focus();inp.select()},30);
  });
}

/* Confirmación propia de la app. Sustituye a confirm() del navegador, que no se puede
   estilar, corta el hilo y en móvil aparece descolgado del resto de la interfaz.
   `texto` admite saltos de línea; el primer párrafo va destacado y el resto en gris. */
function confirmar(o){
  if(typeof o==='string')o={texto:o};
  const partes=String(o.texto||'').split('\n').map(t=>t.trim()).filter(Boolean);
  const primera=partes.shift()||'';
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='modal-ov';
    ov.innerHTML=`<div class="modal">
      <b>${esc(o.titulo||primera)}</b>
      ${o.titulo?`<p style="margin-top:8px">${esc(primera)}</p>`:''}
      ${partes.map(t=>`<p class="small muted" style="margin-top:8px">${esc(t)}</p>`).join('')}
      <div class="acciones">
        <button class="btn${o.peligro?' peligro':''}" id="cf-ok">${esc(o.confirmar||'Aceptar')}</button>
        <button class="btn sec" id="cf-no">${esc(o.cancelar||'Cancelar')}</button>
      </div></div>`;
    document.body.appendChild(ov);
    const cerrar=r=>{document.removeEventListener('keydown',tecla);ov.remove();res(r)};
    const tecla=e=>{if(e.key==='Escape')cerrar(false)};
    document.addEventListener('keydown',tecla);
    ov.querySelector('#cf-ok').onclick=()=>cerrar(true);
    ov.querySelector('#cf-no').onclick=()=>cerrar(false);
    ov.onclick=e=>{if(e.target===ov)cerrar(false)};
    setTimeout(()=>ov.querySelector('#cf-no').focus(),30);
  });
}

/* Modal de texto con validación en vivo, hermano de pedirMonto(). Mismas reglas: nada de
   prompt() ni confirm(). `validar` recibe el texto y devuelve un mensaje de error o ''. */
function pedirTexto(o){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='modal-ov';
    ov.innerHTML=`<div class="modal">
      <b>${esc(o.titulo)}</b>
      ${o.producto?`<p class="small muted" style="margin-top:4px">${esc(o.producto)}</p>`:''}
      ${(o.contexto||[]).length?`<div class="monto-ctx">${o.contexto.map(c=>`<div><div class="et">${esc(c.et)}</div><div class="va">${esc(String(c.va))}</div></div>`).join('')}</div>`:''}
      <label style="margin-top:12px">${esc(o.etiqueta||'Texto')}</label>
      <div class="monto-campo"><input id="tx-val" type="text" autocomplete="off" value="${esc(o.valor||'')}"></div>
      <div class="monto-aviso bien" id="tx-aviso"></div>
      <div class="acciones">
        <button class="btn mini" id="tx-ok">${esc(o.confirmar||'Guardar')}</button>
        <button class="btn mini sec" id="tx-cancel">Cancelar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('#tx-val'), aviso=ov.querySelector('#tx-aviso'), ok=ov.querySelector('#tx-ok');
    const revisar=()=>{
      const t=inp.value.trim();
      const mal=o.validar?o.validar(t):(t?'':'Escribe un nombre.');
      aviso.className='monto-aviso '+(mal?'mal':'bien');
      aviso.textContent=mal||(o.resultado?o.resultado(t):'');
      ok.disabled=!!mal;ok.style.opacity=mal?.45:1;ok.style.cursor=mal?'not-allowed':'pointer';
      return !mal;
    };
    inp.addEventListener('input',revisar);
    const cerrar=r=>{document.removeEventListener('keydown',tecla);ov.remove();res(r)};
    const aceptar=()=>{if(revisar())cerrar(inp.value.trim())};
    const tecla=e=>{if(e.key==='Escape')cerrar(null);else if(e.key==='Enter'&&document.activeElement!==ov.querySelector('#tx-cancel'))aceptar()};
    document.addEventListener('keydown',tecla);
    ok.onclick=aceptar;
    ov.querySelector('#tx-cancel').onclick=()=>cerrar(null);
    ov.onclick=e=>{if(e.target===ov)cerrar(null)};
    revisar();
    setTimeout(()=>{inp.focus();inp.select()},30);
  });
}

/* Renombrar un producto del MAESTRO (Jefe, 30-07-2026). Disponible desde Lista de precios y
   desde Inventario; el cambio es el mismo en ambas porque toca el maestro.
   - El nombre anterior se guarda como alias, para que el sistema siga reconociendo documentos
     que lleguen con la redacción vieja (línea relacional).
   - Se actualiza también el nombre en inventario.json, que guarda su propia copia.
   - NO se tocan los nombres a nivel de línea de cotizaciones/OC ni el historial de movimientos:
     ésos son el registro de lo que decía cada documento en su momento. */
async function renombrarProducto(codigo){
  const prods=DB[ARCH.prod].data.productos;
  const p=prods.find(x=>x.codigo===codigo);
  if(!p){toast('No encuentro ese producto en el maestro.');return}
  const nuevo=await pedirTexto({
    titulo:'Editar nombre del producto',
    producto:p.codigo,
    contexto:[{et:'Nombre actual',va:p.nombre}],
    etiqueta:'Nombre nuevo',
    valor:p.nombre,
    validar:t=>{
      if(!t)return 'El nombre no puede quedar vacío.';
      if(prods.some(x=>x.codigo!==codigo&&x.nombre.toLowerCase()===t.toLowerCase()))
        return 'Ya existe otro producto del maestro con ese nombre.';
      return '';
    },
    resultado:t=>t.toLowerCase()===p.nombre.toLowerCase()?'':'El nombre anterior quedará como alias.'
  });
  if(nuevo===null||nuevo===p.nombre)return;
  const anterior=p.nombre;
  velo(true,'Guardando nombre…');
  try{
    p.alias=p.alias||[];
    if(!p.alias.some(a=>a.toLowerCase()===anterior.toLowerCase()))p.alias.push(anterior);
    p.nombre=nuevo;
    await guardarArchivo(ARCH.prod,`Producto ${codigo} renombrado: "${anterior}" → "${nuevo}"`);
    const inv=DB[ARCH.inv].data;
    const ip=(inv.productos||[]).find(x=>x.codigo===codigo);
    if(ip&&ip.nombre!==nuevo){
      ip.nombre=nuevo;
      await guardarArchivo(ARCH.inv,`Inventario: nombre de ${codigo} actualizado a "${nuevo}"`);
    }
    toast('Nombre actualizado');render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* Revertir una compra ingresada por error. Solo es revertible lo COMPRADO QUE AÚN NO SE HA
   DESPACHADO: lo que ya salió en una guía se compró de verdad, y descontarlo dejaría el stock
   en negativo por partida doble. El movimiento original nunca se borra; se agrega un ajuste. */
function revertible(c){
  return c.lineas.reduce((s,l)=>{
    const comp=+l.ref.cantidad_comprada||0;
    const desp=l.origen==='oc'?(+l.ref.cantidad_despachada||0)
                              :Math.max((+l.ref.cantidad||0)-(+l.ref.por_entregar||0),0);
    return s+Math.max(comp-desp,0);
  },0);
}
async function revertirCompra(ke){
  const k=decodeURIComponent(ke);
  const c=consolidadoConfirmado(lineasConfirmadas()).find(x=>x.k===k);
  if(!c)return;
  const max=revertible(c);
  if(max<=0){toast('No hay compras revertibles: lo comprado ya fue despachado.');return}
  const stock=stockDeCodigo(c.codigo,c.producto);
  const r=await pedirMonto({
    titulo:'Revertir compra ingresada por error',producto:c.producto,
    contexto:[{et:'Revertible',va:num(max)},{et:'Stock actual',va:num(stock)}],
    etiqueta:'Unidades a revertir',valor:max,min:1,max,confirmar:'Revertir compra',
    resultado:v=>`Volverán a quedar por comprar ${num(v)} · el stock quedará en ${num(Math.max(0,stock-v))}.`
  });
  if(!r)return;
  const cant=r.valor;
  velo(true,'Revirtiendo compra…');
  try{
    // repartir el reverso entre las líneas, hasta agotarlo
    let resta=cant;
    const tocado={oc:false,sap:false};
    for(const l of c.lineas){
      if(resta<=0)break;
      const comp=+l.ref.cantidad_comprada||0;
      const desp=l.origen==='oc'?(+l.ref.cantidad_despachada||0)
                                :Math.max((+l.ref.cantidad||0)-(+l.ref.por_entregar||0),0);
      const puede=Math.min(Math.max(comp-desp,0),resta);
      if(puede<=0)continue;
      l.ref.cantidad_comprada=comp-puede;
      resta-=puede;
      tocado[l.origen]=true;
    }
    const inv=DB[ARCH.inv].data;
    const p=c.codigo?inv.productos.find(x=>x.codigo===c.codigo):invProdDe(c.producto,null,false);
    if(p){
      p.cantidad=Math.max(0,(+p.cantidad||0)-cant);
      inv.movimientos.push({fecha:hoyISO(),tipo:'ajuste',codigo:p.codigo,producto:p.nombre,
        cantidad:-cant,referencia:`Reverso de compra marcada (ingreso erróneo)`});
    }
    // si estaba oculto del resumen, vuelve a la vista porque otra vez hay algo que comprar
    const conf=DB[ARCH.conf].data;
    if((conf.resumen_ocultos||[]).includes(k)){
      conf.resumen_ocultos=conf.resumen_ocultos.filter(x=>x!==k);
      await guardarArchivo(ARCH.conf,`Resumen: ${c.producto} vuelve a la vista`);
    }
    if(tocado.oc)await guardarArchivo(ARCH.oc,`Reverso de compra: ${c.producto} -${cant}`);
    if(tocado.sap)await guardarArchivo(ARCH.psap,`Reverso de compra: ${c.producto} -${cant}`);
    if(p)await guardarArchivo(ARCH.inv,`Inventario: reverso de compra ${c.producto} -${cant}`);
    toast(`Compra revertida: ${c.producto} -${num(cant)}`);render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* Ocultar del resumen consolidado: el resumen es la vista de COMPRAS, así que un producto ya
   comprado puede salir de ahí para ir limpiando la pantalla. Solo se puede ocultar lo que tiene
   0 por comprar, y si más adelante vuelve a haber algo que comprar, reaparece solo. */
async function ocultarDelResumen(ke){
  const k=decodeURIComponent(ke);
  const c=consolidadoConfirmado(lineasConfirmadas()).find(x=>x.k===k);
  if(!c)return;
  if(c.porComprar>0){toast('Todavía hay unidades por comprar: no se puede ocultar.');return}
  const conf=DB[ARCH.conf].data;
  conf.resumen_ocultos=conf.resumen_ocultos||[];
  if(conf.resumen_ocultos.includes(k)){render();return}
  conf.resumen_ocultos.push(k);
  velo(true);
  try{await guardarArchivo(ARCH.conf,`Resumen: oculto ${c.producto}`);
    toast(`${c.producto} fuera del resumen`);render()}
  catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
async function mostrarOcultos(){
  const conf=DB[ARCH.conf].data;
  if(!(conf.resumen_ocultos||[]).length)return;
  conf.resumen_ocultos=[];
  velo(true);
  try{await guardarArchivo(ARCH.conf,'Resumen: se vuelven a mostrar los productos ocultos');
    toast('Resumen completo');render()}
  catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* ===== Marcado de compras desde el Panel =====
   Al marcar: ingreso a inventario por el TOTAL pendiente de compra del producto
   (un código NOV, un stock global). Varias bodegas de destino → modal de reparto;
   una sola → asignación directa sin preguntar. */
function consPorClave(k){
  return consolidadoConfirmado(lineasConfirmadas()).find(c=>c.k===k);
}
async function marcarCompra(ke){
  const k=decodeURIComponent(ke);
  const c=consPorClave(k);
  if(!c||c.porComprar<=0){toast('No hay compra pendiente para este producto.');return}
  const porBod={};

function modalCompra(c,porBod){

                            :`Entran ${num(s)} al inventario · queda todo comprado`;
      el.style.color=queda>0?'var(--ambar)':'var(--verde)';
    };

async function aplicarCompra(c,reparto){
  velo(true,'Marcando compra…');
  try{
    const fecha=hoyISO();
    let tocaOC=false,tocaPsap=false,total=0;
    // Lo comprado se imputa dentro de cada bodega, línea por línea, empezando por la OC más
    // antigua. Lo que no alcanza a cubrirse queda pendiente y vuelve a aparecer en el Panel.
    Object.entries(reparto).forEach(([bod,cant])=>{
      let queda=+cant||0;
      c.lineas.filter(l=>l.bodega===bod&&l.porComprar>0)
        .sort((a,b)=>String(a.oc).localeCompare(String(b.oc),'es',{numeric:true}))
        .forEach(l=>{
          if(queda<=0)return;
          const usa=Math.min(queda,l.porComprar);
          l.ref.cantidad_comprada=(+l.ref.cantidad_comprada||0)+usa;
          queda-=usa;total+=usa;
          if(l.origen==='oc')tocaOC=true;else tocaPsap=true;
        });
    });
    // Se puede comprar MÁS de lo pedido para aprovechar un buen precio: lo que excede el
    // pendiente NO se imputa a la OC (el cliente no lo pidió) y entra como stock libre.
    const ingresado=Object.values(reparto).reduce((a,q)=>a+(+q||0),0);
    const sobrante=Math.max(ingresado-total,0);
    if(ingresado<=0){velo(false);toast('No se registró ninguna cantidad.');return}
    // Ingreso al inventario por TODO lo comprado (un código, stock global)
    const inv=DB[ARCH.inv].data;
    let m=c.codigo?DB[ARCH.prod].data.productos.find(p=>p.codigo===c.codigo):prodMaestro(c.producto);
    if(!m)m=crearProdMaestro(c.producto,'UN');
    let p=inv.productos.find(x=>x.codigo===m.codigo);
    if(!p){p={codigo:m.codigo,nombre:m.nombre,cantidad:0,unidad:m.unidad};inv.productos.push(p)}
    p.cantidad+=ingresado;
    const repTxt=Object.entries(reparto).map(([b,q])=>`${b} ${num(q)}`).join(', ');
    if(total>0)inv.movimientos.push({fecha,tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:total,referencia:`Compra marcada (Panel)${repTxt?' · reparto: '+repTxt:''}`});
    if(sobrante>0)inv.movimientos.push({fecha,tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:sobrante,referencia:'Sobrestock (compra sobre lo pedido)'});
    await guardarMaestroSiNuevo();
    if(tocaOC)await guardarArchivo(ARCH.oc,`Compra marcada: ${m.nombre}`);
    if(tocaPsap)await guardarArchivo(ARCH.psap,`Compra marcada (Pendientes SAP): ${m.nombre}`);
    await guardarArchivo(ARCH.inv,`Inventario: ingreso por compra marcada (${m.nombre} +${ingresado})`);
    const resta=c.porComprar-total;
    toast(`Compra registrada: ${m.nombre} +${num(ingresado)} al inventario`
      +(sobrante>0?` · ${num(sobrante)} como stock libre`:'')
      +(resta>0?` · quedan ${num(resta)} pendientes`:''));
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* ================= Lectura automática de OC de SAP en PDF (etapa 1) =================
   pdf.js vive en lib/ dentro de este mismo repo. Se carga solo cuando se usa.
   NADA se guarda sin que Jefe lo confirme en pantalla. */
let ocLeida=null;
async function cargarPdfJs(){
  if(window._pdfjs)return window._pdfjs;
  const m=await import('./lib/pdf.min.mjs');
  m.GlobalWorkerOptions.workerSrc='./lib/pdf.worker.min.mjs';
  window._pdfjs=m;return m;
}
/* Reconstruye las líneas respetando las distancias horizontales: los PDF de SAP vienen
   en dos columnas y sin esto el texto legal se mezcla con los datos. */
/* Reconstruye las líneas de texto de un PDF a partir de las coordenadas de cada fragmento.
   Las filas se agrupan DENTRO de cada página (Jefe, 20-08-2026). Antes se juntaban todos los
   fragmentos del documento y se agrupaban solo por Y: dos textos a la misma altura en páginas
   distintas caían en la misma línea, intercalados por X. Eso rompía las líneas de producto de
   la segunda página en adelante — en la OC 4500952609 la línea de las pilas salía como
   "60 48 UN Esperamos su confirmación...Cod: 3300002347 PILA D ALCALINA", el regex no la
   reconocía y el total descuadraba en $87.840 sin dejar continuar. También desordenaba la
   lectura, porque el orden global por Y mezcla el pie de una página con el encabezado de otra. */
function lineasDePdf(paginas){
  const items=[].concat(...paginas).filter(i=>i.str.trim());
  if(!items.length)return [];
  const anchos=items.filter(i=>i.str.length>1&&i.w>0).map(i=>i.w/i.str.length).sort((a,b)=>a-b);
  const u=anchos[Math.floor(anchos.length/2)]||5;
  const minX=Math.min(...items.map(i=>i.x));
  const salida=[];
  paginas.forEach(pag=>{
    const its=pag.filter(i=>i.str.trim());
    if(!its.length)return;
    const filas={};
    its.forEach(i=>{const y=Math.round(i.y/3);(filas[y]=filas[y]||[]).push(i)});
    Object.keys(filas).sort((a,b)=>b-a).forEach(y=>{
      let s='';
      filas[y].sort((a,b)=>a.x-b.x).forEach(i=>{
        const col=Math.round((i.x-minX)/u);
        if(col>s.length)s+=' '.repeat(col-s.length);
        s+=i.str;
      });
      salida.push(s.replace(/\s+$/,''));
    });
  });
  return salida.filter(l=>l.trim());
}
const nSap=s=>{const t=String(s).trim().replace(/\./g,'').replace(',','.');return Math.round(parseFloat(t)*100)/100};
/* El destino de una OC se resuelve contra el CATÁLOGO (bodegas.json), no contra una lista
   escrita aquí (Jefe, 20-08-2026). Antes había cuatro bodegas fijas en el código: cuando el
   catálogo creció a siete, el lector siguió sin reconocer Casablanca, Doñihue ni Rosario y
   dejaba la OC entera sin cargar aunque hubiera leído bien todo lo demás. Ahora basta con
   agregar la bodega al catálogo para que el lector la reconozca. */
function bodegaDeTexto(txt){
  const x=sinTilde(txt);
  if(!x)return null;
  const hit=bodegas().find(b=>(b.claves||[]).some(k=>k&&x.includes(sinTilde(k))));
  return hit?hit.nombre:null;
}
function parseOC(lineas){
  const txt=lineas.join('\n');
  const g=(re,i=1)=>{const m=txt.match(re);return m?m[i].trim():null};
  const fe=txt.match(/Fecha\s*:\s*(\d{2})\.(\d{2})\.(\d{4})/);
  const items=[];
  lineas.forEach(l=>{
    const m=l.match(/^\s*(\d{2,3})\s+([\d.,]+)\s+([A-Z]{1,4})\s+Cod:\s*(\d{10})?\s*(.+?)\s{2,}([\d.,]+)\s+([\d.,]+)\s*$/);
    if(m)items.push({pos:+m[1],cantidad:nSap(m[2]),unidad:m[3],codigo_sap:m[4]||null,
                     producto:m[5].trim(),precio:nSap(m[6]),total:nSap(m[7])});
  });
  const mman=txt.match(/(?:ENTREGAR EN|DESPACHAR A)\s+([A-ZÁÉÍÓÚÑ ]{4,})/);
  const crudo=(mman?mman[1]:g(/Lugar de Entrega\s*:\s*(.+?)(?:Direcci|$)/m))||'';
  const bod=bodegaDeTexto(crudo);
  const mt=txt.match(/TOTAL SIN IVA\s*:?\s*([\d.,]+)/);
  return {folio:g(/N[ºo°]\s*:\s*(45009\d{5})/),fecha_emision:fe?`${fe[3]}-${fe[2]}-${fe[1]}`:null,
          cotizacion_sap:g(/Cotización\s*:\s*(\d+)/),emisor:g(/Emisor O\/C\s*:\s*(.+)/),
          destino_texto:crudo.trim(),destino:bod,
          total_documento:mt?nSap(mt[1]):null,items};
}
function validarOC(oc){
  const e=[];
  if(!oc.folio)e.push('No se encontró el número de la orden de compra (formato 45009XXXXX).');
  if(!oc.fecha_emision)e.push('No se encontró la fecha de emisión.');
  if(!oc.destino)e.push(`No se reconoció la bodega de destino${oc.destino_texto?` (el documento dice "${oc.destino_texto}")`:''}.`);
  if(!oc.items.length)e.push('No se encontró ninguna línea de producto.');
  oc.items.forEach(i=>{if(Math.abs(i.cantidad*i.precio-i.total)>0.5)
    e.push(`Línea ${i.pos} (${i.producto}): ${num(i.cantidad)} × ${clp(i.precio)} no da ${clp(i.total)}.`)});
  const suma=oc.items.reduce((a,i)=>a+i.total,0);
  if(oc.total_documento!=null&&Math.abs(suma-oc.total_documento)>0.5)
    e.push(`La suma de las líneas (${clp(suma)}) no coincide con el total del documento (${clp(oc.total_documento)}).`);
  if(oc.folio&&DB[ARCH.oc].data.ordenes.some(o=>String(o.folio)===oc.folio))
    e.push(`La orden de compra ${oc.folio} ya está cargada en el sistema.`);
  return e;
}
function consolidarOC(items){
  const m=new Map();
  items.forEach(i=>{const k=(i.codigo_sap||i.producto)+'|'+i.precio;
    if(m.has(k)){const c=m.get(k);c.cantidad+=i.cantidad;c.total+=i.total;c.fusion++}
    else m.set(k,{...i,fusion:1})});
  return [...m.values()].sort((a,b)=>a.pos-b.pos);
}
/* Un producto NUESTRO puede cargar VARIOS códigos SAP del cliente (Jefe, 04-08-2026): Agrosuper
   abre un material nuevo por cada variante que pide, y al fusionar dos códigos NOV el SAP del
   absorbido debe seguir reconociéndose. Por eso `codigos_cliente.agrosuper` admite texto (un solo
   código, el caso normal) o lista (producto fusionado). Esto NO contradice el caso "papelero":
   ahí un mismo SAP apunta a dos productos distintos; acá un producto reúne varios SAP. */
/* Los códigos SAP se guardan por GRUPO, no por cliente: Agrosuper y Sopraval usan el mismo
   sistema aunque tengan RUT distintos, así que un código significa lo mismo para ambos.
   Se leen todos los grupos porque hoy existe uno solo; si algún día entra un cliente con
   otro maestro de materiales, hay que filtrar por el grupo_sap del documento en curso. */
function sapsDe(p){
  const cc=p.codigos_cliente||{};
  return Object.values(cc).flatMap(v=>v==null?[]:(Array.isArray(v)?v:[v]))
    .map(String).map(x=>x.trim()).filter(Boolean);
}
/* Resolución contra el maestro: lo inequívoco se resuelve solo, lo dudoso queda para Jefe */
function resolverItems(items){
  const prods=DB[ARCH.prod].data.productos;
  const nrm=t=>String(t||'').toUpperCase().replace(/Ñ/g,'N').replace(/[^A-Z0-9]/g,'');
  return items.map(i=>{
    const porSap=i.codigo_sap?prods.filter(p=>sapsDe(p).includes(String(i.codigo_sap))):[];
    // El nombre del absorbido queda como alias del sobreviviente: los alias TIENEN que
    // pesar igual que el nombre, si no la fusión no sirve para reconocer nada a futuro.
    const porNom=prods.filter(p=>nrm(p.nombre)===nrm(i.producto)
      ||(p.alias||[]).some(a=>nrm(a)===nrm(i.producto)));
    let estado='nuevo',codigo=null,opciones=[];
    if(porSap.length&&porNom.length&&porSap.some(p=>porNom.includes(p))){
      estado='existente';codigo=porSap.find(p=>porNom.includes(p)).codigo;
    }else if(porSap.length===1&&!porNom.length){estado='existente';codigo=porSap[0].codigo;
    }else if(porNom.length===1&&!porSap.length){estado='existente';codigo=porNom[0].codigo;
    }else if(porSap.length||porNom.length){
      estado='ambiguo';opciones=[...new Set([...porSap,...porNom])].map(p=>({codigo:p.codigo,nombre:p.nombre}));
      codigo='';
    }
    return {...i,estado,codigo,opciones};
  });
}
async function leerOCpdf(){
  const inp=document.getElementById('oc-pdf');
  const f=inp&&inp.files[0];
  if(!f){toast('Elige el PDF de la orden de compra.');return}
  velo(true,'Leyendo el PDF…');
  try{
    const h=await huella(f);
    const reg=(DB[ARCH.arch]&&DB[ARCH.arch].data.archivos)||[];
    const previo=reg.find(r=>r.hash===h);
    const pdfjs=await cargarPdfJs();
    const doc=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    const pags=[];
    for(let p=1;p<=doc.numPages;p++){
      const c=await (await doc.getPage(p)).getTextContent();
      pags.push(c.items.map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width})));
    }
    const lineas=lineasDePdf(pags);
    if(!lineas.length){velo(false);toast('El PDF no tiene texto legible: es una imagen escaneada. Súbelo a la cola para que lo procese el administrador.');return}
    const oc=parseOC(lineas);
    oc.items=consolidarOC(oc.items);
    ocLeida={...oc,archivo:f,hash:h,previo:previo||null,
             errores:validarOC(oc),resueltos:resolverItems(oc.items),
             fecha_carga:hoyISO(),fecha_entrega:fechaCompromiso()};
    render();
    toast(ocLeida.errores.length?'Leído con observaciones: revísalas antes de guardar.':'PDF leído. Revisa y confirma.');
  }catch(e){toast('No se pudo leer el PDF: '+e.message)}
  velo(false);
}

function fijarCodigo(pos,val){const r=ocLeida.resueltos.find(x=>x.pos===pos);if(r)r.codigo=val}

    (DB[ARCH.arch].data.archivos).push({hash:o.hash,nombre:o.archivo.name,tipo:'ordenes_compra',

    await guardarArchivo(ARCH.prod,`Maestro: productos de la OC ${o.folio}`);
    await guardarArchivo(ARCH.oc,`OC ${o.folio} cargada desde el PDF`);
    await guardarArchivo(ARCH.arch,`Registro de archivos: OC ${o.folio}`);
    // Match automático contra las cotizaciones abiertas (Jefe, 31-07-2026)
    const nueva=DB[ARCH.oc].data.ordenes.find(x=>String(x.folio)===String(o.folio));
    /* Guías que ya se habían cargado apuntando a esta OC cuando todavía no existía en el
       sistema (Jefe, 20-08-2026). Se les imputa aquí lo despachado y su compra implícita.

    let recon=0;
    if(nueva){
      for(const g of DB[ARCH.guias].data.guias.filter(x=>String(x.oc||x.folio_oc||'')===String(o.folio))){
        for(const it of (g.items||[])){
          const oi=nueva.items.find(x=>x.codigo===it.codigo)
                ||nueva.items.find(x=>String(x.producto).trim().toUpperCase()===String(it.producto).trim().toUpperCase());

          oi.cantidad_comprada=Math.max(+oi.cantidad_comprada||0,+oi.cantidad_despachada||0);
        }
        nueva.guias=[...new Set([...(nueva.guias||[]),String(g.numero)])];
        if(g.notas)g.notas=g.notas.replace(/Cargada sin OC en el sistema: falta registrar la OC \d+\.?\s*/,'').trim()||null;
        recon++;
      }
      if(recon){
        await guardarArchivo(ARCH.oc,`OC ${o.folio}: ${recon} guía(s) ya cargada(s) reconciliada(s)`);
        await guardarArchivo(ARCH.guias,`Guía(s) de la OC ${o.folio}: OC registrada`);
      }
    }
    const res=nueva?adjudicarOCAuto(nueva):{auto:0,sug:0,sin:0};
    if(res.auto)await guardarArchivo(ARCH.adj,`OC ${o.folio}: ${res.auto} línea(s) adjudicada(s) automáticamente a cotización`);
    ocLeida=null;
    toast(`Orden de compra ${o.folio} cargada`+(recon?` · ${recon} guía(s) ya cargada(s) reconciliada(s)`:'')+(res.auto?` · ${res.auto} línea(s) adjudicada(s) a cotización`:'')+(res.sug?` · ${res.sug} por confirmar`:''));
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* ================= Adjudicación cotización → OC (Jefe, 31-07-2026) =================
   Libro único en adjudicaciones.json. Cada registro consume saldo de UNA línea de cotización
   a favor de UNA línea de OC. Saldos y estados SIEMPRE derivados del libro, nunca guardados.
   Jerarquía de match acordada: puerta de entrada = código NOV/SAP (el ~11% de los precios se
   repite entre productos distintos, por eso el precio no puede ir primero sin esta puerta).
   Dentro de la puerta: 1) PRECIO, el más fuerte — idéntico (±$1) habilita match automático;
   distinto NUNCA es automático (caso FOCO: mismo código, productos distintos). 2) CANTIDAD —
   igual suma fuerte, distinta no descarta (parciales son lo normal; una línea de OC puede
   consumir varias líneas de cotización en cascada: caso 9 = 3 + 6). 3) BODEGA — filtro duro
   solo en cotizaciones XLSX (vienen de SAP del cliente); en nuestros PDF es observación manual
   y pesa poco. 4) NOMBRE — el más débil, solo desempate. La RECENCIA ordena la búsqueda.

   VENTANA TEMPORAL (Jefe, 04-08-2026) — SEGUNDA PUERTA, tan dura como el código.
   Entre la emisión de la cotización y la emisión de la OC pasa SIEMPRE el mismo mes, y como
   mucho el mes inmediatamente anterior. Una cotización de hace tres meses NO es candidata:
   si el cliente no compró dentro de esa ventana, esa oferta ya venció y lo que llegue después
   nació de otra cotización. Por eso el desfase de meses dejó de ser puntaje (antes solo sumaba
   +12/+6) y pasó a ser FILTRO: delta 0 (mismo mes) o 1 (mes anterior) entran; el resto queda
   fuera del pool. Dentro de la ventana, la cercanía en días sigue puntuando.
   Si falta la fecha en la OC o en la cotización, la puerta no se aplica (no se descarta a ciegas).
   Como todo filtro de pool, gobierna solo las búsquedas FUTURAS: lo ya adjudicado se conserva. */
const ADJ_MESES_ATRAS=1;                                    // 0 = mismo mes · 1 = admite el mes anterior
function mesIdx(f){const m=/^(\d{4})-(\d{2})/.exec(String(f||''));return m?(+m[1])*12+(+m[2]-1):null}
/* delta de meses entre la OC y la cotización. null = no se puede calcular → no se filtra. */
function desfaseMeses(oc,c){const a=mesIdx(oc.fecha_emision),b=mesIdx(c.fecha);
  return (a===null||b===null)?null:a-b}
function dentroVentana(oc,c){const d=desfaseMeses(oc,c);
  return d===null||(d>=0&&d<=ADJ_MESES_ATRAS)}
function adjRegistros(){return DB[ARCH.adj].data.registros}
function adjDescartes(){return DB[ARCH.adj].data.descartes}
function consumosDeLinea(cotId,idx){return adjRegistros().filter(r=>r.cot===cotId&&r.cot_idx===idx)}
function saldoLinea(c,idx){const it=c.items[idx]||{};
  return Math.max((+it.cantidad||0)-consumosDeLinea(c.id,idx).reduce((s,r)=>s+(+r.cantidad||0),0),0)}
function adjDeOCLinea(folio,idx){return adjRegistros().filter(r=>r.oc===String(folio)&&r.oc_idx===idx)}
function lineaSinCotizacion(folio,idx){return adjDescartes().some(d=>d.oc===String(folio)&&d.oc_idx===idx)}
function cotAdjudicacion(c){let adj=0,parc=0;
  c.items.forEach((it,i)=>{const s=saldoLinea(c,i),t=+it.cantidad||0;
    if(t>0&&s<=0)adj++;else if(t>0&&s<t)parc++});
  return {adj,parc,total:c.items.length}}
function simNombre(a,b){a=normProd(a);b=normProd(b);if(!a||!b)return 0;if(a===b)return 1;
  if(a.includes(b)||b.includes(a))return .92;
  const ta=new Set(a.split(' ')),tb=new Set(b.split(' '));let inter=0;ta.forEach(t=>{if(tb.has(t))inter++});
  const uni=new Set([...ta,...tb]).size;return uni?inter/uni:0}
function candidatosParaLinea(oc,li,ignorarVentana=false){
  const out=[];
  DB[ARCH.cot].data.cotizaciones.forEach(c=>{
    if(c.estado!=='abierta')return;                                    // cerradas y rechazadas fuera del pool
    /* Las cotizaciones de PRUEBA no participan NUNCA del match (Jefe, 09-08-2026). Son de
       prueba justamente para no interferir con la operación: si compiten por una OC real,
       ensucian la adjudicacion y consumen saldos que no existen. Antes se dejaban competir y
       se soltaban al archivarlas; eso estaba mal, el dano ya estaba hecho mientras tanto. */
    if(c.prueba===true)return;
    if(String(c.fecha||'')>String(oc.fecha_emision||'9999-12-31'))return; // posterior a la OC: imposible
    if(!ignorarVentana&&!dentroVentana(oc,c))return;                   // PUERTA: mismo mes o el anterior
    const esXlsx=/^COT-XLSX/i.test(String(c.id));
    c.items.forEach((it,i)=>{
      if(saldoLinea(c,i)<=0)return;
      const codOk=li.codigo&&li.codigo===it.codigo,
            sapOk=li.codigo_sap&&it.codigo_sap&&li.codigo_sap===it.codigo_sap;
      if(!codOk&&!sapOk)return;                                        // PUERTA: código NOV/SAP
      if(esXlsx&&it.bodega&&normBodega(it.bodega)!==normBodega(oc.destino))return; // bodega dura solo XLSX
      const p1=+li.precio_unitario||0,p2=+it.precio_unitario||0;
      const precioOk=p1>0&&p2>0&&Math.abs(p1-p2)<=1;
      const dias=Math.round((new Date(oc.fecha_emision||0)-new Date(c.fecha||0))/864e5);
      const sc=50+(precioOk?30:0)
        +((+li.cantidad||0)===(+it.cantidad||0)?10:0)
        +(it.bodega?(esXlsx?10:4):0)
        +(dias>=0&&dias<=15?12:dias<=45?8:5)   // dentro de la ventana la cercanía solo matiza
        +Math.round(simNombre(li.producto,it.producto)*6);
      out.push({sc,precioOk,cot:c,idx:i,it});
    });
  });
  return out.sort((a,b)=>b.sc-a.sc||String(b.cot.fecha||'').localeCompare(String(a.cot.fecha||'')));
}
/* Adjudica en cascada las líneas de una OC recién guardada. Solo escribe en memoria;
   quien llama decide cuándo persistir ARCH.adj. Devuelve cuántas quedaron en cada estado. */
function adjudicarOCAuto(o){
  let auto=0,sug=0,sin=0;
  (o.items||[]).forEach((li,oi)=>{
    if(adjDeOCLinea(o.folio,oi).length||lineaSinCotizacion(o.folio,oi))return;
    const cands=candidatosParaLinea(o,li);
    if(!cands.length){sin++;return}
    if(cands[0].precioOk&&cands[0].sc>=90){
      let pend=+li.cantidad||0;
      for(const cd of cands){
        if(pend<=0||!cd.precioOk||cd.sc<80)break;
        const t=Math.min(pend,saldoLinea(cd.cot,cd.idx));if(t<=0)continue;
        adjRegistros().push({oc:String(o.folio),oc_idx:oi,cot:cd.cot.id,cot_idx:cd.idx,
          codigo:li.codigo||null,cantidad:t,origen:'auto',fecha:hoyISO()});
        pend-=t;
      }
      auto++;
    }else sug++;
  });
  return {auto,sug,sin};
}
async function adjConfirmar(fe,oi){
  const folio=decodeURIComponent(fe);
  const o=DB[ARCH.oc].data.ordenes.find(x=>String(x.folio)===folio);if(!o)return;
  const li=o.items[oi];if(!li)return;
  const cands=candidatosParaLinea(o,li);if(!cands.length){toast('Ya no hay candidatos con saldo.');render();return}
  let pend=+li.cantidad||0;const usados=[];
  for(const cd of cands){
    if(pend<=0)break;
    if(cd.sc<cands[0].sc-15)break;                       // consume solo candidatos comparables al mejor
    const t=Math.min(pend,saldoLinea(cd.cot,cd.idx));if(t<=0)continue;
    adjRegistros().push({oc:String(o.folio),oc_idx:oi,cot:cd.cot.id,cot_idx:cd.idx,
      codigo:li.codigo||null,cantidad:t,origen:'manual',fecha:hoyISO()});
    usados.push(cd);pend-=t;
  }
  if(!usados.length){toast('Ya no hay saldo disponible en las cotizaciones candidatas.');render();return}
  velo(true,'Guardando la adjudicación…');
  try{await guardarArchivo(ARCH.adj,`OC ${folio}: línea "${li.producto}" adjudicada a ${[...new Set(usados.map(u=>u.cot.folio))].join(', ')}`);
    toast('Línea adjudicada');render()}catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
async function adjSinCotizacion(fe,oi){
  const folio=decodeURIComponent(fe);
  const o=DB[ARCH.oc].data.ordenes.find(x=>String(x.folio)===folio);if(!o)return;
  adjDescartes().push({oc:folio,oc_idx:oi,fecha:hoyISO()});
  velo(true);
  try{await guardarArchivo(ARCH.adj,`OC ${folio}: línea ${oi+1} confirmada sin cotización`);render()}
  catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
async function adjQuitarLinea(fe,oi){
  const folio=decodeURIComponent(fe);
  const d=DB[ARCH.adj].data;
  const antes=d.registros.length+d.descartes.length;
  d.registros=d.registros.filter(r=>!(r.oc===folio&&r.oc_idx===oi));
  d.descartes=d.descartes.filter(r=>!(r.oc===folio&&r.oc_idx===oi));
  if(d.registros.length+d.descartes.length===antes)return;
  velo(true);
  try{await guardarArchivo(ARCH.adj,`OC ${folio}: línea ${oi+1} desvinculada (saldo restituido)`);render()}
  catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
function cotPorId(id){return DB[ARCH.cot].data.cotizaciones.find(c=>c.id===id)}
/* Guías de despacho que movieron ESTA línea de la OC (Jefe, 23-08-2026). Reemplaza a la
   columna "Cotización": vincular OC con cotización casi nunca funciona por cómo trabaja el
   cliente, y en cambio saber por qué guía salió cada línea sí se usa todos los días.
   Se emparejan por código y, si la línea no lo trae, por nombre. Con varias guías se listan
   separadas por guiones, en el orden en que salieron. Cada número lleva su fecha al pasar
   el puntero. La adjudicación a cotizaciones sigue existiendo por debajo (`adjudicaciones.json`
   y el match automático); lo que se quitó es su acceso desde esta tabla. */
function guiasDeLineaOC(folio,li){
  const cod=li.codigo||null;
  const nom=String(li.producto||'').trim().toUpperCase();
  return DB[ARCH.guias].data.guias
    .filter(g=>String(g.oc||g.folio_oc||'')===String(folio))
    .filter(g=>(g.items||[]).some(i=>(cod&&i.codigo===cod)
      ||(!cod&&String(i.producto||'').trim().toUpperCase()===nom)))
    .map(g=>({numero:g.numero,fecha:g.fecha,
      cant:(g.items||[]).filter(i=>(cod&&i.codigo===cod)
        ||(!cod&&String(i.producto||'').trim().toUpperCase()===nom))
        .reduce((s,i)=>s+(+i.cantidad||0),0)}))
    .sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||''))||String(a.numero).localeCompare(String(b.numero)));
}
function celdaGuiasOC(o,li){
  const gs=guiasDeLineaOC(o.folio,li);
  if(!gs.length)return '<span class="muted small">sin guía</span>';
  return gs.map(g=>`<span class="mono" title="Guía N°${esc(g.numero)} · emitida el ${fFecha(g.fecha)} · ${num(g.cant)} en esta línea">${esc(g.numero)}</span>`).join(' - ');
}
/* Celda "Cotización" de la tabla de ítems de una OC (Jefe, 31-07-2026: columna al final de la
   tabla, no tarjetas aparte, para no abultar la ficha). Muestra el vínculo o las acciones. */
function celdaAdjOC(o,li,oi){
  if(o.origen!=='oc')return '<span class="muted small">—</span>';
  const fe=encodeURIComponent(o.folio);
  const regs=adjDeOCLinea(o.folio,oi);
  if(regs.length){
    const refs=regs.map(r=>{const c=cotPorId(r.cot);
      return `<span class="chip verde" title="${esc(c?c.items[r.cot_idx]?.producto||'':'')} · ${clp(c?+(c.items[r.cot_idx]||{}).precio_unitario||0:0)}">COT ${esc(c?c.folio:r.cot)} ×${num(r.cantidad)}</span>`}).join(' ');
    return `${refs} <button class="btn mini sec" onclick="adjQuitarLinea('${fe}',${oi})" title="Quita el vínculo y restituye el saldo de la cotización">Quitar</button>`;
  }
  if(lineaSinCotizacion(o.folio,oi))
    return `<span class="chip">sin cotización</span> <button class="btn mini sec" onclick="adjQuitarLinea('${fe}',${oi})">Deshacer</button>`;
  const cands=candidatosParaLinea(o,li);
  if(!cands.length){
    // Distinguir "no existe" de "existe pero quedó fuera de la ventana": son problemas distintos.
    const viejos=candidatosParaLinea(o,li,true).filter(cd=>!dentroVentana(o,cd.cot));
    const tit=viejos.length
      ? `Hay ${viejos.length} línea(s) con el mismo código en cotizaciones anteriores a la ventana (COT ${[...new Set(viejos.map(v=>v.cot.folio))].slice(0,3).join(', ')}). Quedan fuera: entre cotización y OC pasa el mismo mes o el anterior.`
      : 'No hay ninguna cotización abierta con este código y saldo disponible.';
    return `<span class="chip rojo" title="${esc(tit)}">sin match${viejos.length?' (fuera de ventana)':''}</span> <button class="btn mini sec" onclick="adjSinCotizacion('${fe}',${oi})" title="Confirma que esta línea no nació de una cotización del sistema">Sin cotización</button>`;
  }
  const cd=cands[0],c=cd.cot;
  const dif=!cd.precioOk?` · precio distinto: ${clp(+li.precio_unitario||0)} en la OC vs ${clp(+cd.it.precio_unitario||0)} cotizado`:'';
  return `<span class="chip ambar" title="${esc(cd.it.producto)} · ${fFecha(c.fecha)} · saldo ${num(saldoLinea(c,cd.idx))}${dif}">sugerido: COT ${esc(c.folio)}${!cd.precioOk?' (revisar precio)':''}</span>
    <button class="btn mini" onclick="adjConfirmar('${fe}',${oi})">Adjudicar</button>
    <button class="btn mini sec" onclick="adjSinCotizacion('${fe}',${oi})">Sin cotización</button>`;
}
function rCot(){
  // Más reciente primero (Jefe, 24-07-2026): por fecha desc; a igual fecha, se respeta el orden de carga.
  const cs=[...DB[ARCH.cot].data.cotizaciones]
    .map((c,i)=>[c,i])
    .sort((a,b)=>String(b[0].fecha||'').localeCompare(String(a[0].fecha||''))||b[1]-a[1])
    .map(x=>x[0]);
  return `${dlProd()}
  ${formCotizacion()}
  ${formPendiente('cotizaciones','.pdf,.xls,.xlsx,.doc,.docx,.jpg,.jpeg,.png')}
  ${listaPend('cotizaciones')}
  ${cs.length?barraFichas():''}
  ${cs.length?renderMeses('cot',agruparPorMes(cs,c=>c.fecha),([k,items])=>accMes('cot:'+k,mesLbl(k),
      `${items.length} documento${items.length===1?'':'s'}`,
      items.map(c=>{
    const est={abierta:'chip ink',cerrada:'chip',rechazada:'chip rojo'}[c.estado]||'chip';
    const neto=c.items.reduce((s,i)=>s+i.cantidad*i.precio_unitario,0);
    const adj=cotAdjudicacion(c);
    const ocsAdj=[...new Set(adjRegistros().filter(r=>r.cot===c.id).map(r=>r.oc))];
    return `<div class="card">
      <details class="doc" data-k="cot:${esc(c.id)}"${fichaAbierta('cot:'+c.id)?' open':''} ontoggle="recordarFicha(this)">
      <summary class="top" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:2px">

async function borrarCot(id){
  const arr=DB[ARCH.cot].data.cotizaciones;const c=arr.find(x=>x.id===id);if(!c)return;
  const regs=adjRegistros().filter(r=>r.cot===id);
  const ocs=[...new Set(regs.map(r=>r.oc))];
  let texto='Esta acción no se puede deshacer.';
  if(regs.length)texto=`Tiene ${regs.length} adjudicación(es) hacia la(s) OC ${ocs.join(', ')}. Al eliminarla, esas líneas de OC quedarán otra vez sin cotización.\n\nEsta acción no se puede deshacer.`;
  if(!await confirmar({titulo:`Eliminar la cotización ${c.folio}`,texto,confirmar:'Eliminar',peligro:true}))return;
  velo(true,'Eliminando…');
  try{
    arr.splice(arr.indexOf(c),1);
    if(regs.length){
      const d=DB[ARCH.adj].data;
      d.registros=d.registros.filter(r=>r.cot!==id);
      await guardarArchivo(ARCH.adj,`Adjudicaciones liberadas por eliminación de cotización ${c.folio}`);
    }
    await guardarArchivo(ARCH.cot,`Cotización ${c.folio} eliminada`);
    if(c.archivo)await borrarArchivoRepo(c.archivo,`Borrado documento de cotización ${c.folio}`);
    toast('Cotización eliminada');render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

/* Los folios de Facto suben junto con la fecha, sin excepción. Si una cotización está
   fechada antes que la de folio inmediatamente anterior, o después que la del folio
   siguiente, algo pasó: casi siempre un documento duplicado que se quedó con la fecha del
   original. Detectarlo importa porque la ventana temporal del match usa la fecha como
   puerta, y una fecha vieja deja fuera de juego a una cotización vigente.
   Se compara solo con los VECINOS inmediatos de folio, no con toda la lista: comparar
   contra todas hace que una sola fecha mala marque como sospechosas a decenas de fichas
   sanas, y un aviso que aparece en todas partes deja de mirarse.
   Solo aplica a cotizaciones con folio numérico: los consolidados XLSX no tienen folio. */
function cotFechaSospechosa(c){
  const fol=x=>/^\d+$/.test(String(x.folio||''))?+x.folio:null;
  const f=fol(c);
  if(!f||!c.fecha||c.reemplaza_a)return null;      // ya declarada como recotización: sin ruido
  const otras=DB[ARCH.cot].data.cotizaciones.filter(x=>x!==c&&fol(x)&&x.fecha);
  let ant=null,sig=null;
  otras.forEach(x=>{const g=fol(x);
    if(g<f&&(!ant||g>fol(ant)))ant=x;
    if(g>f&&(!sig||g<fol(sig)))sig=x;});
  if(ant&&String(c.fecha)<String(ant.fecha))return ant;
  if(sig&&String(c.fecha)>String(sig.fecha))return sig;
  return null;
}

/* ══════ RECOTIZACIÓN ══════
   El vendedor rehace una cotización DUPLICANDO el documento anterior en Facto: cambia el
   correlativo y los precios, pero se le queda la FECHA vieja (caso COT 831, folio posterior
   al 829 del 21-07 y fechada 10-06). Eso no se arregla borrando y recargando, porque el
   error viene impreso en el PDF: hay que poder corregirlo en el sistema.
   Y la fecha no es cosmética: la ventana temporal del match (mismo mes o el anterior) la usa
   como puerta, así que una fecha vieja deja la cotización vigente fuera de las OC nuevas.
   Al declarar el reemplazo se cierra la anterior, porque si compiten las dos ninguna
   empareja sola: mismo código con precio distinto nunca es match automático. */
function panelRecot(id){
  const C=DB[ARCH.cot].data.cotizaciones, c=C.find(x=>x.id===id); if(!c)return;
  const box=document.getElementById('rc-'+id);
  if(box.innerHTML){box.innerHTML='';return}
  const cods=new Set(c.items.map(i=>i.codigo).filter(Boolean));
  // Candidatas: anteriores y con al menos un producto en común. Es lo que hace una
  // recotización; ofrecer la lista completa solo invita a equivocarse.
  const cand=C.filter(x=>x.id!==id&&String(x.fecha||'')<=String(c.fecha||'9999')
      &&x.items.some(i=>cods.has(i.codigo)))
    .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  box.innerHTML=`<div style="border-top:1.5px dashed var(--line);margin-top:12px;padding-top:10px">
    <b>Recotización de ${esc(c.folio)}</b>
    <p class="small muted">Cuando el vendedor rehace una cotización duplicando el documento, se arrastra la fecha vieja. Corrígela aquí: la fecha decide con qué órdenes de compra puede emparejar.</p>
    <label>Fecha real de emisión</label>
    <input type="date" id="rc-f-${esc(id)}" value="${esc(c.fecha||'')}">
    <label>Reemplaza a</label>
    <select id="rc-r-${esc(id)}">
      <option value="">— no reemplaza a ninguna —</option>
      ${cand.map(x=>`<option value="${esc(x.id)}"${c.reemplaza_a===x.id?' selected':''}>COT ${esc(x.folio)} · ${fFecha(x.fecha)} · ${esc(x.estado)} · ${x.items.length} línea(s)</option>`).join('')}
    </select>
    ${cand.length?'<p class="small muted">Al guardar, la cotización reemplazada se cierra. Se puede reabrir cuando quieras.</p>':'<p class="small muted">No hay cotizaciones anteriores con productos en común.</p>'}
    <div class="acciones"><button class="btn mini" onclick="guardarRecot('${esc(id)}')">Guardar</button>
    <button class="btn mini sec" onclick="panelRecot('${esc(id)}')">Cancelar</button></div>
  </div>`;
}
async function guardarRecot(id){
  const C=DB[ARCH.cot].data.cotizaciones, c=C.find(x=>x.id===id); if(!c)return;
  const f=(document.getElementById('rc-f-'+id).value||'').trim();
  const rid=document.getElementById('rc-r-'+id).value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){toast('Indica la fecha real de emisión.');return}
  const vieja=rid?C.find(x=>x.id===rid):null;
  if(rid&&!vieja){toast('No encontré la cotización reemplazada.');return}
  if(vieja&&String(vieja.fecha||'')>f){toast(`La ${vieja.folio} es del ${fFecha(vieja.fecha)}: una recotización no puede ser anterior a la que reemplaza.`);return}
  const cambioF=f!==c.fecha;
  if(!await confirmar({titulo:`Recotización ${c.folio}`,
    texto:`${cambioF?`La fecha pasa de ${fFecha(c.fecha)} a ${fFecha(f)}, lo que cambia con qué OC puede emparejar.`:'La fecha no cambia.'}${vieja?`\nLa cotización ${vieja.folio} quedará cerrada.`:''}`,
    confirmar:'Guardar'}))return;
  velo(true,'Guardando…');
  try{
    if(cambioF){
      c.notas=(c.notas?c.notas+' ':'')+`Fecha corregida de ${c.fecha} a ${f} el ${hoyISO()}: el documento se duplicó de una cotización anterior y arrastró la fecha vieja.`;
      c.fecha=f;
    }
    // Soltar un reemplazo anterior si se cambió de opinión
    if(c.reemplaza_a&&c.reemplaza_a!==rid){
      const p=C.find(x=>x.id===c.reemplaza_a); if(p)delete p.reemplazada_por;
    }
    if(vieja){
      c.reemplaza_a=vieja.id; vieja.reemplazada_por=c.id;
      if(vieja.estado==='abierta'){
        vieja.estado='cerrada';
        vieja.notas=(vieja.notas?vieja.notas+' ':'')+`Cerrada el ${hoyISO()}: recotizada en la ${c.folio}.`;
      }
    } else delete c.reemplaza_a;
    await guardarArchivo(ARCH.cot,`Recotización: ${c.folio}${cambioF?` con fecha ${f}`:''}${vieja?` reemplaza a ${vieja.folio}`:''}`);
    toast(`${c.folio} actualizada${vieja?`; ${vieja.folio} cerrada`:''}.`);
    render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

let ocFiltro='';
/* TODAS las órdenes de compra en una sola lista y con la misma forma, vengan de un documento
   cargado o del reporte SAP del cliente: la fuente del archivo no cambia cómo se trata una OC
   (Jefe, 22-07-2026). Cada ítem lleva `ref`, el objeto donde se escriben las compras, para que
   registrar una compra funcione igual en ambos casos. */
/* Arma la lista que ve la pantalla mezclando las OC reales con las del reporte SAP.
   OJO: 'ref' apunta al registro original para poder editarlo desde la vista, y por eso esta
   funcion NO PUEDE tocar los datos de DB. Antes hacia o.items.forEach(i=>{i.ref=i}), que
   modificaba los items REALES y dejaba cada uno apuntandose a si mismo: desde el momento en
   que se abria la pestana de OC, cualquier intento de guardar reventaba con "Converting
   circular structure to JSON". El error aparecia al guardar una OC, pero la causa era solo
   haber MIRADO la lista antes. Ahora se copian los items y la referencia vive en la copia. */
function ordenesUnificadas(){
  const reales=DB[ARCH.oc].data.ordenes.map(o=>{
    const items=(o.items||[]).map(i=>Object.assign(Object.create(null),i,{ref:i}));
    return Object.assign(Object.create(null),o,{items,origen:'oc',ref:o});
  });
  const folios=new Set(reales.map(o=>String(o.folio)));
  const porFolio={};
  ((DB[ARCH.psap]&&DB[ARCH.psap].data.registros)||[]).forEach(r=>{
    const f=String(r.doc_compras||'');
    if(!f||folios.has(f))return;              // si ya está su documento, manda el documento
    (porFolio[f]=porFolio[f]||[]).push(r);
  });
  const delReporte=Object.keys(porFolio).map(folio=>{
    const rs=porFolio[folio];
    return {folio,origen:'sap',sin_documento:true,
      fecha_emision:rs[0].fecha_doc,fecha_entrega:null,
      fecha_carga:(DB[ARCH.psap].data.actualizado||rs[0].fecha_doc),
      destino:[...new Set(rs.map(r=>r.bodega).filter(Boolean))].join(' · '),
      items:rs.map(r=>({producto:r.producto,codigo:r.codigo,
        cantidad:+r.cantidad||0,
        cantidad_comprada:+r.cantidad_comprada||0,
        // el cliente dice cuánto le queda por entregar: la diferencia es lo ya despachado
        cantidad_despachada:Math.max((+r.cantidad||0)-(+r.por_entregar||0),0),
        precio_unitario:+r.precio_neto||0,ref:r})),
      ref:rs};
  });
  return [...reales,...delReporte]
    // Orden por FECHA DE CARGA, no de emisión (Jefe, 24-07-2026): lo último que se subió al
    // sistema queda arriba, aunque el documento sea antiguo. Si falta, cae a la emisión.
    .sort((a,b)=>String(b.fecha_carga||b.fecha_emision||'').localeCompare(String(a.fecha_carga||a.fecha_emision||''))
              ||String(b.folio).localeCompare(String(a.folio),'es',{numeric:true}));
}

async function borrarOC(fe){
  const folio=decodeURIComponent(fe);
  const arr=DB[ARCH.oc].data.ordenes;const o=arr.find(x=>x.folio===folio);if(!o)return;
  if(o.guias?.length){toast(`La OC ${folio} tiene guías asociadas (${o.guias.join(', ')}). Elimina primero esas guías.`);return}
  const comprasBod=(o.compras||[]).filter(c=>c.ingreso_bodega);
  const adjOC=adjRegistros().filter(r=>r.oc===String(folio)).length+adjDescartes().filter(r=>r.oc===String(folio)).length;
  let msg='';
  if(comprasBod.length)msg+=`Se revertirán del inventario los ingresos de sus ${comprasBod.length} compra(s) registrada(s).\n`;
  if(adjOC)msg+='Sus adjudicaciones a cotizaciones se eliminarán y el saldo de esas líneas quedará disponible otra vez.';
  if(!await confirmar({titulo:`Dar de baja la OC ${folio}`,texto:msg||'La orden quedará dada de baja.',confirmar:'Dar de baja',peligro:true}))return;
  velo(true,'Dando de baja…');
  try{
    const inv=DB[ARCH.inv].data;
    comprasBod.forEach(cp=>cp.items.forEach(it=>{
      const p=invProdDe(it.producto,null,false);
      if(p){p.cantidad-=it.cantidad;
        inv.movimientos.push({fecha:hoyISO(),tipo:'ajuste',codigo:p.codigo,producto:p.nombre,cantidad:-it.cantidad,referencia:`Reverso por baja de OC ${folio}`})}
    }));
    if(adjOC){
      const d=DB[ARCH.adj].data;
      d.registros=d.registros.filter(r=>r.oc!==String(folio));
      d.descartes=d.descartes.filter(r=>r.oc!==String(folio));
    }
    arr.splice(arr.indexOf(o),1);
    await guardarArchivo(ARCH.oc,`OC ${folio} dada de baja`);
    if(adjOC)await guardarArchivo(ARCH.adj,`Adjudicaciones de la OC ${folio} liberadas por su baja`);
    if(comprasBod.length)await guardarArchivo(ARCH.inv,`Inventario: reverso por baja de OC ${folio}`);
    if(o.archivo)await borrarArchivoRepo(o.archivo,`Borrado documento de OC ${folio}`);
    toast(`OC ${folio} dada de baja`);render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
async function borrarGuia(numero){
  const arr=DB[ARCH.guias].data.guias;const g=arr.find(x=>x.numero===numero);if(!g)return;
  const hoja=hojaDeGuia(g);
  let msg=`¿Eliminar la guía N°${numero}?\n\nSe devolverán sus cantidades al inventario y al pendiente de la OC ${g.folio_oc}.`;
  if(hoja){
    const quedan=(hoja.guias||[]).filter(n=>String(n)!==String(numero)).length;
    msg+=`\n\nSe quitará de ${hrLbl(hrTipo(hoja))} N°${hoja.numero} (envío ${fFecha(hoja.fecha_envio||hoja.fecha)}), que quedará con ${quedan} guía(s).`;
    msg+=`\nSi la vuelves a ingresar con esa misma fecha de envío, se reincorpora a la misma hoja y conserva el N°${hoja.numero}.`;
  }
  if(!await confirmar({titulo:`Eliminar la guía N°${numero}`,texto:msg,confirmar:'Eliminar',peligro:true}))return;
  velo(true,'Eliminando guía…');
  try{
    const o=DB[ARCH.oc].data.ordenes.find(x=>x.folio===g.folio_oc);
    if(o){
      g.items.forEach(it=>{
        const oi=o.items.find(x=>x.producto.trim().toLowerCase()===it.producto.trim().toLowerCase());
        if(oi)oi.cantidad_despachada=Math.max(0,(+oi.cantidad_despachada||0)-it.cantidad);
      });
      o.guias=(o.guias||[]).filter(n=>n!==numero);
    }
    const inv=DB[ARCH.inv].data;
    g.items.forEach(it=>{
      const p=invProdDe(it.producto);
      p.cantidad+=it.cantidad;
      inv.movimientos.push({fecha:hoyISO(),tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:it.cantidad,referencia:`Reverso por eliminación de guía N°${numero}`});
    });
    // Desenganchar de la hoja de ruta: la hoja conserva su número y fecha de envío,
    // de modo que al reingresar la guía con esa misma fecha vuelve a esta misma hoja.
    if(hoja){
      hoja.guias=(hoja.guias||[]).filter(n=>String(n)!==String(numero));
      const dest=new Set();
      hoja.guias.forEach(n=>{const gg=arr.find(x=>String(x.numero)===String(n));if(gg&&gg.destino)dest.add(normBodega(gg.destino))});
      hoja.destinos=[...dest];
      hoja.estado='borrador';
      hoja.archivo=null;
    }
    arr.splice(arr.indexOf(g),1);
    await guardarArchivo(ARCH.guias,`Guía N°${numero} eliminada`);
    if(o)await guardarArchivo(ARCH.oc,`OC ${g.folio_oc}: reverso de guía N°${numero}`);
    await guardarArchivo(ARCH.inv,`Inventario: reverso de guía N°${numero}`);
    if(hoja)await guardarArchivo(ARCH.hr,`${hrLbl(hrTipo(hoja))} N°${hoja.numero}: quitada la guía N°${numero}, pendiente de regenerar`);
    toast(`Guía N°${numero} eliminada y cantidades devueltas`);render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}

async function guardarCompra(fe){
  const folio=decodeURIComponent(fe);
  const o=ordenPorFolio(folio);if(!o)return;
  const box=document.getElementById('fc-'+fe);
  const prov=document.getElementById('pc-prov-'+fe).value.trim();
  const fecha=document.getElementById('pc-fecha-'+fe).value||hoyISO();
  const aBodega=document.getElementById('pc-bod-'+fe).checked;
  const filas=[...box.querySelectorAll('input[type=number]')].map(inp=>({ix:+inp.dataset.ix,cant:+inp.value||0})).filter(f=>f.cant>0);
  if(!filas.length){toast('Indica al menos una cantidad comprada.');return}
  velo(true,'Registrando compra…');
  try{
    const itemsC=filas.map(f=>({producto:o.items[f.ix].producto,cantidad:f.cant}));
    // Se puede comprar MÁS de lo pedido (buen precio): a la OC se imputa solo hasta el
    // pendiente; el excedente entra al inventario como stock libre, sin inflar la OC.
    let sobra=0;
    filas.forEach(f=>{
      const it=o.items[f.ix], r=it.ref;
      const pend=Math.max((+it.cantidad||0)-(+r.cantidad_comprada||0),0);
      const imputa=Math.min(f.cant,pend);
      r.cantidad_comprada=(+r.cantidad_comprada||0)+imputa;
      sobra+=f.cant-imputa;
    });
    if(o.origen==='oc'){o.ref.compras=o.ref.compras||[];
      o.ref.compras.push({fecha,proveedor:prov,ingreso_bodega:aBodega,items:itemsC})}
    if(aBodega){
      const inv=DB[ARCH.inv].data;
      itemsC.forEach(it=>{
        const p=invProdDe(it.producto);
        p.cantidad+=it.cantidad;
        inv.movimientos.push({fecha,tipo:'ingreso',codigo:p.codigo,producto:p.nombre,cantidad:it.cantidad,referencia:`Compra OC ${folio}${prov?' · '+prov:''}${sobra>0?' (incluye sobrestock)':''}`});
      });
      await guardarMaestroSiNuevo();
    }
    await guardarArchivo(o.origen==='oc'?ARCH.oc:ARCH.psap,`OC ${folio}: compra registrada${prov?' ('+prov+')':''}`);
    if(aBodega)await guardarArchivo(ARCH.inv,`Inventario: ingreso por compra OC ${folio}`);
    toast('Compra registrada'+(sobra>0?` · ${num(sobra)} sobre lo pedido quedan como stock libre`:''));render();
  }catch(e){if(e.message!=='conflicto')toast('Error: '+e.message)}
  velo(false);
}
